<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- Single Peripheral System (Top) -->
  <text x="40" y="40" fill="#E2E8F0" font-size="11" font-weight="bold">Scenario A: Single Peripheral Loop</text>
  
  <rect x="40" y="55" width="100" height="26" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
  <text x="90" y="71" fill="#3B82F6" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">CheckButton()</text>
  
  <path d="M 140 68 H 200" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1" stroke-dasharray="2,2" />
  <path d="M 200 68 V 50 H 40 V 68" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1" stroke-dasharray="2,2" />
  
  <text x="220" y="71" fill="#10B981" font-family="monospace" font-size="9">Cycle Time: ~5 microseconds</text>

  <!-- Divider Line -->
  <line x1="30" y1="105" x2="610" y2="105" stroke="rgba(148,163,184,0.1)" stroke-width="1" />

  <!-- Multi-Peripheral System (Bottom) -->
  <text x="40" y="130" fill="#E2E8F0" font-size="11" font-weight="bold">Scenario B: Growing System Loop (Sequential Execution)</text>

  <!-- Button Check -->
  <rect x="40" y="145" width="80" height="30" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
  <text x="80" y="163" fill="#E2E8F0" font-size="9" text-anchor="middle">CheckButton()</text>
  <text x="80" y="171" fill="#64748B" font-family="monospace" font-size="7" text-anchor="middle">5µs</text>

  <!-- Plus -->
  <text x="126" y="165" fill="#64748B" font-size="12" font-weight="bold" text-anchor="middle">+</text>

  <!-- UART Check -->
  <rect x="135" y="145" width="80" height="30" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1" />
  <text x="175" y="163" fill="#E2E8F0" font-size="9" text-anchor="middle">CheckUART()</text>
  <text x="175" y="171" fill="#64748B" font-family="monospace" font-size="7" text-anchor="middle">80µs</text>

  <!-- Plus -->
  <text x="221" y="165" fill="#64748B" font-size="12" font-weight="bold" text-anchor="middle">+</text>

  <!-- ADC Check -->
  <rect x="230" y="145" width="80" height="30" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="270" y="163" fill="#E2E8F0" font-size="9" text-anchor="middle">CheckADC()</text>
  <text x="270" y="171" fill="#64748B" font-family="monospace" font-size="7" text-anchor="middle">120µs (wait)</text>

  <!-- Plus -->
  <text x="316" y="165" fill="#64748B" font-size="12" font-weight="bold" text-anchor="middle">+</text>

  <!-- CAN Check -->
  <rect x="325" y="145" width="80" height="30" rx="3" fill="#1E293B" stroke="#EF6868" stroke-width="1" />
  <text x="365" y="163" fill="#E2E8F0" font-size="9" text-anchor="middle">CheckCAN()</text>
  <text x="365" y="171" fill="#64748B" font-family="monospace" font-size="7" text-anchor="middle">90µs</text>

  <!-- Plus -->
  <text x="411" y="165" fill="#64748B" font-size="12" font-weight="bold" text-anchor="middle">+</text>

  <!-- LED Update -->
  <rect x="420" y="145" width="80" height="30" rx="3" fill="#1E293B" stroke="#A78BFA" stroke-width="1" />
  <text x="460" y="163" fill="#E2E8F0" font-size="9" text-anchor="middle">UpdateLEDs()</text>
  <text x="460" y="171" fill="#64748B" font-family="monospace" font-size="7" text-anchor="middle">10µs</text>

  <!-- Total Arrow -->
  <path d="M 40 195 H 500" fill="none" stroke="#EF6868" stroke-width="1.5" />
  <path d="M 500 190 V 200" stroke="#EF6868" stroke-width="1.5" />
  <path d="M 40 190 V 200" stroke="#EF6868" stroke-width="1.5" />
  
  <text x="515" y="199" fill="#EF6868" font-family="monospace" font-weight="bold" font-size="10">Cycle Time: 305 microseconds</text>
  <text x="515" y="212" fill="#64748B" font-size="8">Loop cycle is 61x slower than Scenario A</text>
</svg>
