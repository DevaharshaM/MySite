<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- Time Axis -->
  <line x1="40" y1="130" x2="580" y2="130" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" />
  <path d="M 575 125 L 580 130 L 575 135" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" />
  <text x="580" y="150" fill="#64748B" font-size="9" text-anchor="end">Time &rarr;</text>

  <!-- Execution blocks -->
  <!-- 1. Main Thread -->
  <rect x="40" y="70" width="130" height="30" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
  <text x="105" y="88" fill="#3B82F6" font-size="9" text-anchor="middle">Main Thread Code</text>

  <!-- 2. Finishing Instruction -->
  <rect x="170" y="70" width="60" height="30" rx="3" fill="#1E293B" stroke="#64748B" stroke-dasharray="2,2" stroke-width="1" />
  <text x="200" y="85" fill="#64748B" font-size="8" text-anchor="middle">Complete</text>
  <text x="200" y="94" fill="#64748B" font-size="7" text-anchor="middle">Instr (1-5 cycles)</text>

  <!-- 3. Stacking Context -->
  <rect x="230" y="70" width="90" height="30" rx="3" fill="#1E293B" stroke="#EF6868" stroke-width="1" />
  <text x="275" y="85" fill="#EF6868" font-size="8" text-anchor="middle">Context Save</text>
  <text x="275" y="94" fill="#EF6868" font-size="7" text-anchor="middle">(Stack Push)</text>

  <!-- 4. Vector Jump -->
  <rect x="320" y="70" width="70" height="30" rx="3" fill="#1E293B" stroke="#A78BFA" stroke-width="1" />
  <text x="355" y="85" fill="#A78BFA" font-size="8" text-anchor="middle">Vector Jump</text>
  <text x="355" y="94" fill="#A78BFA" font-size="7" text-anchor="middle">(Address Fetch)</text>

  <!-- 5. ISR Execution -->
  <rect x="390" y="70" width="160" height="30" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <text x="470" y="88" fill="#10B981" font-weight="bold" font-size="9" text-anchor="middle">Interrupt Handler (ISR)</text>

  <!-- Hardware line event -->
  <path d="M 40 190 H 170 V 170 H 580" fill="none" stroke="#F59E0B" stroke-width="2" />
  <text x="90" y="205" fill="#64748B" font-size="8">IRQ Line (LOW)</text>
  <text x="300" y="165" fill="#F59E0B" font-size="8">IRQ Line Asserted (HIGH)</text>

  <!-- Event arrival indicator -->
  <line x1="170" y1="130" x2="170" y2="170" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="170" cy="170" r="3" fill="#F59E0B" />
  <text x="170" y="215" fill="#F59E0B" font-size="8" font-weight="bold" text-anchor="middle">Event Arrives</text>

  <!-- Latency duration bracket -->
  <path d="M 170 45 H 390" fill="none" stroke="#EF6868" stroke-width="1.5" />
  <line x1="170" y1="40" x2="170" y2="50" stroke="#EF6868" stroke-width="1.5" />
  <line x1="390" y1="40" x2="390" y2="50" stroke="#EF6868" stroke-width="1.5" />
  <text x="280" y="36" fill="#EF6868" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">INTERRUPT LATENCY</text>

  <!-- First line of ISR executed -->
  <line x1="390" y1="50" x2="390" y2="130" stroke="#10B981" stroke-width="1" stroke-dasharray="2,2" />
  <text x="390" y="215" fill="#10B981" font-size="8" font-weight="bold" text-anchor="middle">First ISR Instr</text>

  <!-- Context save stack info -->
  <path d="M 275 100 V 120" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1" stroke-dasharray="2,2" />
</svg>
