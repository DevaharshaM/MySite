<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" height="100%" style="background:#171426; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="mvd-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(196, 181, 253, 0.03)" stroke-width="1"/>
    </pattern>
    <marker id="mvd-arrow-gold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FBBF24" />
    </marker>
    <marker id="mvd-arrow-violet" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA" />
    </marker>
  </defs>

  <!-- Background and Outer Frame -->
  <rect width="100%" height="100%" fill="url(#mvd-grid)" />
  <rect x="10" y="10" width="700" height="280" fill="none" stroke="rgba(196, 181, 253, 0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#F8FAFC" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.1em">HOW THEY DIVERGE IN SILICON</text>
  <text x="360" y="47" fill="#C4B5FD" font-size="8" text-anchor="middle">A processor alone vs. a complete computing system on one chip</text>

  <!-- LEFT: MICROPROCESSOR SYSTEM -->
  <g transform="translate(25, 60)">
    <!-- Boundary Container -->
    <rect width="320" height="215" rx="8" fill="#1F1B33" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1" />
    
    <!-- Title Badge -->
    <rect x="12" y="12" width="130" height="20" rx="4" fill="rgba(167, 139, 250, 0.12)" stroke="#A78BFA" stroke-width="0.8" />
    <text x="77" y="25" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">MICROPROCESSOR</text>
    <text x="150" y="25" fill="#94A3B8" font-size="7">(Modular Board Level)</text>

    <!-- Center CPU Chip -->
    <g transform="translate(100, 48)">
      <rect width="120" height="65" rx="6" fill="#26203D" stroke="#A78BFA" stroke-width="1.4" />
      <rect width="120" height="18" rx="6" fill="rgba(167, 139, 250, 0.15)" />
      <circle cx="12" cy="9" r="2.5" fill="#FBBF24" />
      <text x="60" y="12" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">CPU CORE</text>
      <text x="60" y="36" fill="#F8FAFC" font-size="8" font-weight="700" text-anchor="middle">Microprocessor</text>
      <text x="60" y="50" fill="#DDD6FE" font-size="6.8" text-anchor="middle">ALU · Registers · Control</text>
    </g>

    <!-- External Bus Lines -->
    <!-- Line to External RAM -->
    <line x1="160" y1="113" x2="60" y2="150" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#mvd-arrow-gold)" />
    <!-- Line to External Storage -->
    <line x1="160" y1="113" x2="160" y2="150" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#mvd-arrow-gold)" />
    <!-- Line to External IO -->
    <line x1="160" y1="113" x2="260" y2="150" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#mvd-arrow-gold)" />

    <!-- External Bus Label -->
    <rect x="105" y="125" width="110" height="14" rx="3" fill="#171426" stroke="rgba(251, 191, 36, 0.35)" stroke-width="0.8" />
    <text x="160" y="135" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="6" font-weight="600" text-anchor="middle">EXTERNAL SYSTEM BUS</text>

    <!-- External Chips at Bottom -->
    <!-- External RAM -->
    <g transform="translate(15, 150)">
      <rect width="90" height="50" rx="5" fill="#171426" stroke="rgba(196, 181, 253, 0.25)" stroke-width="1" />
      <text x="45" y="20" fill="#F8FAFC" font-size="7.5" font-weight="700" text-anchor="middle">External RAM</text>
      <text x="45" y="34" fill="#C4B5FD" font-size="6.5" text-anchor="middle">DDR / High Capacity</text>
      <text x="45" y="44" fill="#94A3B8" font-size="5.8" text-anchor="middle">Separate Silicon Die</text>
    </g>

    <!-- External Flash / Disk -->
    <g transform="translate(115, 150)">
      <rect width="90" height="50" rx="5" fill="#171426" stroke="rgba(196, 181, 253, 0.25)" stroke-width="1" />
      <text x="45" y="20" fill="#F8FAFC" font-size="7.5" font-weight="700" text-anchor="middle">External Storage</text>
      <text x="45" y="34" fill="#C4B5FD" font-size="6.5" text-anchor="middle">NVMe / Flash / ROM</text>
      <text x="45" y="44" fill="#94A3B8" font-size="5.8" text-anchor="middle">Operating System &amp; Files</text>
    </g>

    <!-- External Peripherals -->
    <g transform="translate(215, 150)">
      <rect width="90" height="50" rx="5" fill="#171426" stroke="rgba(196, 181, 253, 0.25)" stroke-width="1" />
      <text x="45" y="20" fill="#F8FAFC" font-size="7.5" font-weight="700" text-anchor="middle">External I/O</text>
      <text x="45" y="34" fill="#C4B5FD" font-size="6.5" text-anchor="middle">Chipsets &amp; Controllers</text>
      <text x="45" y="44" fill="#94A3B8" font-size="5.8" text-anchor="middle">USB / PCIe / Video</text>
    </g>
  </g>

  <!-- RIGHT: MICROCONTROLLER SYSTEM -->
  <g transform="translate(375, 60)">
    <!-- Boundary Container (Single Integrated Chip) -->
    <rect width="320" height="215" rx="8" fill="#1F1B33" stroke="#FBBF24" stroke-width="1.4" />
    
    <!-- Title Badge -->
    <rect x="12" y="12" width="135" height="20" rx="4" fill="rgba(251, 191, 36, 0.12)" stroke="#FBBF24" stroke-width="0.8" />
    <text x="79" y="25" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">MICROCONTROLLER</text>
    <text x="157" y="25" fill="#FBBF24" font-size="7">(All On One Silicon Die)</text>

    <!-- Integrated Die Perimeter -->
    <rect x="15" y="42" width="290" height="158" rx="6" fill="#231C3D" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1" />
    
    <!-- Top Row inside Die: Core, Flash, SRAM -->
    <!-- CPU Core -->
    <g transform="translate(25, 52)">
      <rect width="85" height="60" rx="5" fill="#2A2244" stroke="#A78BFA" stroke-width="1" />
      <text x="42" y="18" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">CPU CORE</text>
      <text x="42" y="35" fill="#F8FAFC" font-size="7.5" font-weight="700" text-anchor="middle">Processor</text>
      <text x="42" y="49" fill="#DDD6FE" font-size="6.5" text-anchor="middle">Arithmetic &amp; Logic</text>
    </g>

    <!-- Flash Memory -->
    <g transform="translate(118, 52)">
      <rect width="85" height="60" rx="5" fill="#2A2244" stroke="#C4B5FD" stroke-width="1" />
      <text x="42" y="18" fill="#C4B5FD" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">FLASH MEMORY</text>
      <text x="42" y="35" fill="#F8FAFC" font-size="7.5" font-weight="700" text-anchor="middle">Program Code</text>
      <text x="42" y="49" fill="#DDD6FE" font-size="6.5" text-anchor="middle">Dedicated Read-Only</text>
    </g>

    <!-- SRAM Memory -->
    <g transform="translate(210, 52)">
      <rect width="85" height="60" rx="5" fill="#2A2244" stroke="#C4B5FD" stroke-width="1" />
      <text x="42" y="18" fill="#C4B5FD" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">SRAM MEMORY</text>
      <text x="42" y="35" fill="#F8FAFC" font-size="7.5" font-weight="700" text-anchor="middle">Working Data</text>
      <text x="42" y="49" fill="#DDD6FE" font-size="6.5" text-anchor="middle">Fast Volatile State</text>
    </g>

    <!-- Internal Bus Connector -->
    <rect x="25" y="120" width="270" height="12" rx="3" fill="#171426" stroke="#FBBF24" stroke-width="0.8" />
    <text x="160" y="129" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="6" font-weight="600" text-anchor="middle">INTERNAL HIGH-SPEED ON-CHIP BUS</text>

    <!-- Bottom Row inside Die: Integrated Hardware Peripherals -->
    <!-- GPIO Pins -->
    <g transform="translate(25, 140)">
      <rect width="62" height="50" rx="4" fill="#2A2244" stroke="rgba(196, 181, 253, 0.3)" stroke-width="0.8" />
      <text x="31" y="18" fill="#F8FAFC" font-size="7" font-weight="700" text-anchor="middle">GPIO</text>
      <text x="31" y="32" fill="#C4B5FD" font-size="6" text-anchor="middle">Pins &amp; Logic</text>
      <text x="31" y="42" fill="#94A3B8" font-size="5.5" text-anchor="middle">Direct Control</text>
    </g>

    <!-- Timers & PWM -->
    <g transform="translate(94, 140)">
      <rect width="62" height="50" rx="4" fill="#2A2244" stroke="rgba(196, 181, 253, 0.3)" stroke-width="0.8" />
      <text x="31" y="18" fill="#F8FAFC" font-size="7" font-weight="700" text-anchor="middle">TIMERS</text>
      <text x="31" y="32" fill="#C4B5FD" font-size="6" text-anchor="middle">PWM · Clocks</text>
      <text x="31" y="42" fill="#94A3B8" font-size="5.5" text-anchor="middle">Exact Timing</text>
    </g>

    <!-- ADC / Analog -->
    <g transform="translate(163, 140)">
      <rect width="62" height="50" rx="4" fill="#2A2244" stroke="rgba(196, 181, 253, 0.3)" stroke-width="0.8" />
      <text x="31" y="18" fill="#F8FAFC" font-size="7" font-weight="700" text-anchor="middle">ADC</text>
      <text x="31" y="32" fill="#C4B5FD" font-size="6" text-anchor="middle">Sensors / Volt</text>
      <text x="31" y="42" fill="#94A3B8" font-size="5.5" text-anchor="middle">Analog Signals</text>
    </g>

    <!-- UART / SPI / I2C -->
    <g transform="translate(232, 140)">
      <rect width="63" height="50" rx="4" fill="#2A2244" stroke="rgba(196, 181, 253, 0.3)" stroke-width="0.8" />
      <text x="31" y="18" fill="#F8FAFC" font-size="7" font-weight="700" text-anchor="middle">COMM</text>
      <text x="31" y="32" fill="#C4B5FD" font-size="6" text-anchor="middle">UART · SPI · I²C</text>
      <text x="31" y="42" fill="#94A3B8" font-size="5.5" text-anchor="middle">Device Bus</text>
    </g>
  </g>
</svg>
