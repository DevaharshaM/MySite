<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="mem-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background and Frame -->
  <rect width="100%" height="100%" fill="url(#mem-grid)" />
  <rect x="12" y="12" width="736" height="236" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="380" y="34" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">A COMPUTER BUILT TO BECOME PART OF A MACHINE</text>
  <text x="380" y="49" fill="#94A3B8" font-size="8" text-anchor="middle">Not a standalone computer on a desk — but dedicated control embedded inside physical hardware</text>

  <!-- 4 Machine Application Cards -->
  <g transform="translate(24, 66)">
    <!-- 1. Appliance -->
    <g transform="translate(0, 0)">
      <rect width="168" height="135" rx="7" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.2" />
      <rect width="168" height="24" rx="7" fill="rgba(56, 189, 248, 0.1)" />
      <text x="84" y="16" fill="#38BDF8" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.05em">HOME APPLIANCES</text>
      
      <!-- Icon: Washing Machine / Thermostat -->
      <circle cx="84" cy="50" r="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.4" />
      <circle cx="84" cy="50" r="8" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-dasharray="3 2" />

      <text x="84" y="82" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Washing Machine</text>
      <text x="84" y="98" fill="#94A3B8" font-size="7.5" text-anchor="middle">Water level sensing</text>
      <text x="84" y="112" fill="#94A3B8" font-size="7.5" text-anchor="middle">Motor speed &amp; cycle timing</text>
    </g>

    <!-- 2. Automotive -->
    <g transform="translate(182, 0)">
      <rect width="168" height="135" rx="7" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.2" />
      <rect width="168" height="24" rx="7" fill="rgba(245, 158, 11, 0.1)" />
      <text x="84" y="16" fill="#FBBF24" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.05em">AUTOMOTIVE &amp; MOBILITY</text>
      
      <!-- Icon: Engine / ECU -->
      <rect x="70" y="38" width="28" height="24" rx="3" fill="#0F172A" stroke="#F59E0B" stroke-width="1.4" />
      <circle cx="77" cy="50" r="2.5" fill="#F59E0B" />
      <circle cx="91" cy="50" r="2.5" fill="#F59E0B" />

      <text x="84" y="82" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Engine &amp; Body ECUs</text>
      <text x="84" y="98" fill="#94A3B8" font-size="7.5" text-anchor="middle">Throttle &amp; brake sensors</text>
      <text x="84" y="112" fill="#94A3B8" font-size="7.5" text-anchor="middle">Microsecond fuel injection</text>
    </g>

    <!-- 3. Industrial / Robotics -->
    <g transform="translate(364, 0)">
      <rect width="168" height="135" rx="7" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.2" />
      <rect width="168" height="24" rx="7" fill="rgba(16, 185, 129, 0.1)" />
      <text x="84" y="16" fill="#34D399" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.05em">ROBOTICS &amp; MOTORS</text>
      
      <!-- Icon: Robotic Joint / Stepper -->
      <circle cx="84" cy="50" r="14" fill="#0F172A" stroke="#10B981" stroke-width="1.4" />
      <line x1="84" y1="50" x2="94" y2="40" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
      <circle cx="84" cy="50" r="3" fill="#10B981" />

      <text x="84" y="82" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Precision Motor Drive</text>
      <text x="84" y="98" fill="#94A3B8" font-size="7.5" text-anchor="middle">Closed-loop positioning</text>
      <text x="84" y="112" fill="#94A3B8" font-size="7.5" text-anchor="middle">Real-time torque control</text>
    </g>

    <!-- 4. Sensors & Edge Nodes -->
    <g transform="translate(546, 0)">
      <rect width="168" height="135" rx="7" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.2" />
      <rect width="168" height="24" rx="7" fill="rgba(168, 85, 247, 0.1)" />
      <text x="84" y="16" fill="#C084FC" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.05em">SENSING &amp; ENVIRONMENT</text>
      
      <!-- Icon: Sensor Node -->
      <circle cx="84" cy="50" r="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.4" />
      <path d="M 72 38 Q 84 32 96 38" fill="none" stroke="#C084FC" stroke-width="1.2" />
      <path d="M 68 34 Q 84 26 100 34" fill="none" stroke="#C084FC" stroke-width="1" stroke-dasharray="2 2" />

      <text x="84" y="82" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Thermostats &amp; Nodes</text>
      <text x="84" y="98" fill="#94A3B8" font-size="7.5" text-anchor="middle">Ambient temperature reading</text>
      <text x="84" y="112" fill="#94A3B8" font-size="7.5" text-anchor="middle">Ultra-low-power sleep states</text>
    </g>
  </g>

  <!-- Bottom Insight Badge -->
  <g transform="translate(140, 212)">
    <rect width="480" height="26" rx="5" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1" />
    <text x="240" y="17" fill="#94A3B8" font-size="7.8" text-anchor="middle">
      <tspan fill="#E2E8F0" font-weight="700">The Purpose:</tspan> Built not to sit on a desk, but to become the silent intelligence inside physical machines.
    </text>
  </g>
</svg>
