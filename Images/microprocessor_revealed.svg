<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="rev-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="blue-core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#rev-grid)" />
  <rect x="10" y="10" width="700" height="230" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE MISSING PIECE REVEALED</text>

  <!-- Central Silicon Die Housing -->
  <g transform="translate(190, 50)">
    <!-- Package Carrier -->
    <rect x="0" y="0" width="340" height="170" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.8" filter="url(#blue-core-glow)" />

    <!-- Silicon Die (Center) -->
    <rect x="40" y="25" width="260" height="120" rx="6" fill="#0F172A" stroke="rgba(59,130,246,0.5)" stroke-width="1.4" />
    
    <!-- Gold/Silver Corner Pin Marks -->
    <circle cx="15" cy="15" r="4" fill="#60A5FA" opacity="0.8" />
    <circle cx="325" cy="15" r="4" fill="#60A5FA" opacity="0.8" />
    <circle cx="15" cy="155" r="4" fill="#60A5FA" opacity="0.8" />
    <circle cx="325" cy="155" r="4" fill="#60A5FA" opacity="0.8" />

    <!-- Chip Title -->
    <text x="170" y="60" fill="#3B82F6" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.08em">MICROPROCESSOR</text>
    <text x="170" y="80" fill="#94A3B8" font-size="8.5" text-anchor="middle">A processor built onto a single integrated circuit.</text>

    <!-- Core Purpose Banner -->
    <rect x="60" y="98" width="220" height="26" rx="4" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1" />
    <text x="170" y="115" fill="#60A5FA" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">THE COMPUTATIONAL ENGINE</text>

    <!-- Subtitle -->
    <text x="170" y="136" fill="#CBD5E1" font-size="8" text-anchor="middle">The engine that turns computation into action.</text>
  </g>

  <!-- Left Pins -->
  <g stroke="#38BDF8" stroke-width="2" opacity="0.7">
    <line x1="160" y1="80" x2="190" y2="80" />
    <line x1="160" y1="105" x2="190" y2="105" />
    <line x1="160" y1="130" x2="190" y2="130" />
    <line x1="160" y1="155" x2="190" y2="155" />
    <line x1="160" y1="180" x2="190" y2="180" />
  </g>
  <text x="140" y="135" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="end">INPUTS</text>

  <!-- Right Pins -->
  <g stroke="#A855F7" stroke-width="2" opacity="0.7">
    <line x1="530" y1="80" x2="560" y2="80" />
    <line x1="530" y1="105" x2="560" y2="105" />
    <line x1="530" y1="130" x2="560" y2="130" />
    <line x1="530" y1="155" x2="560" y2="155" />
    <line x1="530" y1="180" x2="560" y2="180" />
  </g>
  <text x="580" y="135" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="start">OUTPUTS</text>
</svg>
