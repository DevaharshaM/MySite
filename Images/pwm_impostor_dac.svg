<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Outer Border -->
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />
  
  <!-- PWM Input Waveform -->
  <g transform="translate(10, 10)">
    <text x="90" y="30" fill="#EF6868" font-weight="bold" font-size="9" text-anchor="middle">1. HIGH-FREQ PWM (60% Duty)</text>
    <path d="M 20 150 V 80 H 70 V 150 H 100 V 80 H 150 V 150 H 180" fill="none" stroke="#EF6868" stroke-width="1.5" />
    <text x="90" y="190" fill="#64748B" font-size="8" text-anchor="middle">Rapid digital switching (0V / 3.3V)</text>
  </g>

  <!-- RC Low-Pass Filter Block -->
  <g transform="translate(200, 40)">
    <rect x="10" y="30" width="180" height="110" rx="4" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
    <text x="100" y="55" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">RC Integration Filter</text>
    
    <!-- Resistor -->
    <path d="M 35 90 H 55 L 58 85 L 62 95 L 66 85 L 70 95 L 74 85 L 78 95 L 81 90 H 110" fill="none" stroke="#FFF" stroke-width="1.5" />
    <text x="68" y="75" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">R = 10 kΩ</text>
    
    <!-- Capacitor -->
    <path d="M 110 90 V 110" fill="none" stroke="#FFF" stroke-width="1.5" />
    <path d="M 100 110 H 120 M 100 115 H 120" fill="none" stroke="#FFF" stroke-width="1.5" />
    <path d="M 110 115 V 130" fill="none" stroke="#FFF" stroke-width="1.5" />
    <!-- Ground -->
    <path d="M 105 130 H 115 M 107 133 H 113 M 109 136 H 111" fill="none" stroke="#FFF" stroke-width="1" />
    <text x="135" y="118" fill="#64748B" font-family="monospace" font-size="8">C = 100 nF</text>
    
    <path d="M 110 90 H 155" fill="none" stroke="#FFF" stroke-width="1.5" />
    
    <!-- Connectors -->
    <path d="M -10 90 H 10 M 5 85 L 10 90 L 5 95" fill="none" stroke="#EF6868" stroke-width="1.5" />
    <path d="M 180 90 H 200 M 195 85 L 200 90 L 195 95" fill="none" stroke="#10B981" stroke-width="1.5" />
  </g>

  <!-- Filtered PWM Output Waveform -->
  <g transform="translate(420, 10)">
    <text x="90" y="30" fill="#10B981" font-weight="bold" font-size="9" text-anchor="middle">2. ANALOG-LIKE DC VOLTAGE</text>
    <!-- Ripple wave: average around 108px (60% duty voltage ~ 1.98V) -->
    <!-- M 20 108 C 45 106, 65 110, 90 108 C 115 106, 135 110, 160 108 -->
    <path d="M 20 108 L 45 105 L 70 111 L 95 105 L 120 111 L 145 105 L 170 111" fill="none" stroke="#10B981" stroke-width="2" />
    <line x1="20" y1="108" x2="170" y2="108" stroke="rgba(16,185,129,0.3)" stroke-width="1" stroke-dasharray="3,3" />
    
    <text x="90" y="190" fill="#64748B" font-size="8" text-anchor="middle">Average voltage: 1.98 V (with ripple)</text>
  </g>
</svg>
