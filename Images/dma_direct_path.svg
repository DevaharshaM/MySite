<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle">Data Path WITH DMA: Bypassing the CPU</text>

  <!-- CPU Box (Top Center - Outside data path) -->
  <rect x="250" y="50" width="140" height="40" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="320" y="70" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">CPU Core</text>
  <text x="320" y="80" fill="#10B981" font-size="7" text-anchor="middle">FREE FOR COMPUTATION</text>

  <!-- Peripheral Box (Left) -->
  <rect x="40" y="120" width="110" height="60" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="95" y="150" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">Peripheral</text>
  <text x="95" y="162" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">UART / ADC</text>

  <!-- DMA Box (Center) -->
  <rect x="250" y="120" width="140" height="60" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="320" y="150" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">DMA Controller</text>
  <text x="320" y="162" fill="#10B981" font-size="8" text-anchor="middle">Hardware Coprocessor</text>

  <!-- SRAM Box (Right) -->
  <rect x="490" y="120" width="110" height="60" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="545" y="150" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">SRAM</text>
  <text x="545" y="162" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle">RAM Buffer</text>

  <!-- Direct Data Highway Arrows -->
  <path d="M 150 150 H 242" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 390 150 H 482" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />
  
  <text x="195" y="142" fill="#10B981" font-size="7" text-anchor="middle">Direct Transfer</text>
  <text x="440" y="142" fill="#10B981" font-size="7" text-anchor="middle">Direct Write</text>

  <!-- CPU Bus isolation indicator -->
  <path d="M 320 90 V 120" fill="none" stroke="rgba(148, 163, 184, 0.2)" stroke-dasharray="3,3" stroke-width="1" />
  <text x="330" y="105" fill="#64748B" font-size="7">Bus isolated</text>
</svg>
