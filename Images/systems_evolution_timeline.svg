<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">THE SILICON EVOLUTION TIMELINE</text>

  <!-- Node 1: Matter -->
  <rect x="25" y="70" width="85" height="45" rx="6" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="67.5" y="90" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">Matter</text>
  <text x="67.5" y="102" fill="#64748B" font-size="8" text-anchor="middle">Physics &amp; Silicon</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 110 92.5 H 137.5" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 2: Computation -->
  <rect x="145" y="70" width="85" height="45" rx="6" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="187.5" y="90" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">Computation</text>
  <text x="187.5" y="102" fill="#64748B" font-size="8" text-anchor="middle">CPU &amp; Memory</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 230 92.5 H 257.5" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 3: Interaction -->
  <rect x="265" y="70" width="85" height="45" rx="6" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="307.5" y="90" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">Interaction</text>
  <text x="307.5" y="102" fill="#64748B" font-size="8" text-anchor="middle">GPIO &amp; Protocols</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 350 92.5 H 377.5" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 4: Coordination -->
  <rect x="385" y="70" width="85" height="45" rx="6" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="427.5" y="90" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">Coordination</text>
  <text x="427.5" y="102" fill="#64748B" font-size="8" text-anchor="middle">Interrupts &amp; DMA</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M 470 92.5 H 497.5" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-gold)" />

  <!-- Node 5: Systems -->
  <rect x="505" y="65" width="105" height="55" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
  <text x="557.5" y="88" fill="#FFF" font-weight="bold" font-size="11" text-anchor="middle">Systems</text>
  <text x="557.5" y="102" fill="#F59E0B" font-weight="500" font-size="8" text-anchor="middle">Emergent Organism</text>

  <path d="M 25 150 H 615" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" stroke-dasharray="4,4" />
  
  <text x="320" y="175" fill="#64748B" font-size="9" text-anchor="middle" style="line-height: 1.4;">
    From raw chemical components to computational registers, crossing into communication buses,
  </text>
  <text x="320" y="190" fill="#64748B" font-size="9" text-anchor="middle">
    coordinating internal events, and finally emerging as a unified, physical system.
  </text>
</svg>
