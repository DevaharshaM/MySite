<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">CPU VS. GPU WORKLOAD PARADIGMS</text>

  <!-- Left: CPU (Latency-Optimized Serial Engine) -->
  <rect x="40" y="55" width="250" height="150" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="165" y="75" fill="#3B82F6" font-weight="bold" font-size="9" text-anchor="middle">CPU: Serial Execution Core</text>
  <text x="165" y="90" fill="#64748B" font-size="7" text-anchor="middle">Optimized for Latency &amp; Complex Branching</text>

  <!-- Visualizing few large cores with big Cache & Control -->
  <rect x="55" y="105" width="100" height="35" rx="2" fill="#0F172A" stroke="rgba(148,163,184,0.12)" />
  <text x="105" y="126" fill="#E2E8F0" font-size="8" text-anchor="middle">Control &amp; Cache</text>

  <rect x="165" y="105" width="110" height="35" rx="2" fill="#0F172A" stroke="#3B82F6" stroke-width="1" />
  <text x="220" y="122" fill="#FFF" font-size="8" font-weight="bold" text-anchor="middle">Core 0 (ALU)</text>
  <text x="220" y="132" fill="#64748B" font-size="6" text-anchor="middle">Complex serial logic</text>

  <!-- Serial stream representation -->
  <path d="M 55 170 H 275" fill="none" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2" />
  <circle cx="90" cy="170" r="5" fill="#3B82F6" />
  <circle cx="150" cy="170" r="5" fill="#3B82F6" />
  <circle cx="210" cy="170" r="5" fill="#3B82F6" />
  <circle cx="270" cy="170" r="5" fill="#3B82F6" />
  <text x="165" y="190" fill="#64748B" font-size="7" text-anchor="middle">Task 0 &#8594; Task 1 &#8594; Task 2 &#8594; Task 3</text>

  <!-- Right: GPU (Throughput-Optimized Parallel Engine) -->
  <rect x="350" y="55" width="250" height="150" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <text x="475" y="75" fill="#10B981" font-weight="bold" font-size="9" text-anchor="middle">GPU: Parallel Processing Grid</text>
  <text x="475" y="90" fill="#64748B" font-size="7" text-anchor="middle">Optimized for Throughput &amp; Vector Math</text>

  <!-- Array of many tiny cores -->
  <g fill="#10B981" stroke="#0F172A" stroke-width="0.5">
    <rect x="365" y="105" width="18" height="15" rx="1" />
    <rect x="388" y="105" width="18" height="15" rx="1" />
    <rect x="411" y="105" width="18" height="15" rx="1" />
    <rect x="434" y="105" width="18" height="15" rx="1" />
    <rect x="457" y="105" width="18" height="15" rx="1" />
    <rect x="480" y="105" width="18" height="15" rx="1" />
    <rect x="503" y="105" width="18" height="15" rx="1" />
    <rect x="526" y="105" width="18" height="15" rx="1" />
    <rect x="549" y="105" width="18" height="15" rx="1" />
    <rect x="572" y="105" width="18" height="15" rx="1" />

    <rect x="365" y="125" width="18" height="15" rx="1" />
    <rect x="388" y="125" width="18" height="15" rx="1" />
    <rect x="411" y="125" width="18" height="15" rx="1" />
    <rect x="434" y="125" width="18" height="15" rx="1" />
    <rect x="457" y="125" width="18" height="15" rx="1" />
    <rect x="480" y="125" width="18" height="15" rx="1" />
    <rect x="503" y="125" width="18" height="15" rx="1" />
    <rect x="526" y="125" width="18" height="15" rx="1" />
    <rect x="549" y="125" width="18" height="15" rx="1" />
    <rect x="572" y="125" width="18" height="15" rx="1" />

    <rect x="365" y="145" width="18" height="15" rx="1" />
    <rect x="388" y="145" width="18" height="15" rx="1" />
    <rect x="411" y="145" width="18" height="15" rx="1" />
    <rect x="434" y="145" width="18" height="15" rx="1" />
    <rect x="457" y="145" width="18" height="15" rx="1" />
    <rect x="480" y="145" width="18" height="15" rx="1" />
    <rect x="503" y="145" width="18" height="15" rx="1" />
    <rect x="526" y="145" width="18" height="15" rx="1" />
    <rect x="549" y="145" width="18" height="15" rx="1" />
    <rect x="572" y="145" width="18" height="15" rx="1" />
  </g>

  <text x="475" y="190" fill="#64748B" font-size="7" text-anchor="middle">Thousands of identical calculations concurrently</text>
</svg>
