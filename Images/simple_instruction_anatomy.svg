<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="inst-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#inst-grid)" />
  <rect x="10" y="10" width="700" height="200" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">ANATOMY OF AN INSTRUCTION</text>

  <!-- Instruction Box Container -->
  <rect x="160" y="55" width="400" height="65" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.8" />

  <!-- Operation (ADD) -->
  <rect x="175" y="68" width="130" height="38" rx="5" fill="#0F172A" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.2" />
  <text x="240" y="93" fill="#60A5FA" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700" text-anchor="middle">ADD</text>

  <!-- Operands (R1, R2) -->
  <rect x="320" y="68" width="225" height="38" rx="5" fill="#0F172A" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
  <text x="432" y="93" fill="#FCD34D" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700" text-anchor="middle">R1, R2</text>

  <!-- Pointer to Operation -->
  <path d="M 240 160 L 240 115" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <rect x="150" y="160" width="180" height="36" rx="6" fill="#1E293B" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
  <text x="240" y="176" fill="#3B82F6" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.04em">OPERATION</text>
  <text x="240" y="189" fill="#94A3B8" font-size="7.5" text-anchor="middle">What operation to perform</text>

  <!-- Pointer to Operands -->
  <path d="M 432 160 L 432 115" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow-amber)" />
  <rect x="342" y="160" width="180" height="36" rx="6" fill="#1E293B" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
  <text x="432" y="176" fill="#F59E0B" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.04em">OPERANDS</text>
  <text x="432" y="189" fill="#94A3B8" font-size="7.5" text-anchor="middle">On what data to perform it</text>
</svg>
