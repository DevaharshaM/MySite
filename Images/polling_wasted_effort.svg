<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- CPU Status Box (Left) -->
  <rect x="40" y="45" width="160" height="150" rx="4" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
  <text x="120" y="70" fill="#64748B" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">CPU WORKLOAD</text>
  
  <!-- 100% Gauge -->
  <circle cx="120" cy="120" r="30" fill="none" stroke="#263244" stroke-width="6" />
  <circle cx="120" cy="120" r="30" fill="none" stroke="#EF6868" stroke-width="6" stroke-dasharray="188.4" />
  <text x="120" y="126" fill="#EF6868" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">100%</text>
  
  <text x="120" y="175" fill="#E2E8F0" font-size="9" text-anchor="middle">Always running at full speed</text>

  <!-- Checks Timeline (Right) -->
  <text x="240" y="40" fill="#E2E8F0" font-size="11" font-weight="bold">Interrogation Log (Time &#8594;)</text>

  <!-- Timeline axis -->
  <path d="M 240 100 H 580" fill="none" stroke="rgba(148,163,184,0.3)" stroke-width="1" />
  <path d="M 575 95 L 580 100 L 575 105" fill="none" stroke="rgba(148,163,184,0.3)" stroke-width="1" />

  <!-- Poll points -->
  <!-- Poll 1: Idle -->
  <line x1="260" y1="100" x2="260" y2="70" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2,2" />
  <circle cx="260" cy="70" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1" />
  <text x="260" y="73" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">Idle</text>
  <text x="260" y="125" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">Poll #1</text>
  <text x="260" y="138" fill="#EF6868" font-size="8" text-anchor="middle">"No change"</text>

  <!-- Poll 2: Idle -->
  <line x1="330" y1="100" x2="330" y2="70" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2,2" />
  <circle cx="330" cy="70" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1" />
  <text x="330" y="73" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">Idle</text>
  <text x="330" y="125" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">Poll #2</text>
  <text x="330" y="138" fill="#EF6868" font-size="8" text-anchor="middle">"No change"</text>

  <!-- Poll 3: Idle -->
  <line x1="400" y1="100" x2="400" y2="70" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2,2" />
  <circle cx="400" cy="70" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1" />
  <text x="400" y="73" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">Idle</text>
  <text x="400" y="125" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">Poll #3</text>
  <text x="400" y="138" fill="#EF6868" font-size="8" text-anchor="middle">"No change"</text>

  <!-- Poll 4: Idle -->
  <line x1="470" y1="100" x2="470" y2="70" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2,2" />
  <circle cx="470" cy="70" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1" />
  <text x="470" y="73" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">Idle</text>
  <text x="470" y="125" fill="#64748B" font-family="monospace" font-size="8" text-anchor="middle">Poll #4</text>
  <text x="470" y="138" fill="#EF6868" font-size="8" text-anchor="middle">"No change"</text>

  <!-- Poll 5: Action! -->
  <line x1="540" y1="100" x2="540" y2="70" stroke="#10B981" stroke-width="1.5" />
  <circle cx="540" cy="70" r="14" fill="#0F172A" stroke="#10B981" stroke-width="2" />
  <text x="540" y="73" fill="#10B981" font-family="monospace" font-weight="bold" font-size="8" text-anchor="middle">Event</text>
  <text x="540" y="125" fill="#10B981" font-family="monospace" font-size="8" text-anchor="middle">Poll #5</text>
  <text x="540" y="138" fill="#10B981" font-size="8" text-anchor="middle">"Pressed!"</text>

  <!-- Bottom explanation -->
  <rect x="240" y="170" width="340" height="35" rx="4" fill="#1E293B" stroke="rgba(148,163,184,0.1)" stroke-width="1" />
  <text x="410" y="190" fill="#64748B" font-size="9" text-anchor="middle">
    99.9% of CPU instructions are wasted reading unchanging hardware lines.
  </text>
</svg>
