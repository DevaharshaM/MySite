<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">PERIPHERAL COOPERATION PIPELINE</text>

  <!-- Step 1: Timer (Top Left) -->
  <rect x="30" y="60" width="90" height="40" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="75" y="78" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">1. Timer</text>
  <text x="75" y="88" fill="#3B82F6" font-size="7" text-anchor="middle">Generates Trigger</text>

  <!-- Arrow Timer -> ADC -->
  <path d="M 120 80 H 160" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <!-- Step 2: ADC (Top Middle) -->
  <rect x="170" y="60" width="90" height="40" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="215" y="78" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">2. ADC</text>
  <text x="215" y="88" fill="#3B82F6" font-size="7" text-anchor="middle">Converts Signal</text>

  <!-- Arrow ADC -> DMA -->
  <path d="M 260 80 H 300" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Step 3: DMA Controller (Top Right) -->
  <rect x="310" y="60" width="110" height="40" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <text x="365" y="78" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">3. DMA Controller</text>
  <text x="365" y="88" fill="#10B981" font-size="7" text-anchor="middle">Moves Data to RAM</text>

  <!-- Arrow DMA -> SRAM -->
  <path d="M 420 80 H 470" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Step 4: SRAM Buffer (Middle Right) -->
  <rect x="480" y="60" width="120" height="90" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="540" y="78" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">4. SRAM Memory</text>
  <text x="540" y="90" fill="#64748B" font-size="7" text-anchor="middle">Holds Data Buffer</text>
  <rect x="495" y="102" width="90" height="35" fill="none" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1" />
  <text x="540" y="115" fill="#10B981" font-family="monospace" font-size="7" text-anchor="middle">[Data Array]</text>
  <text x="540" y="125" fill="#64748B" font-family="monospace" font-size="6" text-anchor="middle">Filled without CPU</text>

  <!-- Arrow DMA -> CPU (Interrupt) -->
  <path d="M 365 100 V 135 H 175" fill="none" stroke="#F59E0B" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow-amber)" />
  <text x="270" y="130" fill="#F59E0B" font-size="7" text-anchor="middle">5. Transfer Complete IRQ</text>

  <!-- Step 5: CPU Core (Bottom Left) -->
  <rect x="70" y="140" width="110" height="50" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
  <text x="125" y="158" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">6. CPU Core</text>
  <text x="125" y="168" fill="#F59E0B" font-size="7" text-anchor="middle">Processes Buffer</text>
  <text x="125" y="178" fill="#64748B" font-size="7" text-anchor="middle">(Runs Math / Logic)</text>

  <!-- Arrow CPU -> UART -->
  <path d="M 180 165 H 280" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <!-- Step 6: UART Controller (Bottom Middle) -->
  <rect x="290" y="140" width="110" height="50" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="345" y="158" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">7. UART TX</text>
  <text x="345" y="168" fill="#3B82F6" font-size="7" text-anchor="middle">Serial Transmitter</text>
  <text x="345" y="178" fill="#64748B" font-size="7" text-anchor="middle">Sends Result Out</text>
</svg>
