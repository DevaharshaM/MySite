<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="ptr-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
    <marker id="cpu-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle">Circular Buffer Dynamics: Continuous Streaming</text>

  <!-- Left Side: Circular Buffer Ring -->
  <circle cx="160" cy="130" r="60" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="20" />
  
  <!-- Colored segments (simulated by stroke-dasharray) -->
  <!-- Processed (Blue) from 9 o'clock to 1 o'clock (approx 240 degrees) -->
  <circle cx="160" cy="130" r="60" fill="none" stroke="#263244" stroke-width="20" stroke-dasharray="188 377" stroke-dashoffset="0" />
  <!-- Unprocessed (Green) from 1 o'clock to 4 o'clock (approx 90 degrees) -->
  <circle cx="160" cy="130" r="60" fill="none" stroke="#10B981" stroke-width="20" stroke-dasharray="94 377" stroke-dashoffset="-188" />
  <!-- Empty (Gray) for the rest -->
  <circle cx="160" cy="130" r="60" fill="none" stroke="rgba(59, 130, 246, 0.1)" stroke-width="20" stroke-dasharray="95 377" stroke-dashoffset="-282" />

  <!-- Pointers -->
  <!-- Write pointer (DMA) at ~4 o'clock (angle ~ 45 degrees) -->
  <path d="M 230 160 L 210 150" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#ptr-arrow)" />
  <text x="245" y="170" fill="#F59E0B" font-family="monospace" font-size="8" font-weight="bold">DMA Write (CNT)</text>

  <!-- Read pointer (CPU) at ~1 o'clock (angle ~ -60 degrees) -->
  <path d="M 210 90 L 195 105" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#cpu-arrow)" />
  <text x="225" y="80" fill="#3B82F6" font-family="monospace" font-size="8" font-weight="bold">CPU Read Pointer</text>

  <!-- Segment dividers -->
  <circle cx="160" cy="130" r="60" fill="none" stroke="#0F172A" stroke-width="20" stroke-dasharray="2 45" />

  <!-- Core Label -->
  <text x="160" y="133" fill="#FFF" font-family="monospace" font-size="9" text-anchor="middle">SRAM Buffer</text>

  <!-- Legend & Annotations (Right) -->
  <!-- Legend Box -->
  <rect x="360" y="60" width="230" height="130" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />
  
  <rect x="375" y="75" width="12" height="12" fill="#10B981" />
  <text x="395" y="84" fill="#E2E8F0" font-size="8">New Data: DMA filled, CPU pending</text>
  
  <rect x="375" y="98" width="12" height="12" fill="#263244" />
  <text x="395" y="107" fill="#E2E8F0" font-size="8">Processed Data: CPU finished reading</text>

  <circle cx="381" cy="130" r="4" fill="#F59E0B" />
  <text x="395" y="133" fill="#64748B" font-size="8">DMA writes continuously clockwise</text>

  <circle cx="381" cy="153" r="4" fill="#3B82F6" />
  <text x="395" y="156" fill="#64748B" font-size="8">CPU reads in background</text>

  <text x="375" y="180" fill="#EF6868" font-size="8" font-weight="bold">Alert: Overflow if DMA wraps past CPU</text>
</svg>
