<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Outer Border -->
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />
  
  <!-- Left Side: 3.3V Reference -->
  <g transform="translate(20, 20)">
    <text x="130" y="25" fill="#FFF" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="0.05em">RULER A: VREF = 3.3V</text>
    
    <!-- Vertical Voltage Ruler -->
    <line x1="60" y1="50" x2="60" y2="180" stroke="rgba(148,163,184,0.3)" stroke-width="2" />
    <path d="M 55 50 H 65 M 57 82.5 H 63 M 55 115 H 65 M 57 147.5 H 63 M 55 180 H 65" fill="none" stroke="rgba(148,163,184,0.3)" stroke-width="1" />
    
    <text x="45" y="53" fill="#FFF" font-family="monospace" font-size="9" text-anchor="end">3.30V</text>
    <text x="45" y="118" fill="#64748B" font-family="monospace" font-size="9" text-anchor="end">1.65V</text>
    <text x="45" y="183" fill="#64748B" font-family="monospace" font-size="9" text-anchor="end">0.00V</text>
    
    <!-- Code markings -->
    <text x="75" y="53" fill="#10B981" font-family="monospace" font-size="9">Code: 4095 (Max)</text>
    <text x="75" y="118" fill="#10B981" font-family="monospace" font-size="9">Code: 2048 (Mid)</text>
    <text x="75" y="183" fill="#10B981" font-family="monospace" font-size="9">Code: 0</text>
    
    <!-- Step size (LSB) -->
    <rect x="75" y="135" width="130" height="30" rx="3" fill="#1E293B" stroke="rgba(148,163,184,0.1)" />
    <text x="140" y="153" fill="#3B82F6" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">1 LSB = 0.806 mV</text>
  </g>

  <!-- Right Side: 5.0V Reference -->
  <g transform="translate(320, 20)">
    <text x="130" y="25" fill="#FFF" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="0.05em">RULER B: VREF = 5.0V</text>
    
    <!-- Vertical Voltage Ruler -->
    <line x1="60" y1="50" x2="60" y2="180" stroke="rgba(148,163,184,0.3)" stroke-width="2" />
    <path d="M 55 50 H 65 M 57 82.5 H 63 M 55 115 H 65 M 57 147.5 H 63 M 55 180 H 65" fill="none" stroke="rgba(148,163,184,0.3)" stroke-width="1" />
    
    <text x="45" y="53" fill="#FFF" font-family="monospace" font-size="9" text-anchor="end">5.00V</text>
    <text x="45" y="118" fill="#64748B" font-family="monospace" font-size="9" text-anchor="end">2.50V</text>
    <text x="45" y="183" fill="#64748B" font-family="monospace" font-size="9" text-anchor="end">0.00V</text>
    
    <!-- Code markings -->
    <text x="75" y="53" fill="#10B981" font-family="monospace" font-size="9">Code: 4095 (Max)</text>
    <text x="75" y="118" fill="#10B981" font-family="monospace" font-size="9">Code: 2048 (Mid)</text>
    <text x="75" y="183" fill="#10B981" font-family="monospace" font-size="9">Code: 0</text>
    
    <!-- Step size (LSB) -->
    <rect x="75" y="135" width="130" height="30" rx="3" fill="#1E293B" stroke="rgba(148,163,184,0.1)" />
    <text x="140" y="153" fill="#3B82F6" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">1 LSB = 1.221 mV</text>
  </g>
  
  <!-- Divider -->
  <line x1="320" y1="30" x2="320" y2="200" stroke="rgba(148,163,184,0.1)" stroke-width="1" stroke-dasharray="3,3" />
</svg>
