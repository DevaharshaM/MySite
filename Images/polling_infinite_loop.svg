<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(148,163,184,0.4)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- Code Panel (Left) -->
  <rect x="40" y="40" width="240" height="160" rx="4" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
  <rect x="40" y="40" width="240" height="25" rx="4" fill="#0F172A" opacity="0.5" />
  <circle cx="55" cy="52" r="3" fill="#EF6868" />
  <circle cx="65" cy="52" r="3" fill="#F59E0B" />
  <circle cx="75" cy="52" r="3" fill="#10B981" />
  <text x="90" y="56" fill="#64748B" font-family="monospace" font-size="9">main.c</text>

  <text x="55" y="90" fill="#64748B" font-family="monospace" font-size="10">int main(void) {</text>
  <text x="75" y="110" fill="#3B82F6" font-family="monospace" font-size="10">SystemInit();</text>
  <text x="75" y="130" fill="#EF6868" font-family="monospace" font-weight="bold" font-size="10">while (1) {</text>
  <text x="95" y="150" fill="#10B981" font-family="monospace" font-size="10">// Do forever</text>
  <text x="75" y="170" fill="#EF6868" font-family="monospace" font-weight="bold" font-size="10">}</text>
  <text x="55" y="190" fill="#64748B" font-family="monospace" font-size="10">}</text>

  <!-- Flow Visualizer (Right) -->
  <!-- Start Node -->
  <rect x="330" y="100" width="80" height="40" rx="4" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1" />
  <text x="370" y="124" fill="#E2E8F0" font-size="10" font-weight="bold" text-anchor="middle">Power On</text>
  
  <!-- Arrow from Start to loop -->
  <path d="M 410 120 H 450" fill="none" stroke="rgba(148,163,184,0.4)" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Loop ring -->
  <circle cx="510" cy="120" r="50" fill="none" stroke="#263244" stroke-width="6" />
  <circle cx="510" cy="120" r="50" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="10 30" />
  
  <!-- Loop core block -->
  <circle cx="510" cy="120" r="24" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" />
  <text x="510" y="123" fill="#3B82F6" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">CPU</text>

  <!-- Flow direction indicators around the circle -->
  <path d="M 510 70 A 50 50 0 0 1 560 120" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow-blue)" />
  <path d="M 510 170 A 50 50 0 0 1 460 120" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow-blue)" />

  <!-- Annotation text -->
  <text x="510" y="45" fill="#E2E8F0" font-size="10" font-weight="bold" text-anchor="middle">Endless Loop</text>
  <text x="510" y="200" fill="#64748B" font-size="9" text-anchor="middle">No exit condition. Spins indefinitely.</text>
</svg>
