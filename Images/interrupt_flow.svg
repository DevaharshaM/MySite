<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(148,163,184,0.4)" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- Flow Steps -->
  <!-- Step 1: External Event -->
  <rect x="30" y="90" width="90" height="50" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
  <text x="75" y="112" fill="#F59E0B" font-size="10" font-weight="bold" text-anchor="middle">1. Event</text>
  <text x="75" y="126" fill="#64748B" font-size="8" text-anchor="middle">Physical transition</text>
  <text x="75" y="135" fill="#64748B" font-size="8" text-anchor="middle">(e.g. Button Press)</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 120 115 H 145" fill="none" stroke="rgba(148,163,184,0.4)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 2: IRQ Asserted -->
  <rect x="150" y="90" width="95" height="50" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="197" y="112" fill="#3B82F6" font-size="10" font-weight="bold" text-anchor="middle">2. IRQ Request</text>
  <text x="197" y="126" fill="#64748B" font-size="8" text-anchor="middle">Hardware alerts</text>
  <text x="197" y="135" fill="#64748B" font-size="8" text-anchor="middle">the CPU core</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 245 115 H 270" fill="none" stroke="rgba(148,163,184,0.4)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 3: CPU Pause & Context Save -->
  <rect x="275" y="90" width="100" height="50" rx="4" fill="#1E293B" stroke="#EF6868" stroke-width="1.5" />
  <text x="325" y="112" fill="#EF6868" font-size="10" font-weight="bold" text-anchor="middle">3. Stack Save</text>
  <text x="325" y="126" fill="#64748B" font-size="8" text-anchor="middle">CPU halts, pushes</text>
  <text x="325" y="135" fill="#64748B" font-size="8" text-anchor="middle">registers to Stack</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 375 115 H 400" fill="none" stroke="rgba(148,163,184,0.4)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 4: ISR Jump & Execute -->
  <rect x="405" y="90" width="95" height="50" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <text x="452" y="112" fill="#10B981" font-size="10" font-weight="bold" text-anchor="middle">4. ISR Jump</text>
  <text x="452" y="126" fill="#64748B" font-size="8" text-anchor="middle">Jumps to vector &amp;</text>
  <text x="452" y="135" fill="#64748B" font-size="8" text-anchor="middle">runs handler code</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M 500 115 H 525" fill="none" stroke="rgba(148,163,184,0.4)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 5: Restore & Return -->
  <rect x="530" y="90" width="80" height="50" rx="4" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" />
  <text x="570" y="112" fill="#A78BFA" font-size="10" font-weight="bold" text-anchor="middle">5. Return</text>
  <text x="570" y="126" fill="#64748B" font-size="8" text-anchor="middle">Pops registers,</text>
  <text x="570" y="135" fill="#64748B" font-size="8" text-anchor="middle">resumes main</text>

  <!-- Text explaining flow -->
  <text x="320" y="50" fill="#E2E8F0" font-size="12" font-weight="bold" text-anchor="middle">The Hardware-to-Software Handoff</text>
  <text x="320" y="185" fill="#64748B" font-size="9" text-anchor="middle">Unlike polling, no software code is actively waiting. The handoff is driven entirely by silicon circuitry.</text>
</svg>
