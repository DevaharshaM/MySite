<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- Timeline Axis -->
  <line x1="40" y1="120" x2="580" y2="120" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" />
  <path d="M 575 115 L 580 120 L 575 125" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" />
  <text x="580" y="140" fill="#64748B" font-size="9" text-anchor="end">Time &rarr;</text>

  <!-- Loop Cycle 1 -->
  <rect x="50" y="60" width="120" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
  <text x="110" y="78" fill="#64748B" font-size="9" text-anchor="middle">CheckButton()</text>

  <rect x="175" y="60" width="120" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
  <text x="235" y="78" fill="#64748B" font-size="9" text-anchor="middle">CheckUART()</text>

  <!-- Loop Cycle 2 -->
  <rect x="305" y="60" width="120" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
  <text x="365" y="78" fill="#64748B" font-size="9" text-anchor="middle">CheckADC()</text>

  <rect x="430" y="60" width="120" height="30" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="490" y="78" fill="#3B82F6" font-weight="bold" font-size="9" text-anchor="middle">CheckButton()</text>

  <!-- Event Arrival -->
  <!-- Event occurs at t = 180 (just after Button check finishes) -->
  <line x1="180" y1="120" x2="180" y2="170" stroke="#F59E0B" stroke-width="2" />
  <circle cx="180" cy="170" r="4" fill="#F59E0B" />
  <text x="180" y="188" fill="#F59E0B" font-size="9" font-weight="bold" text-anchor="middle">Button Pressed</text>
  <text x="180" y="200" fill="#64748B" font-size="8" text-anchor="middle">(Event Occurs)</text>

  <!-- Event Detected -->
  <!-- Event is detected at t = 430 (when the next Button check starts) -->
  <line x1="430" y1="90" x2="430" y2="170" stroke="#10B981" stroke-width="2" />
  <circle cx="430" cy="170" r="4" fill="#10B981" />
  <text x="430" y="188" fill="#10B981" font-size="9" font-weight="bold" text-anchor="middle">Button Polled</text>
  <text x="430" y="200" fill="#64748B" font-size="8" text-anchor="middle">(Event Detected)</text>

  <!-- Latency Span -->
  <path d="M 180 150 H 430" fill="none" stroke="#EF6868" stroke-width="2" stroke-dasharray="3,3" />
  <path d="M 185 145 L 180 150 L 185 155" fill="none" stroke="#EF6868" stroke-width="2" />
  <path d="M 425 145 L 430 150 L 425 155" fill="none" stroke="#EF6868" stroke-width="2" />
  
  <rect x="250" y="138" fill="#0F172A" width="110" height="24" rx="3" stroke="rgba(239, 104, 104, 0.2)" stroke-width="1" />
  <text x="305" y="152" fill="#EF6868" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">LATENCY DELAY</text>

  <!-- Cycle division marker -->
  <line x1="300" y1="50" x2="300" y2="100" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" stroke-dasharray="4,4" />
  <text x="300" y="44" fill="#64748B" font-size="8" text-anchor="middle">End of Loop Cycle 1</text>
</svg>
