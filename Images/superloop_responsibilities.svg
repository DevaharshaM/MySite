<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">THE CLASSIC SUPER-LOOP FLOW</text>

  <!-- Circular path / Task Nodes -->
  <!-- Node 1: Top (Check Inputs) -->
  <rect x="250" y="55" width="140" height="25" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
  <text x="320" y="71" fill="#3B82F6" font-size="8" font-weight="bold" text-anchor="middle">1. Read Inputs (ADC/GPIO)</text>

  <!-- Arrow Top -> Right -->
  <path d="M 395 67 C 450 75 490 100 495 120" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 2: Right (Run Logic) -->
  <rect x="425" y="125" width="140" height="25" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1" />
  <text x="495" y="141" fill="#10B981" font-size="8" font-weight="bold" text-anchor="middle">2. Process Control Logic</text>

  <!-- Arrow Right -> Bottom -->
  <path d="M 495 155 C 490 175 450 200 395 208" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 3: Bottom (Update Outputs) -->
  <rect x="250" y="195" width="140" height="25" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="320" y="211" fill="#F59E0B" font-size="8" font-weight="bold" text-anchor="middle">3. Write Outputs (DAC/GPIO)</text>

  <!-- Arrow Bottom -> Left -->
  <path d="M 245 208 C 190 200 150 175 145 155" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node 4: Left (Comms & Diagnostic) -->
  <rect x="75" y="125" width="140" height="25" rx="3" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="145" y="141" fill="#A855F7" font-size="8" font-weight="bold" text-anchor="middle">4. Service Comms (UART/CAN)</text>

  <!-- Arrow Left -> Top -->
  <path d="M 145 120 C 150 100 190 75 245 67" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Center Label: while(1) -->
  <circle cx="320" cy="138" r="22" fill="#0F172A" stroke="rgba(148,163,184,0.12)" />
  <text x="320" y="141" fill="#10B981" font-family="monospace" font-weight="bold" font-size="8" text-anchor="middle">while(1)</text>
</svg>
