<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="ptr-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- Title -->
  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle">The Vector Table: Hardware-to-Software Map</text>

  <!-- Flash Vector Table (Left) -->
  <rect x="40" y="50" width="240" height="155" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="50" y="66" fill="#64748B" font-family="monospace" font-size="8" font-weight="bold">FLASH MEMORY (0x0000_0000)</text>

  <!-- Vector Table Row 1 -->
  <rect x="50" y="78" width="220" height="18" fill="#0F172A" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
  <text x="60" y="90" fill="#64748B" font-family="monospace" font-size="8">0x0000_0000</text>
  <text x="140" y="90" fill="#FFF" font-family="monospace" font-size="8">0x2002_0000</text>
  <text x="260" y="90" fill="#64748B" font-size="7" text-anchor="end">Stack Pointer</text>

  <!-- Vector Table Row 2 -->
  <rect x="50" y="98" width="220" height="18" fill="#0F172A" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
  <text x="60" y="110" fill="#64748B" font-family="monospace" font-size="8">0x0000_0004</text>
  <text x="140" y="110" fill="#3B82F6" font-family="monospace" font-size="8">0x0800_0100</text>
  <text x="260" y="110" fill="#3B82F6" font-size="7" text-anchor="end">Reset Vector</text>

  <!-- Vector Table Row 3 -->
  <rect x="50" y="118" width="220" height="18" fill="#0F172A" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
  <text x="60" y="130" fill="#64748B" font-family="monospace" font-size="8">0x0000_000C</text>
  <text x="140" y="130" fill="#3B82F6" font-family="monospace" font-size="8">0x0800_03C0</text>
  <text x="260" y="130" fill="#3B82F6" font-size="7" text-anchor="end">HardFault Vector</text>

  <!-- Vector Table Row 4 -->
  <rect x="50" y="138" width="220" height="18" fill="#0F172A" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
  <text x="60" y="150" fill="#64748B" font-family="monospace" font-size="8">0x0000_003C</text>
  <text x="140" y="150" fill="#3B82F6" font-family="monospace" font-size="8">0x0800_0F80</text>
  <text x="260" y="150" fill="#3B82F6" font-size="7" text-anchor="end">SysTick Vector</text>

  <!-- Vector Table Row 5 -->
  <rect x="50" y="158" width="220" height="18" fill="#0F172A" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
  <text x="60" y="170" fill="#64748B" font-family="monospace" font-size="8">0x0000_00D4</text>
  <text x="140" y="170" fill="#3B82F6" font-family="monospace" font-size="8">0x0800_1E00</text>
  <text x="260" y="170" fill="#3B82F6" font-size="7" text-anchor="end">USART1 Vector</text>

  <!-- Execution Memory Handlers (Right) -->
  <!-- Reset Handler -->
  <rect x="420" y="55" width="180" height="24" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />
  <text x="430" y="70" fill="#64748B" font-family="monospace" font-size="8">0x0800_0100</text>
  <text x="590" y="70" fill="#E2E8F0" font-weight="bold" font-size="8" text-anchor="end">Reset_Handler</text>

  <!-- HardFault Handler -->
  <rect x="420" y="90" width="180" height="24" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />
  <text x="430" y="105" fill="#64748B" font-family="monospace" font-size="8">0x0800_03C0</text>
  <text x="590" y="105" fill="#EF6868" font-weight="bold" font-size="8" text-anchor="end">HardFault_Handler</text>

  <!-- SysTick Handler -->
  <rect x="420" y="125" width="180" height="24" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />
  <text x="430" y="140" fill="#64748B" font-family="monospace" font-size="8">0x0800_0F80</text>
  <text x="590" y="140" fill="#A78BFA" font-weight="bold" font-size="8" text-anchor="end">SysTick_Handler</text>

  <!-- USART1 IRQ Handler -->
  <rect x="420" y="160" width="180" height="24" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <text x="430" y="175" fill="#64748B" font-family="monospace" font-size="8">0x0800_1E00</text>
  <text x="590" y="175" fill="#10B981" font-weight="bold" font-size="8" text-anchor="end">USART1_IRQHandler</text>

  <!-- Pointer Arrows -->
  <path d="M 200 110 H 340 V 67 H 410" fill="none" stroke="#3B82F6" stroke-width="1" marker-end="url(#ptr-arrow)" />
  <path d="M 200 130 H 350 V 102 H 410" fill="none" stroke="#3B82F6" stroke-width="1" marker-end="url(#ptr-arrow)" />
  <path d="M 200 150 H 360 V 137 H 410" fill="none" stroke="#3B82F6" stroke-width="1" marker-end="url(#ptr-arrow)" />
  <path d="M 200 170 H 370 V 172 H 410" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#ptr-arrow)" />

  <text x="320" y="215" fill="#64748B" font-size="9" text-anchor="middle">Hardware reads the Vector Table entries to fetch the execution address of the handler.</text>
</svg>
