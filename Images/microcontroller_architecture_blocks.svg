<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="mcu-arch-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>

    <!-- CPU Center Gradient -->
    <linearGradient id="cpu-core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Marker Arrow -->
    <marker id="bus-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#mcu-arch-grid)" />
  <rect x="12" y="12" width="736" height="446" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="36" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.08em">INSIDE THE MICROCONTROLLER</text>
  <text x="380" y="52" fill="#94A3B8" font-size="8.5" text-anchor="middle">A conceptual representation of computation, memory, and peripherals integrated on a single chip</text>

  <!-- Outer Microcontroller Package (IC Boundary) -->
  <g transform="translate(45, 68)">
    <!-- External IC Pins Left -->
    <g fill="#94A3B8">
      <rect x="-12" y="30" width="12" height="6" rx="1.5" />
      <rect x="-12" y="65" width="12" height="6" rx="1.5" />
      <rect x="-12" y="100" width="12" height="6" rx="1.5" />
      <rect x="-12" y="135" width="12" height="6" rx="1.5" />
      <rect x="-12" y="170" width="12" height="6" rx="1.5" />
      <rect x="-12" y="205" width="12" height="6" rx="1.5" />
      <rect x="-12" y="240" width="12" height="6" rx="1.5" />
      <rect x="-12" y="275" width="12" height="6" rx="1.5" />
      <rect x="-12" y="310" width="12" height="6" rx="1.5" />
    </g>

    <!-- External IC Pins Right -->
    <g fill="#94A3B8">
      <rect x="670" y="30" width="12" height="6" rx="1.5" />
      <rect x="670" y="65" width="12" height="6" rx="1.5" />
      <rect x="670" y="100" width="12" height="6" rx="1.5" />
      <rect x="670" y="135" width="12" height="6" rx="1.5" />
      <rect x="670" y="170" width="12" height="6" rx="1.5" />
      <rect x="670" y="205" width="12" height="6" rx="1.5" />
      <rect x="670" y="240" width="12" height="6" rx="1.5" />
      <rect x="670" y="275" width="12" height="6" rx="1.5" />
      <rect x="670" y="310" width="12" height="6" rx="1.5" />
    </g>

    <!-- Single Silicon Die Body -->
    <rect width="670" height="360" rx="10" fill="#131B2A" stroke="#38BDF8" stroke-width="1.8" />
    <rect width="670" height="26" rx="10" fill="rgba(56, 189, 248, 0.12)" />
    <circle cx="16" cy="13" r="3.5" fill="#38BDF8" />
    <text x="335" y="17" fill="#38BDF8" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="0.08em">SINGLE SILICON DIE · THE MICROCONTROLLER SYSTEM</text>

    <!-- INTERNAL ON-CHIP SYSTEM BUS (The Central Interconnect Ring/Crossbar) -->
    <rect x="40" y="176" width="590" height="26" rx="5" fill="rgba(59, 130, 246, 0.18)" stroke="#3B82F6" stroke-dasharray="5 3" stroke-width="1.2" />
    <text x="335" y="192" fill="#93C5FD" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="0.1em">INTERNAL ON-CHIP SYSTEM BUS / INTERCONNECT</text>

    <!-- Vertical Bus Tap Lines connecting blocks to bus -->
    <!-- Memory taps (top left) -->
    <line x1="100" y1="126" x2="100" y2="176" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="220" y1="126" x2="220" y2="176" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- CPU Center tap -->
    <line x1="335" y1="140" x2="335" y2="176" stroke="#60A5FA" stroke-width="2.5" />
    <line x1="335" y1="202" x2="335" y2="238" stroke="#60A5FA" stroke-width="2.5" />

    <!-- Timers tap (top right) -->
    <line x1="565" y1="126" x2="565" y2="176" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Analog/GPIO/DAC taps (bottom left/center) -->
    <line x1="91" y1="202" x2="91" y2="242" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="221" y1="202" x2="221" y2="242" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="351" y1="202" x2="351" y2="242" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Comms taps (bottom right) -->
    <line x1="530" y1="202" x2="530" y2="238" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- ========================================== -->
    <!-- TOP ROW: MEMORY (LEFT) & TIMERS (RIGHT)    -->
    <!-- ========================================== -->

    <!-- FLASH MEMORY -->
    <g transform="translate(35, 42)">
      <rect width="130" height="84" rx="7" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
      <rect width="130" height="20" rx="7" fill="rgba(245, 158, 11, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#F59E0B" />
      <text x="65" y="14" fill="#FBBF24" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">FLASH</text>
      
      <text x="65" y="38" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Program Storage</text>
      <text x="65" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Permanent firmware</text>
      <text x="65" y="66" fill="#64748B" font-size="7" text-anchor="middle">Non-volatile memory</text>
    </g>

    <!-- SRAM -->
    <g transform="translate(180, 42)">
      <rect width="130" height="84" rx="7" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <rect width="130" height="20" rx="7" fill="rgba(16, 185, 129, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#10B981" />
      <text x="65" y="14" fill="#34D399" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">SRAM</text>
      
      <text x="65" y="38" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Data Memory</text>
      <text x="65" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Variables &amp; buffers</text>
      <text x="65" y="66" fill="#64748B" font-size="7" text-anchor="middle">Fast volatile workspace</text>
    </g>

    <!-- TIMERS -->
    <g transform="translate(490, 42)">
      <rect width="145" height="84" rx="7" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
      <rect width="145" height="20" rx="7" fill="rgba(236, 72, 153, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#EC4899" />
      <text x="72" y="14" fill="#F472B6" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">TIMERS</text>
      
      <text x="72" y="38" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Time &amp; Rhythm</text>
      <text x="72" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Delays · measurement</text>
      <text x="72" y="66" fill="#64748B" font-size="7" text-anchor="middle">Waveform generation (PWM)</text>
    </g>

    <!-- ========================================== -->
    <!-- VISUALLY CENTRAL: CPU / CORE               -->
    <!-- ========================================== -->
    <g transform="translate(245, 142)">
      <rect width="180" height="94" rx="9" fill="url(#cpu-core-glow)" stroke="#60A5FA" stroke-width="2.2" />
      <rect width="180" height="24" rx="9" fill="rgba(96, 165, 250, 0.2)" />
      <circle cx="16" cy="12" r="4" fill="#60A5FA" />
      <text x="90" y="16" fill="#FFFFFF" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.08em">CPU / CORE</text>

      <text x="90" y="44" fill="#93C5FD" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">EXECUTION ENGINE</text>
      <text x="90" y="60" fill="#E2E8F0" font-size="8" text-anchor="middle">Fetches &amp; runs instructions</text>
      <text x="90" y="74" fill="#94A3B8" font-size="7.5" text-anchor="middle">Orchestrates entire controller</text>
    </g>

    <!-- ========================================== -->
    <!-- BOTTOM ROW: GPIO, ADC, DAC & COMMS         -->
    <!-- ========================================== -->

    <!-- GPIO -->
    <g transform="translate(32, 242)">
      <rect width="118" height="92" rx="7" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <rect width="118" height="20" rx="7" fill="rgba(56, 189, 248, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#38BDF8" />
      <text x="59" y="14" fill="#38BDF8" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">GPIO</text>
      
      <text x="59" y="38" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Digital Pins</text>
      <text x="59" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Reads logic inputs</text>
      <text x="59" y="66" fill="#94A3B8" font-size="7" text-anchor="middle">Drives digital outputs</text>
      <text x="59" y="80" fill="#64748B" font-size="7" text-anchor="middle">Buttons · LEDs · switches</text>
    </g>

    <!-- ADC -->
    <g transform="translate(162, 242)">
      <rect width="118" height="92" rx="7" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" />
      <rect width="118" height="20" rx="7" fill="rgba(167, 139, 250, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#A78BFA" />
      <text x="59" y="14" fill="#C4B5FD" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">ADC</text>
      
      <text x="59" y="38" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Analog-to-Digital</text>
      <text x="59" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Continuous voltages</text>
      <text x="59" y="66" fill="#94A3B8" font-size="7" text-anchor="middle">Converted to numbers</text>
      <text x="59" y="80" fill="#64748B" font-size="7" text-anchor="middle">Sensors · potmeters</text>
    </g>

    <!-- DAC -->
    <g transform="translate(292, 242)">
      <rect width="118" height="92" rx="7" fill="#1E293B" stroke="#2DD4BF" stroke-width="1.5" />
      <rect width="118" height="20" rx="7" fill="rgba(45, 212, 191, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#2DD4BF" />
      <text x="59" y="14" fill="#5EEAD4" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">DAC</text>
      
      <text x="59" y="38" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Digital-to-Analog</text>
      <text x="59" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Numbers to voltages</text>
      <text x="59" y="66" fill="#94A3B8" font-size="7" text-anchor="middle">Produces analog signal</text>
      <text x="59" y="80" fill="#64748B" font-size="7" text-anchor="middle">Waveforms · audio · control</text>
    </g>

    <!-- COMMUNICATION PERIPHERALS CLUSTER (UART, SPI, I2C, CAN) -->
    <g transform="translate(422, 238)">
      <rect width="216" height="96" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.4" />
      <rect width="216" height="20" rx="8" fill="rgba(251, 191, 36, 0.14)" />
      <circle cx="12" cy="10" r="3" fill="#FBBF24" />
      <text x="108" y="14" fill="#FDE68A" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">COMMUNICATION PERIPHERALS</text>

      <!-- 4 Protocol Mini-Cards -->
      <!-- UART -->
      <g transform="translate(10, 28)">
        <rect width="93" height="28" rx="4" fill="#0F172A" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1" />
        <text x="46.5" y="13" fill="#FBBF24" font-size="7.5" font-weight="700" text-anchor="middle">UART</text>
        <text x="46.5" y="23" fill="#94A3B8" font-size="6.5" text-anchor="middle">Asynchronous serial</text>
      </g>

      <!-- SPI -->
      <g transform="translate(113, 28)">
        <rect width="93" height="28" rx="4" fill="#0F172A" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1" />
        <text x="46.5" y="13" fill="#FBBF24" font-size="7.5" font-weight="700" text-anchor="middle">SPI</text>
        <text x="46.5" y="23" fill="#94A3B8" font-size="6.5" text-anchor="middle">High-speed bus</text>
      </g>

      <!-- I2C -->
      <g transform="translate(10, 60)">
        <rect width="93" height="28" rx="4" fill="#0F172A" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1" />
        <text x="46.5" y="13" fill="#FBBF24" font-size="7.5" font-weight="700" text-anchor="middle">I²C</text>
        <text x="46.5" y="23" fill="#94A3B8" font-size="6.5" text-anchor="middle">Two-wire multi-device</text>
      </g>

      <!-- CAN -->
      <g transform="translate(113, 60)">
        <rect width="93" height="28" rx="4" fill="#0F172A" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1" />
        <text x="46.5" y="13" fill="#FBBF24" font-size="7.5" font-weight="700" text-anchor="middle">CAN</text>
        <text x="46.5" y="23" fill="#94A3B8" font-size="6.5" text-anchor="middle">Robust industrial/auto</text>
      </g>
    </g>

  </g>

  <!-- Footnote -->
  <text x="380" y="454" fill="#64748B" font-size="7" text-anchor="middle">Conceptual architecture of a modern microcontroller — peripheral combinations vary by application</text>

</svg>
