<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="triad-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="triad-arrow-left" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 5 L 10 0 L 10 10 z" fill="#3B82F6" />
    </marker>
    <marker id="triad-arrow-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#triad-grid)" />
  <rect x="10" y="10" width="660" height="230" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="6" />

  <text x="340" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.06em">THE COMPUTING TRIAD: STORAGE, COMPUTATION, AND COMMUNICATION</text>

  <!-- Block 1: MEMORY (Stores) -->
  <rect x="40" y="60" width="165" height="150" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="40" y="60" width="165" height="30" rx="8" fill="rgba(56, 189, 248, 0.12)" />
  <text x="122" y="80" fill="#38BDF8" font-weight="800" font-size="10" text-anchor="middle" letter-spacing="0.05em">MEMORY</text>
  
  <rect x="65" y="102" width="115" height="20" rx="3" fill="#0F172A" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
  <text x="122" y="116" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">ROLE: STORES</text>
  
  <text x="122" y="142" fill="#CBD5E1" font-size="8" text-anchor="middle">Holds machine instructions</text>
  <text x="122" y="156" fill="#CBD5E1" font-size="8" text-anchor="middle">Preserves program variables</text>
  <text x="122" y="170" fill="#CBD5E1" font-size="8" text-anchor="middle">Buffers inbound telemetry</text>
  <text x="122" y="196" fill="#64748B" font-size="7" text-anchor="middle">DRAM • SRAM • Flash</text>

  <!-- Interconnect Line 1 (Memory <-> CPU) -->
  <line x1="205" y1="130" x2="250" y2="130" stroke="#3B82F6" stroke-width="2" />
  <path d="M 215 130 L 205 130" stroke="#3B82F6" stroke-width="2" marker-start="url(#triad-arrow-left)" />
  <path d="M 240 130 L 250 130" stroke="#3B82F6" stroke-width="2" marker-end="url(#triad-arrow-right)" />
  <text x="228" y="118" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="6.5" text-anchor="middle">Address / Data</text>

  <!-- Block 2: MICROPROCESSOR (Computes) -->
  <rect x="252" y="50" width="176" height="170" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2" />
  <rect x="252" y="50" width="176" height="32" rx="8" fill="rgba(59, 130, 246, 0.15)" />
  <circle cx="270" cy="66" r="3" fill="#3B82F6" />
  <text x="340" y="71" fill="#3B82F6" font-weight="800" font-size="10.5" text-anchor="middle" letter-spacing="0.05em">MICROPROCESSOR</text>

  <rect x="278" y="95" width="124" height="22" rx="3" fill="#0F172A" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
  <text x="340" y="110" fill="#3B82F6" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">ROLE: COMPUTES</text>

  <text x="340" y="136" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Fetches &amp; Decodes Instructions</text>
  <text x="340" y="152" fill="#CBD5E1" font-size="7.5" text-anchor="middle">Executes Arithmetic &amp; Logic</text>
  <text x="340" y="167" fill="#CBD5E1" font-size="7.5" text-anchor="middle">Evaluates Conditional Decisions</text>
  <text x="340" y="182" fill="#CBD5E1" font-size="7.5" text-anchor="middle">Controls System Interconnects</text>
  <text x="340" y="206" fill="#64748B" font-size="7" text-anchor="middle">The Active Engine</text>

  <!-- Interconnect Line 2 (CPU <-> I/O) -->
  <line x1="428" y1="130" x2="473" y2="130" stroke="#3B82F6" stroke-width="2" />
  <path d="M 438 130 L 428 130" stroke="#3B82F6" stroke-width="2" marker-start="url(#triad-arrow-left)" />
  <path d="M 463 130 L 473 130" stroke="#3B82F6" stroke-width="2" marker-end="url(#triad-arrow-right)" />
  <text x="451" y="118" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="6.5" text-anchor="middle">Control / IRQ</text>

  <!-- Block 3: INPUT / OUTPUT (Communicates) -->
  <rect x="475" y="60" width="165" height="150" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <rect x="475" y="60" width="165" height="30" rx="8" fill="rgba(16, 185, 129, 0.12)" />
  <text x="557" y="80" fill="#10B981" font-weight="800" font-size="10" text-anchor="middle" letter-spacing="0.05em">INPUT / OUTPUT</text>

  <rect x="500" y="102" width="115" height="20" rx="3" fill="#0F172A" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
  <text x="557" y="116" fill="#10B981" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">ROLE: COMMUNICATES</text>

  <text x="557" y="142" fill="#CBD5E1" font-size="8" text-anchor="middle">Samples real-world sensors</text>
  <text x="557" y="156" fill="#CBD5E1" font-size="8" text-anchor="middle">Drives physical actuators</text>
  <text x="557" y="170" fill="#CBD5E1" font-size="8" text-anchor="middle">Exchanges network packets</text>
  <text x="557" y="196" fill="#64748B" font-size="7" text-anchor="middle">UART • PCIe • Ethernet • GPIO</text>
</svg>
