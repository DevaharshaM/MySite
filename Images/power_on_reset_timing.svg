<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">POWER-ON RESET (POR) TIMING DYNAMICS</text>

  <!-- Y-Axis VCC (Top Half) -->
  <line x1="50" y1="45" x2="50" y2="120" stroke="rgba(148,163,184,0.3)" stroke-width="1.5" />
  <text x="40" y="55" fill="#64748B" font-size="7" font-family="monospace">VCC</text>
  
  <!-- VCC Curve -->
  <path d="M 50 115 
           L 150 115 
           Q 190 115 220 70
           L 300 70
           H 580" 
        fill="none" stroke="#3B82F6" stroke-width="2.5" />
  <text x="590" y="73" fill="#3B82F6" font-size="8" font-family="monospace">VCC</text>
  
  <!-- Threshold Line V_POR -->
  <line x1="50" y1="85" x2="580" y2="85" stroke="#EF4444" stroke-width="1" stroke-dasharray="3,3" />
  <text x="590" y="88" fill="#EF4444" font-size="8" font-family="monospace">V_POR (1.8V)</text>

  <!-- Y-Axis RESET (Bottom Half) -->
  <line x1="50" y1="135" x2="50" y2="210" stroke="rgba(148,163,184,0.3)" stroke-width="1.5" />
  <text x="35" y="145" fill="#64748B" font-size="7" font-family="monospace">RESET</text>

  <!-- RESET Curve -->
  <path d="M 50 205 
           L 380 205 
           V 160 
           H 580" 
        fill="none" stroke="#10B981" stroke-width="2.5" />
  <text x="590" y="163" fill="#10B981" font-size="8" font-family="monospace">RESET (Active-Low)</text>

  <!-- Time lines/guidelines -->
  <!-- VCC crosses threshold at X=210 -->
  <line x1="210" y1="70" x2="210" y2="205" stroke="rgba(148,163,184,0.2)" stroke-dasharray="2,2" stroke-width="1" />
  <text x="210" y="222" fill="#64748B" font-size="7" text-anchor="middle">V_POR Crossed</text>

  <!-- RESET released at X=380 -->
  <line x1="380" y1="70" x2="380" y2="205" stroke="rgba(148,163,184,0.2)" stroke-dasharray="2,2" stroke-width="1" />
  <text x="380" y="222" fill="#10B981" font-size="7" text-anchor="middle">CPU Starts Executing</text>

  <!-- Oscillator Stabilization delay -->
  <path d="M 215 190 H 375" fill="none" stroke="#F59E0B" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="295" y="185" fill="#F59E0B" font-size="8" text-anchor="middle">Delay: Oscillator Stabilizing</text>
</svg>
