<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="inst-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#inst-grid)" />
  <rect x="10" y="10" width="700" height="200" fill="none" stroke="rgba(148,163,184,0.1)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">FROM ABSTRACT DESIRE TO SILICON EXECUTION</text>

  <!-- Step 1: Human Desire -->
  <rect x="35" y="55" width="170" height="135" rx="8" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.2" />
  <text x="120" y="76" fill="#94A3B8" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.06em">INTENT</text>
  <rect x="55" y="90" width="130" height="35" rx="4" fill="#0F172A" stroke="rgba(148,163,184,0.15)" stroke-width="1" />
  <text x="120" y="113" fill="#E2E8F0" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">2 + 3</text>
  <text x="120" y="150" fill="#64748B" font-size="8" text-anchor="middle">A simple mathematical intent.</text>
  <text x="120" y="165" fill="#94A3B8" font-size="7.5" text-anchor="middle">How does hardware know?</text>

  <!-- Arrow 1 -->
  <path d="M 210 120 L 255 120" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Step 2: The Instruction -->
  <rect x="265" y="55" width="190" height="135" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.6" />
  <text x="360" y="76" fill="#3B82F6" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.06em">THE INSTRUCTION</text>
  <rect x="285" y="90" width="150" height="35" rx="4" fill="#0F172A" stroke="rgba(59,130,246,0.3)" stroke-width="1" />
  <text x="360" y="112" fill="#60A5FA" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">ADD R1, R2</text>
  <text x="360" y="150" fill="#CBD5E1" font-size="8" text-anchor="middle">The contract of action.</text>
  <text x="360" y="165" fill="#94A3B8" font-size="7.5" text-anchor="middle">A numeric code the processor decodes.</text>

  <!-- Arrow 2 -->
  <path d="M 460 120 L 505 120" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- Step 3: Silicon Consequence -->
  <rect x="515" y="55" width="170" height="135" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
  <text x="600" y="76" fill="#10B981" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.06em">CONSEQUENCE</text>
  <rect x="535" y="90" width="130" height="35" rx="4" fill="#0F172A" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
  <text x="600" y="113" fill="#34D399" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700" text-anchor="middle">5</text>
  <text x="600" y="150" fill="#CBD5E1" font-size="8" text-anchor="middle">State updated in register.</text>
  <text x="600" y="165" fill="#6EE7B7" font-size="7.5" text-anchor="middle">Action accomplished.</text>
</svg>
