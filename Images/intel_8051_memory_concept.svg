<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid-mem" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-mem" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-mem)" />
  <rect x="12" y="12" width="736" height="356" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="36" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE 8051 HARVARD MEMORY CONCEPT</text>
  <text x="380" y="52" fill="#94A3B8" font-size="8.5" text-anchor="middle">Complete physical and logical separation: Program Code Space vs Internal Data RAM &amp; Special Function Registers</text>

  <!-- ============================================================ -->
  <!-- LEFT COLUMN: PROGRAM MEMORY (CODE SPACE) (x=35, width=320)  -->
  <!-- ============================================================ -->
  <g transform="translate(35, 75)" filter="url(#shadow-mem)">
    <rect width="320" height="270" rx="6" fill="#131B2A" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.2" />
    <rect width="320" height="26" rx="6" fill="rgba(167, 139, 250, 0.15)" />
    <circle cx="14" cy="13" r="3.5" fill="#A78BFA" />
    <text x="160" y="17" fill="#C4B5FD" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.06em">PROGRAM MEMORY · CODE SPACE (64 KB)</text>

    <!-- Subtitle banner -->
    <rect x="15" y="36" width="290" height="24" rx="4" fill="#1E293B" stroke="rgba(167, 139, 250, 0.2)" />
    <text x="160" y="51" fill="#E2E8F0" font-size="7.5" font-weight="600" text-anchor="middle">Stores Firmware / Program Instructions</text>

    <!-- Address Space Blocks -->
    <!-- 4 KB On-Chip ROM -->
    <g transform="translate(20, 72)">
      <rect width="280" height="74" rx="4" fill="#1E293B" stroke="#A78BFA" stroke-width="1.2" />
      <text x="15" y="24" fill="#C4B5FD" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">4 KB ON-CHIP ROM (FLASH)</text>
      <text x="15" y="42" fill="#94A3B8" font-size="7">Original 8051 on-chip program memory.</text>
      <text x="15" y="56" fill="#A78BFA" font-family="'IBM Plex Mono', monospace" font-size="7">Address Range: 0000H → 0FFFH</text>
      <text x="265" y="45" fill="#C4B5FD" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="end">INTERNAL</text>
    </g>

    <!-- External Program Expansion -->
    <g transform="translate(20, 156)">
      <rect width="280" height="60" rx="4" fill="#0F172A" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1" stroke-dasharray="3,3" />
      <text x="15" y="22" fill="#CBD5E1" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600">60 KB EXTERNAL EXPANSION</text>
      <text x="15" y="38" fill="#64748B" font-size="7">Optional external ROM/EPROM accessed via Port 0 &amp; 2.</text>
      <text x="15" y="50" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="6.8">Address Range: 1000H → FFFFH</text>
    </g>

    <!-- Footer callout -->
    <g transform="translate(20, 226)">
      <rect width="280" height="28" rx="4" fill="rgba(167, 139, 250, 0.08)" stroke="rgba(167, 139, 250, 0.25)" />
      <text x="140" y="17" fill="#C4B5FD" font-size="7" font-weight="600" text-anchor="middle">Addressed by 16-Bit Program Counter (PC)</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT COLUMN: INTERNAL DATA MEMORY & SFRs (x=405, width=320)-->
  <!-- ============================================================ -->
  <g transform="translate(405, 75)" filter="url(#shadow-mem)">
    <rect width="320" height="270" rx="6" fill="#131B2A" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" />
    <rect width="320" height="26" rx="6" fill="rgba(52, 211, 153, 0.15)" />
    <circle cx="14" cy="13" r="3.5" fill="#34D399" />
    <text x="160" y="17" fill="#6EE7B7" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.06em">DATA MEMORY &amp; SPECIAL FUNCTION REGISTERS</text>

    <!-- 1. Special Function Registers (SFRs) Top -->
    <g transform="translate(20, 36)">
      <rect width="280" height="92" rx="5" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
      <text x="15" y="20" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700">SPECIAL FUNCTION REGISTERS (SFRs)</text>
      <text x="265" y="20" fill="#F59E0B" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="end">80H – FFH</text>

      <text x="15" y="36" fill="#E2E8F0" font-size="7.5" font-weight="600">PURPOSE: CONTROL &amp; STATUS</text>
      <text x="15" y="49" fill="#94A3B8" font-size="7">Dedicated registers governing CPU operations, I/O ports, timers, UART, and interrupts.</text>

      <!-- SFR examples -->
      <g transform="translate(15, 58)" font-family="'IBM Plex Mono', monospace" font-size="6.5">
        <rect x="0" y="0" width="48" height="16" rx="2" fill="#131B2A" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="24" y="11" fill="#FDE68A" text-anchor="middle">ACC / B</text>

        <rect x="54" y="0" width="48" height="16" rx="2" fill="#131B2A" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="78" y="11" fill="#FDE68A" text-anchor="middle">P0 – P3</text>

        <rect x="108" y="0" width="48" height="16" rx="2" fill="#131B2A" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="132" y="11" fill="#FDE68A" text-anchor="middle">PSW / SP</text>

        <rect x="162" y="0" width="88" height="16" rx="2" fill="#131B2A" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="206" y="11" fill="#FDE68A" text-anchor="middle">TCON / SCON / IE</text>
      </g>

      <text x="15" y="86" fill="#FBBF24" font-size="6.5" font-style="italic">Not ordinary RAM: writing here alters microcontroller behavior.</text>
    </g>

    <!-- 2. Internal RAM (128 Bytes) Bottom -->
    <g transform="translate(20, 138)">
      <rect width="280" height="116" rx="5" fill="#1E293B" stroke="#34D399" stroke-width="1.2" />
      <text x="15" y="20" fill="#34D399" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700">128 BYTES INTERNAL DATA RAM</text>
      <text x="265" y="20" fill="#34D399" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="end">00H – 7FH</text>

      <text x="15" y="36" fill="#E2E8F0" font-size="7.5" font-weight="600">PURPOSE: WORKING DATA &amp; STACK</text>

      <!-- Three internal RAM segments -->
      <g transform="translate(15, 44)" font-size="6.8">
        <!-- Scratchpad -->
        <rect x="0" y="0" width="250" height="18" rx="2" fill="#131B2A" stroke="rgba(52, 211, 153, 0.25)" />
        <text x="10" y="12" fill="#CBD5E1">General Purpose Scratchpad RAM (Stack lives here)</text>
        <text x="240" y="12" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" text-anchor="end">30H – 7FH</text>

        <!-- Bit-Addressable -->
        <rect x="0" y="22" width="250" height="18" rx="2" fill="#131B2A" stroke="rgba(52, 211, 153, 0.25)" />
        <text x="10" y="34" fill="#6EE7B7">Bit-Addressable RAM (128 individual bits)</text>
        <text x="240" y="34" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" text-anchor="end">20H – 2FH</text>

        <!-- Register Banks -->
        <rect x="0" y="44" width="250" height="18" rx="2" fill="#131B2A" stroke="rgba(52, 211, 153, 0.25)" />
        <text x="10" y="56" fill="#CBD5E1">4 Register Banks (R0 – R7 in each bank)</text>
        <text x="240" y="56" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" text-anchor="end">00H – 1FH</text>
      </g>
    </g>
  </g>
</svg>
