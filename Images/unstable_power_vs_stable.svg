<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">IDEAL LAB VS. UNPREDICTABLE REALITY</text>

  <!-- Left: Ideal Lab Power -->
  <text x="160" y="60" fill="#3B82F6" font-weight="bold" font-size="9" text-anchor="middle">Ideal Laboratory Power</text>
  <line x1="40" y1="180" x2="280" y2="180" stroke="rgba(148,163,184,0.2)" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="40" y1="120" x2="280" y2="120" stroke="#3B82F6" stroke-width="2" />
  <text x="290" y="123" fill="#3B82F6" font-size="7" font-family="monospace">VCC (3.3V)</text>
  <text x="290" y="183" fill="#64748B" font-size="7" font-family="monospace">GND</text>
  <text x="160" y="205" fill="#64748B" font-size="8" text-anchor="middle">No noise • No dips • Instant rise</text>

  <!-- Divider -->
  <line x1="320" y1="50" x2="320" y2="210" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- Right: Real World Unstable Power -->
  <text x="480" y="60" fill="#F59E0B" font-weight="bold" font-size="9" text-anchor="middle">Real World Electrical Noise</text>
  <line x1="360" y1="180" x2="600" y2="180" stroke="rgba(148,163,184,0.2)" stroke-dasharray="3,3" stroke-width="1" />
  
  <!-- Dynamic wave path showing noise, motor startup drop, spikes -->
  <path d="M 360 170 
           Q 370 90 380 130 
           T 400 120 
           T 420 120 
           L 440 120 
           Q 455 120 460 160 
           Q 470 165 480 120 
           T 500 120 
           Q 505 100 510 120 
           T 520 120 
           T 530 120
           Q 540 120 545 140 
           Q 550 145 555 120 
           Q 560 115 570 120 
           T 590 120 
           T 600 120" 
        fill="none" stroke="#F59E0B" stroke-width="2" />
        
  <text x="400" y="145" fill="#F59E0B" font-size="7" text-anchor="middle">Slow Ramp</text>
  <text x="460" y="175" fill="#EF4444" font-size="7" font-weight="bold" text-anchor="middle">Motor Dip</text>
  <text x="510" y="90" fill="#F59E0B" font-size="7" text-anchor="middle">Inductive Spike</text>
  
  <text x="480" y="205" fill="#64748B" font-size="8" text-anchor="middle">Voltages fluctuate • Inductive transients • Slowly charging rails</text>
</svg>
