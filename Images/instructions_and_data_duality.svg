<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="duo-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="duo-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8" />
    </marker>
    <marker id="duo-arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Background and Frame -->
  <rect width="100%" height="100%" fill="url(#duo-grid)" />
  <rect x="12" y="12" width="696" height="196" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">TWO FUNDAMENTAL REQUIREMENTS</text>
  <text x="360" y="47" fill="#94A3B8" font-size="8" text-anchor="middle">Every computation depends on two entirely different categories of information</text>

  <!-- Left Box: INSTRUCTIONS -->
  <g transform="translate(60, 64)">
    <rect width="280" height="125" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
    <rect width="280" height="24" rx="8" fill="rgba(56, 189, 248, 0.12)" />
    <circle cx="16" cy="12" r="3" fill="#38BDF8" />
    <text x="140" y="16" fill="#38BDF8" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="0.08em">INSTRUCTIONS</text>

    <!-- Downward Arrow -->
    <line x1="140" y1="36" x2="140" y2="58" stroke="#38BDF8" stroke-width="2" marker-end="url(#duo-arrow-blue)" />

    <!-- Label -->
    <rect x="25" y="68" width="230" height="42" rx="6" fill="#0F172A" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="140" y="86" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">What to do</text>
    <text x="140" y="100" fill="#94A3B8" font-size="7.5" text-anchor="middle">Sequences of operations · logic · control flow</text>
  </g>

  <!-- Right Box: DATA -->
  <g transform="translate(380, 64)">
    <rect width="280" height="125" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    <rect width="280" height="24" rx="8" fill="rgba(245, 158, 11, 0.12)" />
    <circle cx="16" cy="12" r="3" fill="#F59E0B" />
    <text x="140" y="16" fill="#FBBF24" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="0.08em">DATA</text>

    <!-- Downward Arrow -->
    <line x1="140" y1="36" x2="140" y2="58" stroke="#F59E0B" stroke-width="2" marker-end="url(#duo-arrow-amber)" />

    <!-- Label -->
    <rect x="25" y="68" width="230" height="42" rx="6" fill="#0F172A" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
    <text x="140" y="86" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">What to work with</text>
    <text x="140" y="100" fill="#94A3B8" font-size="7.5" text-anchor="middle">Sensor readings · variables · counter values</text>
  </g>
</svg>
