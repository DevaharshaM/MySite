<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="pipe-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#pipe-grid)" />
  <rect x="10" y="10" width="700" height="270" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">PIPELINING: THE OVERLAPPING RHYTHM</text>

  <!-- Cycle Headers -->
  <g fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">
    <text x="210" y="60">CYCLE 1</text>
    <text x="310" y="60">CYCLE 2</text>
    <text x="410" y="60">CYCLE 3</text>
    <text x="510" y="60">CYCLE 4</text>
    <text x="610" y="60">CYCLE 5</text>
  </g>

  <!-- Time Axis Line -->
  <line x1="150" y1="70" x2="670" y2="70" stroke="rgba(148,163,184,0.2)" stroke-width="1" />

  <!-- Highlight Box around Cycle 3 (Column) -->
  <rect x="365" y="75" width="90" height="150" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="410" y="240" fill="#60A5FA" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="600" text-anchor="middle">3 stages active at once</text>

  <!-- Row 1: Instruction 1 -->
  <text x="40" y="108" fill="#CBD5E1" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">Inst 1</text>
  
  <rect x="165" y="90" width="90" height="30" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
  <text x="210" y="109" fill="#38BDF8" font-size="8.5" font-weight="700" text-anchor="middle">FETCH</text>

  <rect x="265" y="90" width="90" height="30" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
  <text x="310" y="109" fill="#F59E0B" font-size="8.5" font-weight="700" text-anchor="middle">DECODE</text>

  <rect x="365" y="90" width="90" height="30" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.4" />
  <text x="410" y="109" fill="#10B981" font-size="8.5" font-weight="700" text-anchor="middle">EXECUTE</text>

  <!-- Row 2: Instruction 2 -->
  <text x="40" y="153" fill="#CBD5E1" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">Inst 2</text>
  
  <rect x="265" y="135" width="90" height="30" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
  <text x="310" y="154" fill="#38BDF8" font-size="8.5" font-weight="700" text-anchor="middle">FETCH</text>

  <rect x="365" y="135" width="90" height="30" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.4" />
  <text x="410" y="154" fill="#F59E0B" font-size="8.5" font-weight="700" text-anchor="middle">DECODE</text>

  <rect x="465" y="135" width="90" height="30" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
  <text x="510" y="154" fill="#10B981" font-size="8.5" font-weight="700" text-anchor="middle">EXECUTE</text>

  <!-- Row 3: Instruction 3 -->
  <text x="40" y="198" fill="#CBD5E1" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">Inst 3</text>
  
  <rect x="365" y="180" width="90" height="30" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4" />
  <text x="410" y="199" fill="#38BDF8" font-size="8.5" font-weight="700" text-anchor="middle">FETCH</text>

  <rect x="465" y="180" width="90" height="30" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
  <text x="510" y="199" fill="#F59E0B" font-size="8.5" font-weight="700" text-anchor="middle">DECODE</text>

  <rect x="565" y="180" width="90" height="30" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
  <text x="610" y="199" fill="#10B981" font-size="8.5" font-weight="700" text-anchor="middle">EXECUTE</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="110" y="252" width="500" height="20" rx="4" fill="#0F172A" stroke="rgba(148,163,184,0.15)" stroke-width="1" />
  <text x="360" y="266" fill="#94A3B8" font-size="8" text-anchor="middle">Different instructions occupy different stages at the exact same moment.</text>
</svg>
