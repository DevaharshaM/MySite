<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="flow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="30" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">THE LIFECYCLE OF INFORMATION</text>

  <!-- Left: Physical World Input -->
  <rect x="25" y="65" width="85" height="120" rx="4" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="67.5" y="85" fill="#3B82F6" font-weight="bold" font-size="9" text-anchor="middle">Physical Input</text>
  <text x="67.5" y="110" fill="#64748B" font-size="7" text-anchor="middle">Temperature</text>
  <text x="67.5" y="125" fill="#64748B" font-size="7" text-anchor="middle">Pressure</text>
  <text x="67.5" y="140" fill="#64748B" font-size="7" text-anchor="middle">Rotation</text>
  <text x="67.5" y="165" fill="#E2E8F0" font-size="8" text-anchor="middle">(Continuous Waves)</text>

  <!-- Arrow Input -> Digitizer -->
  <path d="M 110 125 H 135" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-flow)" />

  <!-- Center-Left: Digitizer & Memory -->
  <rect x="145" y="65" width="135" height="120" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="212.5" y="85" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">1. Translation</text>
  <rect x="155" y="100" width="115" height="30" rx="3" fill="#0F172A" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1" />
  <text x="212.5" y="118" fill="#10B981" font-size="8" font-weight="bold" text-anchor="middle">Sensor &amp; ADC</text>
  <rect x="155" y="140" width="115" height="30" rx="3" fill="#0F172A" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1" />
  <text x="212.5" y="158" fill="#10B981" font-size="8" font-weight="bold" text-anchor="middle">SRAM Array</text>

  <!-- Arrow Translation -> Process -->
  <path d="M 280 125 H 305" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-flow)" />

  <!-- Center-Right: CPU Processing -->
  <rect x="315" y="65" width="135" height="120" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="382.5" y="85" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">2. Decision</text>
  <rect x="325" y="100" width="115" height="30" rx="3" fill="#0F172A" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1" />
  <text x="382.5" y="118" fill="#F59E0B" font-size="8" font-weight="bold" text-anchor="middle">CPU Registers</text>
  <rect x="325" y="140" width="115" height="30" rx="3" fill="#0F172A" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1" />
  <text x="382.5" y="158" fill="#F59E0B" font-size="8" font-weight="bold" text-anchor="middle">Control Algorithm</text>

  <!-- Arrow Process -> Output -->
  <path d="M 450 125 H 475" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-flow)" />

  <!-- Right: Physical World Output -->
  <rect x="485" y="65" width="130" height="120" rx="4" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="550" y="85" fill="#F59E0B" font-weight="bold" font-size="9" text-anchor="middle">3. Physical Action</text>
  <rect x="495" y="100" width="110" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1" />
  <text x="550" y="118" fill="#FFF" font-size="8" text-anchor="middle">DAC / UART / CAN</text>
  <rect x="495" y="140" width="110" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1" />
  <text x="550" y="158" fill="#FFF" font-size="8" text-anchor="middle">Motor / Actuator</text>

  <!-- Flow labels -->
  <text x="212.5" y="205" fill="#64748B" font-size="7" text-anchor="middle">Waves &#8594; Numbers</text>
  <text x="382.5" y="205" fill="#64748B" font-size="7" text-anchor="middle">Numbers &#8594; Choice</text>
  <text x="550" y="205" fill="#64748B" font-size="7" text-anchor="middle">Choice &#8594; Physical Force</text>
</svg>
