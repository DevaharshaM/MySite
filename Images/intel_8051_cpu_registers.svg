<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid-cpu" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-cpu" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-cpu)" />
  <rect x="12" y="12" width="736" height="356" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="36" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE 8051 CPU CORE &amp; KEY WORKING REGISTERS</text>
  <text x="380" y="52" fill="#94A3B8" font-size="8.5" text-anchor="middle">Central arithmetic processing unit, 8-bit accumulators, status flags, and 16-bit address registers</text>

  <!-- Central CPU Internal Bus (Vertical) -->
  <g transform="translate(366, 75)">
    <rect x="0" y="0" width="28" height="270" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
    <text x="14" y="140" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle" transform="rotate(-90 14 140)" letter-spacing="0.1em">INTERNAL 8-BIT CPU BUS</text>
  </g>

  <!-- ============================================================ -->
  <!-- LEFT COLUMN: ARITHMETIC & STATUS (x = 30 to 345)            -->
  <!-- ============================================================ -->
  <!-- 1. Accumulator (ACC / A) -->
  <g transform="translate(35, 75)" filter="url(#shadow-cpu)">
    <rect width="310" height="62" rx="6" fill="#131B2A" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <rect width="310" height="20" rx="6" fill="rgba(56, 189, 248, 0.15)" />
    <text x="16" y="14" fill="#38BDF8" font-size="8" font-weight="700">ACCUMULATOR (REGISTER A) · 8-BIT</text>
    <text x="294" y="14" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="end">SFR: E0H</text>

    <text x="16" y="36" fill="#E2E8F0" font-size="7.8">The primary working register of the 8051.</text>
    <text x="16" y="49" fill="#94A3B8" font-size="7">Holds an operand before an operation and receives the result of almost all arithmetic/logic instructions.</text>

    <!-- Bus connector right -->
    <line x1="310" y1="31" x2="331" y2="31" stroke="#38BDF8" stroke-width="1.5" />
    <polygon points="331,31 325,28 325,34" fill="#38BDF8" />
  </g>

  <!-- 2. B Register -->
  <g transform="translate(35, 147)" filter="url(#shadow-cpu)">
    <rect width="310" height="62" rx="6" fill="#131B2A" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <rect width="310" height="20" rx="6" fill="rgba(56, 189, 248, 0.15)" />
    <text x="16" y="14" fill="#38BDF8" font-size="8" font-weight="700">B REGISTER · 8-BIT</text>
    <text x="294" y="14" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="end">SFR: F0H</text>

    <text x="16" y="36" fill="#E2E8F0" font-size="7.8">Dedicated math register paired with Accumulator.</text>
    <text x="16" y="49" fill="#94A3B8" font-size="7">Used exclusively during MUL AB (multiplication) and DIV AB (division), or as general scratchpad.</text>

    <!-- Bus connector right -->
    <line x1="310" y1="31" x2="331" y2="31" stroke="#38BDF8" stroke-width="1.5" />
    <polygon points="331,31 325,28 325,34" fill="#38BDF8" />
  </g>

  <!-- 3. ALU Core & PSW -->
  <g transform="translate(35, 219)" filter="url(#shadow-cpu)">
    <rect width="310" height="126" rx="6" fill="#131B2A" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1.2" />
    <rect width="310" height="20" rx="6" fill="rgba(96, 165, 250, 0.15)" />
    <text x="16" y="14" fill="#60A5FA" font-size="8" font-weight="700">8-BIT ALU &amp; PROGRAM STATUS WORD (PSW)</text>
    <text x="294" y="14" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="end">SFR: D0H</text>

    <text x="16" y="36" fill="#E2E8F0" font-size="7.8">Arithmetic, Logic, and Bit-Level Processing Unit (Boolean Processor).</text>

    <!-- PSW Flags Visualization -->
    <g transform="translate(14, 46)">
      <text x="0" y="8" fill="#94A3B8" font-size="6.8" font-weight="600">PSW BITS (D7 → D0):</text>
      <!-- 8 flag boxes -->
      <g font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">
        <!-- CY -->
        <rect x="0" y="12" width="34" height="24" rx="2" fill="#1E293B" stroke="#F59E0B" />
        <text x="17" y="24" fill="#FBBF24" font-weight="700">CY</text>
        <text x="17" y="32" fill="#64748B" font-size="5.5">Carry</text>
        <!-- AC -->
        <rect x="36" y="12" width="34" height="24" rx="2" fill="#1E293B" stroke="rgba(148,163,184,0.3)" />
        <text x="53" y="24" fill="#E2E8F0" font-weight="700">AC</text>
        <text x="53" y="32" fill="#64748B" font-size="5.5">Aux Cy</text>
        <!-- F0 -->
        <rect x="72" y="12" width="34" height="24" rx="2" fill="#1E293B" stroke="rgba(148,163,184,0.3)" />
        <text x="89" y="24" fill="#E2E8F0">F0</text>
        <text x="89" y="32" fill="#64748B" font-size="5.5">Flag 0</text>
        <!-- RS1 -->
        <rect x="108" y="12" width="34" height="24" rx="2" fill="#1E293B" stroke="#38BDF8" />
        <text x="125" y="24" fill="#38BDF8" font-weight="700">RS1</text>
        <text x="125" y="32" fill="#64748B" font-size="5.5">Bank 1</text>
        <!-- RS0 -->
        <rect x="144" y="12" width="34" height="24" rx="2" fill="#1E293B" stroke="#38BDF8" />
        <text x="161" y="24" fill="#38BDF8" font-weight="700">RS0</text>
        <text x="161" y="32" fill="#64748B" font-size="5.5">Bank 0</text>
        <!-- OV -->
        <rect x="180" y="12" width="34" height="24" rx="2" fill="#1E293B" stroke="#F59E0B" />
        <text x="197" y="24" fill="#FBBF24" font-weight="700">OV</text>
        <text x="197" y="32" fill="#64748B" font-size="5.5">Overflow</text>
        <!-- - -->
        <rect x="216" y="12" width="30" height="24" rx="2" fill="#1E293B" stroke="rgba(148,163,184,0.2)" />
        <text x="231" y="27" fill="#64748B">-</text>
        <!-- P -->
        <rect x="248" y="12" width="34" height="24" rx="2" fill="#1E293B" stroke="rgba(148,163,184,0.3)" />
        <text x="265" y="24" fill="#E2E8F0">P</text>
        <text x="265" y="32" fill="#64748B" font-size="5.5">Parity</text>
      </g>
    </g>

    <text x="16" y="112" fill="#94A3B8" font-size="6.8">Reflects arithmetic results and controls active register bank (0–3).</text>

    <!-- Bus connector right -->
    <line x1="310" y1="63" x2="331" y2="63" stroke="#60A5FA" stroke-width="1.5" />
    <polygon points="331,63 325,60 325,66" fill="#60A5FA" />
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT COLUMN: ADDRESSING & POINTER REGISTERS (x = 415)      -->
  <!-- ============================================================ -->
  <!-- 4. Program Counter (PC) -->
  <g transform="translate(415, 75)" filter="url(#shadow-cpu)">
    <rect width="310" height="78" rx="6" fill="#131B2A" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.2" />
    <rect width="310" height="20" rx="6" fill="rgba(167, 139, 250, 0.15)" />
    <text x="16" y="14" fill="#C4B5FD" font-size="8" font-weight="700">PROGRAM COUNTER (PC) · 16-BIT</text>
    <text x="294" y="14" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="end">No Direct SFR</text>

    <text x="16" y="36" fill="#E2E8F0" font-size="7.8">Tracks the address of the next instruction to fetch.</text>
    <text x="16" y="49" fill="#94A3B8" font-size="7">Because code memory can span up to 64 KB, PC must be 16 bits wide.</text>
    <text x="16" y="62" fill="#A78BFA" font-family="'IBM Plex Mono', monospace" font-size="6.8">Range: 0000H → FFFFH (65,536 Addresses)</text>

    <!-- Bus connector left -->
    <line x1="0" y1="39" x2="-21" y2="39" stroke="#A78BFA" stroke-width="1.5" />
    <polygon points="-21,39 -15,36 -15,42" fill="#A78BFA" />
  </g>

  <!-- 5. Data Pointer (DPTR) -->
  <g transform="translate(415, 163)" filter="url(#shadow-cpu)">
    <rect width="310" height="88" rx="6" fill="#131B2A" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" />
    <rect width="310" height="20" rx="6" fill="rgba(52, 211, 153, 0.15)" />
    <text x="16" y="14" fill="#6EE7B7" font-size="8" font-weight="700">DATA POINTER (DPTR) · 16-BIT (DPH + DPL)</text>
    <text x="294" y="14" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="end">SFR: 82H / 83H</text>

    <text x="16" y="36" fill="#E2E8F0" font-size="7.8">16-bit address register used to access external data memory.</text>
    
    <!-- Split bytes visual -->
    <g transform="translate(16, 44)" font-family="'IBM Plex Mono', monospace" font-size="7">
      <rect x="0" y="0" width="134" height="22" rx="3" fill="#1E293B" stroke="#34D399" />
      <text x="67" y="14" fill="#A7F3D0" text-anchor="middle">DPH (High Byte · 8b)</text>

      <rect x="144" y="0" width="134" height="22" rx="3" fill="#1E293B" stroke="#34D399" />
      <text x="211" y="14" fill="#A7F3D0" text-anchor="middle">DPL (Low Byte · 8b)</text>
    </g>

    <text x="16" y="78" fill="#94A3B8" font-size="6.8">Can be accessed as a single 16-bit pointer or two separate 8-bit registers.</text>

    <!-- Bus connector left -->
    <line x1="0" y1="44" x2="-21" y2="44" stroke="#34D399" stroke-width="1.5" />
    <polygon points="-21,44 -15,41 -15,47" fill="#34D399" />
  </g>

  <!-- 6. Stack Pointer (SP) -->
  <g transform="translate(415, 261)" filter="url(#shadow-cpu)">
    <rect width="310" height="84" rx="6" fill="#131B2A" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
    <rect width="310" height="20" rx="6" fill="rgba(245, 158, 11, 0.15)" />
    <text x="16" y="14" fill="#FBBF24" font-size="8" font-weight="700">STACK POINTER (SP) · 8-BIT</text>
    <text x="294" y="14" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="end">SFR: 81H</text>

    <text x="16" y="36" fill="#E2E8F0" font-size="7.8">Points to the top of the stack located in internal RAM.</text>
    <text x="16" y="49" fill="#94A3B8" font-size="7">Increments before data is pushed; decrements after data is popped.</text>
    <text x="16" y="62" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="6.8">Reset Default: 07H (Points to top of Register Bank 0)</text>

    <!-- Bus connector left -->
    <line x1="0" y1="42" x2="-21" y2="42" stroke="#F59E0B" stroke-width="1.5" />
    <polygon points="-21,42 -15,39 -15,45" fill="#F59E0B" />
  </g>
</svg>
