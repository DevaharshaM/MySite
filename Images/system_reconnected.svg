<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="rec-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="rec-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="rec-arrow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    <marker id="rec-arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8" />
    </marker>
    <filter id="rec-blue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#rec-grid)" />
  <rect x="10" y="10" width="700" height="260" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">ZOOM BACK OUT: THE SYSTEM RECONNECTED</text>

  <!-- Top: MEMORY -->
  <rect x="260" y="46" width="200" height="58" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4" />
  <text x="360" y="64" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">MEMORY</text>
  <text x="360" y="80" fill="#FFFFFF" font-size="9" font-weight="600" text-anchor="middle">Holds instructions &amp; state.</text>
  <text x="360" y="94" fill="#94A3B8" font-size="7.5" text-anchor="middle">Fed to the processor on demand.</text>

  <!-- Bi-directional connection between Memory and CPU -->
  <line x1="360" y1="104" x2="360" y2="128" stroke="#38BDF8" stroke-width="2" />
  <path d="M 360 106 L 360 104" stroke="#38BDF8" stroke-width="2" marker-start="url(#rec-arrow-cyan)" />
  <path d="M 360 126 L 360 128" stroke="#38BDF8" stroke-width="2" marker-end="url(#rec-arrow-cyan)" />

  <!-- Left: INPUT -->
  <rect x="35" y="130" width="170" height="120" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.4" />
  <rect x="35" y="130" width="170" height="24" rx="8" fill="rgba(16, 185, 129, 0.12)" />
  <text x="120" y="146" fill="#10B981" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">INPUT</text>
  <text x="120" y="174" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Provides information.</text>
  <text x="120" y="196" fill="#CBD5E1" font-size="8" text-anchor="middle">Touch, keys, packets,</text>
  <text x="120" y="210" fill="#CBD5E1" font-size="8" text-anchor="middle">physical telemetry</text>
  <rect x="55" y="222" width="130" height="18" rx="3" fill="#0F172A" />
  <text x="120" y="234" fill="#6EE7B7" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Signals Flow In →</text>

  <!-- Flow 1: Input to Processor -->
  <path d="M 205 190 L 245 190" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rec-arrow-blue)" />

  <!-- Center: MICROPROCESSOR -->
  <rect x="250" y="128" width="220" height="124" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2" filter="url(#rec-blue-glow)" />
  <rect x="250" y="128" width="220" height="26" rx="8" fill="rgba(59, 130, 246, 0.18)" />
  <circle cx="268" cy="141" r="3" fill="#3B82F6" />
  <text x="360" y="145" fill="#3B82F6" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.06em">MICROPROCESSOR</text>
  <text x="360" y="174" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">Computes &amp; Decides.</text>
  <text x="360" y="194" fill="#CBD5E1" font-size="8" text-anchor="middle">Takes information from input,</text>
  <text x="360" y="208" fill="#CBD5E1" font-size="8" text-anchor="middle">works on it, coordinates with memory.</text>
  <rect x="270" y="222" width="180" height="18" rx="3" fill="#0F172A" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
  <text x="360" y="234" fill="#60A5FA" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="600" text-anchor="middle">Turns Information into Action</text>

  <!-- Flow 2: Processor to Output -->
  <path d="M 470 190 L 510 190" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#rec-arrow-emerald)" />

  <!-- Right: OUTPUT -->
  <rect x="515" y="130" width="170" height="120" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.4" />
  <rect x="515" y="130" width="170" height="24" rx="8" fill="rgba(168, 85, 247, 0.12)" />
  <text x="600" y="146" fill="#A855F7" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">OUTPUT</text>
  <text x="600" y="174" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Responds.</text>
  <text x="600" y="196" fill="#CBD5E1" font-size="8" text-anchor="middle">Displays, motors,</text>
  <text x="600" y="210" fill="#CBD5E1" font-size="8" text-anchor="middle">network transmissions</text>
  <rect x="535" y="222" width="130" height="18" rx="3" fill="#0F172A" />
  <text x="600" y="234" fill="#D8B4FE" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">→ Action Accomplished</text>
</svg>
