<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF6868" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle">Data Path WITHOUT DMA: The CPU Middleman</text>

  <!-- Peripheral Box (Left) -->
  <rect x="40" y="80" width="110" height="80" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="95" y="115" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">Peripheral</text>
  <text x="95" y="132" fill="#F59E0B" font-family="monospace" font-size="9" text-anchor="middle">UART / ADC</text>

  <!-- CPU Box (Center) -->
  <rect x="250" y="80" width="140" height="80" rx="4" fill="#1E293B" stroke="#EF6868" stroke-width="2" />
  <text x="320" y="110" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">CPU Core</text>
  <text x="320" y="126" fill="#EF6868" font-size="8" text-anchor="middle">Interrupt overhead</text>
  <text x="320" y="138" fill="#EF6868" font-size="8" text-anchor="middle">+ Relocate byte in code</text>

  <!-- SRAM Box (Right) -->
  <rect x="490" y="80" width="110" height="80" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="545" y="115" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">SRAM</text>
  <text x="545" y="132" fill="#3B82F6" font-family="monospace" font-size="9" text-anchor="middle">RAM Buffer</text>

  <!-- Path Arrows -->
  <!-- 1. IRQ / Read byte -->
  <path d="M 150 110 H 240" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M 150 130 H 242" fill="none" stroke="#EF6868" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="195" y="102" fill="#F59E0B" font-size="7" text-anchor="middle">1. IRQ Alert</text>
  <text x="195" y="142" fill="#EF6868" font-size="7" text-anchor="middle">2. CPU Reads Byte</text>

  <!-- 2. Write byte -->
  <path d="M 390 120 H 482" fill="none" stroke="#EF6868" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="440" y="112" fill="#EF6868" font-size="7" text-anchor="middle">3. CPU Writes Byte</text>

  <!-- CPU Status Annotation -->
  <rect x="230" y="180" width="180" height="30" rx="3" fill="#0F172A" stroke="rgba(239, 104, 104, 0.2)" stroke-width="1" />
  <text x="320" y="198" fill="#EF6868" font-size="8" text-anchor="middle">CPU utilizes cycles simply transferring data.</text>
</svg>
