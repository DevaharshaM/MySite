<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" height="100%" style="background:#171426; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="sfc-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(196, 181, 253, 0.03)" stroke-width="1"/>
    </pattern>
    <marker id="sfc-arrow-gold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FBBF24" />
    </marker>
  </defs>

  <!-- Background and Frame -->
  <rect width="100%" height="100%" fill="url(#sfc-grid)" />
  <rect x="10" y="10" width="700" height="180" fill="none" stroke="rgba(196, 181, 253, 0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#F8FAFC" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.1em">THE SHARED FOUNDATION</text>
  <text x="360" y="47" fill="#C4B5FD" font-size="8" text-anchor="middle">Both systems are built from the exact same fundamental sequence</text>

  <!-- Step 1: Processor Core -->
  <g transform="translate(45, 70)">
    <rect width="180" height="90" rx="8" fill="#221C38" stroke="#A78BFA" stroke-width="1.2" />
    <rect width="180" height="22" rx="8" fill="rgba(167, 139, 250, 0.12)" />
    <circle cx="14" cy="11" r="3" fill="#FBBF24" />
    <text x="90" y="15" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="0.08em">PROCESSOR</text>
    
    <text x="90" y="45" fill="#F8FAFC" font-size="9" font-weight="700" text-anchor="middle">Execution Core</text>
    <text x="90" y="60" fill="#DDD6FE" font-size="7.5" text-anchor="middle">Decodes and directs</text>
    <text x="90" y="74" fill="#A78BFA" font-size="7.2" text-anchor="middle">Hardware state engine</text>
  </g>

  <!-- Arrow 1: Processor -> Instructions -->
  <g transform="translate(230, 115)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#FBBF24" stroke-width="2" marker-end="url(#sfc-arrow-gold)" />
    <text x="22" y="-7" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="6.8" font-weight="600" text-anchor="middle">Reads</text>
  </g>

  <!-- Step 2: Instructions -->
  <g transform="translate(280, 70)">
    <rect width="180" height="90" rx="8" fill="#221C38" stroke="#C4B5FD" stroke-width="1.2" />
    <rect width="180" height="22" rx="8" fill="rgba(196, 181, 253, 0.12)" />
    <circle cx="14" cy="11" r="3" fill="#FBBF24" />
    <text x="90" y="15" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="0.08em">INSTRUCTIONS</text>
    
    <text x="90" y="45" fill="#F8FAFC" font-size="9" font-weight="700" text-anchor="middle">What to Do</text>
    <text x="90" y="60" fill="#DDD6FE" font-size="7.5" text-anchor="middle">Sequences of operations</text>
    <text x="90" y="74" fill="#A78BFA" font-size="7.2" text-anchor="middle">Logic, math, and flow</text>
  </g>

  <!-- Arrow 2: Instructions -> Computation -->
  <g transform="translate(465, 115)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#FBBF24" stroke-width="2" marker-end="url(#sfc-arrow-gold)" />
    <text x="22" y="-7" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="6.8" font-weight="600" text-anchor="middle">Yields</text>
  </g>

  <!-- Step 3: Computation -->
  <g transform="translate(515, 70)">
    <rect width="160" height="90" rx="8" fill="#221C38" stroke="#FBBF24" stroke-width="1.2" />
    <rect width="160" height="22" rx="8" fill="rgba(251, 191, 36, 0.12)" />
    <circle cx="14" cy="11" r="3" fill="#FBBF24" />
    <text x="80" y="15" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="0.08em">COMPUTATION</text>
    
    <text x="80" y="45" fill="#F8FAFC" font-size="9" font-weight="700" text-anchor="middle">The Result</text>
    <text x="80" y="60" fill="#DDD6FE" font-size="7.5" text-anchor="middle">State is updated</text>
    <text x="80" y="74" fill="#FBBF24" font-size="7.2" text-anchor="middle">Action takes place</text>
  </g>
</svg>
