<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="cycle-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="cycle-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="cycle-arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
    <marker id="cycle-arrow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    <marker id="cycle-arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A855F7" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#cycle-grid)" />
  <rect x="10" y="10" width="660" height="240" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="6" />

  <text x="340" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.06em">THE ATOMIC HEARTBEAT: THE INSTRUCTION EXECUTION CYCLE</text>

  <!-- Step 1: FETCH -->
  <rect x="35" y="60" width="135" height="120" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <rect x="35" y="60" width="135" height="26" rx="6" fill="rgba(59, 130, 246, 0.15)" />
  <text x="102" y="77" fill="#3B82F6" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="0.05em">1. FETCH</text>
  <text x="102" y="105" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Read Opcode</text>
  <text x="102" y="122" fill="#94A3B8" font-size="7" text-anchor="middle">Program Counter (PC)</text>
  <text x="102" y="134" fill="#94A3B8" font-size="7" text-anchor="middle">points to next instruction</text>
  <text x="102" y="156" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">IR &lt;= Memory[PC]</text>

  <!-- Flow 1 to 2 -->
  <path d="M 170 120 L 195 120" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#cycle-arrow-blue)" />

  <!-- Step 2: DECODE -->
  <rect x="195" y="60" width="135" height="120" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
  <rect x="195" y="60" width="135" height="26" rx="6" fill="rgba(245, 158, 11, 0.15)" />
  <text x="262" y="77" fill="#F59E0B" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="0.05em">2. DECODE</text>
  <text x="262" y="105" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Translate Meaning</text>
  <text x="262" y="122" fill="#94A3B8" font-size="7" text-anchor="middle">Control Unit interprets bits</text>
  <text x="262" y="134" fill="#94A3B8" font-size="7" text-anchor="middle">Selects operands &amp; path</text>
  <text x="262" y="156" fill="#FCD34D" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Signals Activated</text>

  <!-- Flow 2 to 3 -->
  <path d="M 330 120 L 355 120" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#cycle-arrow-amber)" />

  <!-- Step 3: EXECUTE -->
  <rect x="355" y="60" width="135" height="120" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <rect x="355" y="60" width="135" height="26" rx="6" fill="rgba(16, 185, 129, 0.15)" />
  <text x="422" y="77" fill="#10B981" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="0.05em">3. EXECUTE</text>
  <text x="422" y="105" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Perform Work</text>
  <text x="422" y="122" fill="#94A3B8" font-size="7" text-anchor="middle">ALU computes math/logic</text>
  <text x="422" y="134" fill="#94A3B8" font-size="7" text-anchor="middle">Evaluates branch decisions</text>
  <text x="422" y="156" fill="#6EE7B7" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">ALU_Out = A + B</text>

  <!-- Flow 3 to 4 -->
  <path d="M 490 120 L 515 120" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#cycle-arrow-emerald)" />

  <!-- Step 4: RESULT / WRITEBACK -->
  <rect x="515" y="60" width="135" height="120" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
  <rect x="515" y="60" width="135" height="26" rx="6" fill="rgba(168, 85, 247, 0.15)" />
  <text x="582" y="77" fill="#A855F7" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="0.05em">4. RESULT</text>
  <text x="582" y="105" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Commit State</text>
  <text x="582" y="122" fill="#94A3B8" font-size="7" text-anchor="middle">Update Register / Memory</text>
  <text x="582" y="134" fill="#94A3B8" font-size="7" text-anchor="middle">Update Status Flags (Z, C)</text>
  <text x="582" y="156" fill="#D8B4FE" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">R1 &lt;= Result; PC++</text>

  <!-- Cyclic Return Loop -->
  <path d="M 582 180 V 215 H 102 V 185" fill="none" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#cycle-arrow-blue)" />
  <rect x="260" y="205" width="160" height="20" rx="4" fill="#0F172A" stroke="rgba(148,163,184,0.2)" stroke-width="1" />
  <text x="340" y="218" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">CYCLE ADVANCES ON NEXT CLOCK TICK</text>
</svg>
