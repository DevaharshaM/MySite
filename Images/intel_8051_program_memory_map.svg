<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid-pm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-pm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <linearGradient id="rom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#192338"/>
    </linearGradient>
    <linearGradient id="ext-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#141E33"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-pm)" />
  <rect x="12" y="12" width="736" height="396" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="38" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE 8051 PROGRAM MEMORY MAP (CODE SPACE)</text>
  <text x="380" y="55" fill="#94A3B8" font-size="8.5" text-anchor="middle">16-Bit Address Space (0000H → FFFFH) · Total Addressable Range: 64 KB (65,536 Bytes)</text>

  <!-- ============================================================ -->
  <!-- LEFT: MEMORY MAP STACK COLUMN (x=60, width=280)               -->
  <!-- ============================================================ -->

  <!-- Top Address Label -->
  <g transform="translate(60, 75)">
    <!-- Address Pointer FFFFH -->
    <text x="-12" y="14" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="end">FFFFH</text>
    <line x1="-8" y1="11" x2="0" y2="11" stroke="#64748B" stroke-width="1" />

    <!-- External Program Memory Region (60 KB) -->
    <rect x="0" y="10" width="280" height="150" rx="4" fill="url(#ext-grad)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#shadow-pm)" />
    
    <text x="140" y="52" fill="#C4B5FD" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">EXTERNAL PROGRAM MEMORY</text>
    <text x="140" y="72" fill="#A78BFA" font-size="8.5" font-weight="600" text-anchor="middle">60 KB Architectural Address Space</text>
    <text x="140" y="92" fill="#94A3B8" font-size="8" text-anchor="middle">Address Range: 1000H → FFFFH</text>
    <text x="140" y="112" fill="#64748B" font-size="7.5" text-anchor="middle">(External ROM/EPROM or expanded flash in modern derivatives)</text>
    <text x="140" y="132" fill="#818CF8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Accessed when PC &gt; 0FFFH or /EA = 0</text>

    <!-- Address Boundary 1000H / 0FFFH -->
    <text x="-12" y="164" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="end">1000H</text>
    <line x1="-8" y1="160" x2="280" y2="160" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1" stroke-dasharray="2,2" />
    <text x="-12" y="174" fill="#A78BFA" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" text-anchor="end">0FFFH</text>

    <!-- Internal On-Chip ROM Region (4 KB) -->
    <rect x="0" y="170" width="280" height="120" rx="4" fill="url(#rom-grad)" stroke="#A78BFA" stroke-width="1.5" filter="url(#shadow-pm)" />
    
    <!-- Vector highlight inside internal ROM -->
    <rect x="10" y="180" width="260" height="26" rx="3" fill="rgba(167, 139, 250, 0.12)" stroke="rgba(167, 139, 250, 0.3)" />
    <text x="140" y="196" fill="#DDD6FE" font-size="8" font-weight="600" text-anchor="middle">Reset Vector &amp; Interrupt Vector Table</text>

    <text x="140" y="228" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">INTERNAL ON-CHIP ROM</text>
    <text x="140" y="246" fill="#C4B5FD" font-size="8.5" font-weight="600" text-anchor="middle">4 KB (Classic 8051)</text>
    <text x="140" y="264" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Address Range: 0000H → 0FFFH</text>

    <!-- Bottom Address Label 0000H -->
    <text x="-12" y="294" fill="#A78BFA" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" text-anchor="end">0000H</text>
    <line x1="-8" y1="290" x2="0" y2="290" stroke="#A78BFA" stroke-width="1.5" />
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT: ARCHITECTURAL PRINCIPLES & CALLOUTS (x=380, width=320) -->
  <!-- ============================================================ -->

  <g transform="translate(385, 75)">
    <!-- Box 1: 16-Bit Addressing -->
    <rect x="0" y="10" width="315" height="74" rx="6" fill="#1E293B" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" filter="url(#shadow-pm)" />
    <circle cx="16" cy="26" r="4" fill="#38BDF8" />
    <text x="28" y="29" fill="#38BDF8" font-size="9" font-weight="700">16-BIT PROGRAM COUNTER (PC)</text>
    <text x="16" y="48" fill="#E2E8F0" font-size="8" line-height="1.4">The CPU addresses code using a 16-bit register.</text>
    <text x="16" y="64" fill="#94A3B8" font-size="7.5">2¹⁶ = 65,536 distinct byte locations (0000H to FFFFH).</text>
    <text x="16" y="76" fill="#64748B" font-size="7">Instructions are fetched sequentially unless a branch occurs.</text>

    <!-- Box 2: Address Space vs Physical Memory -->
    <rect x="0" y="96" width="315" height="98" rx="6" fill="#1E293B" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" filter="url(#shadow-pm)" />
    <circle cx="16" cy="112" r="4" fill="#F59E0B" />
    <text x="28" y="115" fill="#FBBF24" font-size="9" font-weight="700">SPACE ≠ PHYSICALLY IMPLEMENTED</text>
    <text x="16" y="134" fill="#E2E8F0" font-size="8" font-weight="600">The classic 8051 does NOT contain 64 KB ROM.</text>
    <text x="16" y="150" fill="#CBD5E1" font-size="7.5">It physically integrates exactly 4 KB of internal ROM.</text>
    <text x="16" y="165" fill="#94A3B8" font-size="7.5">The remaining 60 KB is the architectural expansion</text>
    <text x="16" y="180" fill="#94A3B8" font-size="7.5">space reserved for external program memory.</text>

    <!-- Box 3: Modern Derivatives -->
    <rect x="0" y="206" width="315" height="84" rx="6" fill="#1E293B" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" filter="url(#shadow-pm)" />
    <circle cx="16" cy="222" r="4" fill="#34D399" />
    <text x="28" y="225" fill="#6EE7B7" font-size="9" font-weight="700">MODERN 8051 DERIVATIVES</text>
    <text x="16" y="244" fill="#E2E8F0" font-size="8">Later chips expanded the on-chip program capacity:</text>
    <text x="16" y="260" fill="#94A3B8" font-size="7.5">• AT89C51: 4 KB Flash · AT89C52: 8 KB Flash</text>
    <text x="16" y="274" fill="#94A3B8" font-size="7.5">• DS89C450: 64 KB on-chip Flash filling the entire map</text>
  </g>

  <!-- Bottom banner -->
  <rect x="60" y="380" width="640" height="20" rx="4" fill="rgba(148, 163, 184, 0.05)" />
  <text x="380" y="394" fill="#64748B" font-size="7.5" text-anchor="middle">Program Memory is strictly read-only during normal execution · Accessed via Code Bus using Program Counter (PC)</text>
</svg>
