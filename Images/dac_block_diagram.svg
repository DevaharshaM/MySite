<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Outer Border -->
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />
  
  <!-- Digital Register Box -->
  <rect x="40" y="80" width="110" height="80" rx="4" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
  <text x="95" y="105" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">Digital Register</text>
  <text x="95" y="125" fill="#10B981" font-family="monospace" font-size="9" text-anchor="middle">1011 0010 1101</text>
  <text x="95" y="142" fill="#64748B" font-size="8" text-anchor="middle">12-bit Input Code</text>
  
  <!-- Data Bus Arrows -->
  <path d="M 150 120 H 200" fill="none" stroke="#3B82F6" stroke-width="2" />
  <path d="M 195 115 L 200 120 L 195 125" fill="none" stroke="#3B82F6" stroke-width="2" />
  <text x="175" y="110" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle">Parallel Bus</text>

  <!-- Switch Matrix and Ladder Box -->
  <rect x="200" y="60" width="160" height="120" rx="4" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
  <text x="280" y="85" fill="#FFF" font-weight="bold" font-size="10" text-anchor="middle">R-2R Switch Matrix</text>
  
  <!-- Resistor symbols/schematic representation -->
  <path d="M 230 140 H 250 L 253 135 L 257 145 L 261 135 L 265 145 L 269 135 L 273 145 L 276 140 H 330" fill="none" stroke="#64748B" stroke-width="1" />
  <circle cx="230" cy="140" r="2.5" fill="#64748B" />
  <path d="M 240 140 V 155 M 240 165 V 180" fill="none" stroke="#EF6868" stroke-width="1" />
  <!-- Switch indicator -->
  <path d="M 240 155 L 246 164" fill="none" stroke="#EF6868" stroke-width="1.5" />
  
  <!-- VREF input -->
  <path d="M 280 25 V 60" fill="none" stroke="#F59E0B" stroke-width="1.5" />
  <path d="M 276 25 H 284 M 278 21 H 282" fill="none" stroke="#F59E0B" stroke-width="1.5" />
  <text x="280" y="15" fill="#F59E0B" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">VREF (3.3V)</text>
  
  <!-- Output from Ladder to Op-Amp -->
  <path d="M 360 120 H 420" fill="none" stroke="#3B82F6" stroke-width="1.5" />
  <path d="M 415 115 L 420 120 L 415 125" fill="none" stroke="#3B82F6" stroke-width="1.5" />
  <text x="390" y="110" fill="#3B82F6" font-size="8" text-anchor="middle">Scaled I/V</text>

  <!-- Op-Amp Triangle -->
  <path d="M 420 95 V 145 L 460 120 Z" fill="#1E293B" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
  <text x="432" y="113" fill="#64748B" font-size="9">+</text>
  <text x="432" y="131" fill="#64748B" font-size="9">-</text>
  <text x="444" y="123" fill="#FFF" font-size="8" text-anchor="middle">Buffer</text>
  
  <!-- Feedback loop -->
  <path d="M 430 132.5 V 160 H 475 V 120 H 460" fill="none" stroke="#64748B" stroke-width="1" />
  
  <!-- Output Pin -->
  <path d="M 460 120 H 530" fill="none" stroke="#10B981" stroke-width="2" />
  <circle cx="530" cy="120" r="3" fill="#10B981" />
  <text x="540" y="123" fill="#10B981" font-weight="bold" font-size="10">VOUT</text>
  <text x="540" y="138" fill="#64748B" font-size="8">2.302 V</text>
  
  <!-- Equation -->
  <text x="320" y="210" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">VOUT = VREF * (Code / (2^N - 1))</text>
</svg>
