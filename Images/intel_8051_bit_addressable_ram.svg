<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid-bar" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-bar" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-bar)" />
  <rect x="12" y="12" width="736" height="386" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="38" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE 8051 BIT-ADDRESSABLE RAM (20H → 2FH)</text>
  <text x="380" y="55" fill="#94A3B8" font-size="8.5" text-anchor="middle">16 Bytes of Internal RAM Mapped to 128 Individually Addressable Bit Flip-Flops (00H → 7FH)</text>

  <!-- ============================================================ -->
  <!-- LEFT: BIT GRID BREAKDOWN (x=35, width=440)                    -->
  <!-- ============================================================ -->
  <g transform="translate(35, 75)" filter="url(#shadow-bar)">
    <rect width="440" height="285" rx="6" fill="#131B2A" stroke="#38BDF8" stroke-width="1.2" />
    <rect width="440" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)" />
    <circle cx="15" cy="13" r="3.5" fill="#38BDF8" />
    <text x="220" y="17" fill="#7DD3FC" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">BYTE ADDRESSES &amp; CORRESPONDING BIT ADDRESSES</text>

    <!-- Bit Column Headers (b7 -> b0) -->
    <g transform="translate(100, 36)">
      <text x="18" y="10" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">b7</text>
      <text x="56" y="10" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">b6</text>
      <text x="94" y="10" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">b5</text>
      <text x="132" y="10" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">b4</text>
      <text x="170" y="10" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">b3</text>
      <text x="208" y="10" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">b2</text>
      <text x="246" y="10" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">b1</text>
      <text x="284" y="10" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">b0</text>
    </g>

    <!-- Row 1: Byte 20H -->
    <g transform="translate(15, 52)">
      <!-- Byte Label -->
      <rect x="0" y="0" width="75" height="34" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" />
      <text x="37" y="16" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">20H</text>
      <text x="37" y="27" fill="#64748B" font-size="6" text-anchor="middle">Byte Addr</text>

      <!-- 8 bits for 20H (07H down to 00H) -->
      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="17" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">07H</text>

        <rect x="38" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="55" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">06H</text>

        <rect x="76" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="93" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">05H</text>

        <rect x="114" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="131" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">04H</text>

        <rect x="152" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="169" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">03H</text>

        <rect x="190" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="207" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">02H</text>

        <rect x="228" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="245" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">01H</text>

        <rect x="266" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="283" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">00H</text>

        <rect x="306" y="0" width="22" height="34" rx="3" fill="rgba(56, 189, 248, 0.1)" />
        <text x="317" y="20" fill="#38BDF8" font-size="6" text-anchor="middle">8b</text>
      </g>
    </g>

    <!-- Row 2: Byte 21H -->
    <g transform="translate(15, 92)">
      <rect x="0" y="0" width="75" height="34" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" />
      <text x="37" y="16" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">21H</text>
      <text x="37" y="27" fill="#64748B" font-size="6" text-anchor="middle">Byte Addr</text>

      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="17" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">0FH</text>

        <rect x="38" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="55" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">0EH</text>

        <rect x="76" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="93" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">0DH</text>

        <rect x="114" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="131" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">0CH</text>

        <rect x="152" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="169" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">0BH</text>

        <rect x="190" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="207" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">0AH</text>

        <rect x="228" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="245" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">09H</text>

        <rect x="266" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="283" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">08H</text>

        <rect x="306" y="0" width="22" height="34" rx="3" fill="rgba(56, 189, 248, 0.1)" />
        <text x="317" y="20" fill="#38BDF8" font-size="6" text-anchor="middle">8b</text>
      </g>
    </g>

    <!-- Ellipsis Row -->
    <g transform="translate(15, 134)">
      <text x="37" y="16" fill="#64748B" font-size="10" text-anchor="middle">· · ·</text>
      <text x="250" y="16" fill="#64748B" font-size="9" text-anchor="middle">Bytes 22H through 2EH (Bit addresses 10H through 77H)</text>
    </g>

    <!-- Row Final: Byte 2FH -->
    <g transform="translate(15, 154)">
      <rect x="0" y="0" width="75" height="34" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" />
      <text x="37" y="16" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">2FH</text>
      <text x="37" y="27" fill="#64748B" font-size="6" text-anchor="middle">Byte Addr</text>

      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="17" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">7FH</text>

        <rect x="38" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="55" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">7EH</text>

        <rect x="76" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="93" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">7DH</text>

        <rect x="114" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="131" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">7CH</text>

        <rect x="152" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="169" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">7BH</text>

        <rect x="190" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="207" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">7AH</text>

        <rect x="228" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="245" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">79H</text>

        <rect x="266" y="0" width="35" height="34" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="283" y="21" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">78H</text>

        <rect x="306" y="0" width="22" height="34" rx="3" fill="rgba(56, 189, 248, 0.1)" />
        <text x="317" y="20" fill="#38BDF8" font-size="6" text-anchor="middle">8b</text>
      </g>
    </g>

    <!-- Summary strip inside left box -->
    <g transform="translate(15, 204)">
      <rect width="410" height="66" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.15)" />
      <text x="15" y="20" fill="#7DD3FC" font-size="8" font-weight="700">DUAL NATURE OF 20H–2FH:</text>
      <text x="15" y="36" fill="#CBD5E1" font-size="7.5">• Accessible as standard 8-bit bytes: MOV 20H, #0AAH</text>
      <text x="15" y="52" fill="#CBD5E1" font-size="7.5">• Simultaneously accessible as 128 individual bits: SETB 05H</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT: PRACTICAL POWER & CONTROL USAGE (x=495, width=230)     -->
  <!-- ============================================================ -->
  <g transform="translate(495, 75)" filter="url(#shadow-bar)">
    <rect width="230" height="285" rx="6" fill="#131B2A" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" />
    <rect width="230" height="26" rx="6" fill="rgba(52, 211, 153, 0.15)" />
    <circle cx="15" cy="13" r="3.5" fill="#34D399" />
    <text x="115" y="17" fill="#6EE7B7" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">WHY BIT ADDRESSING MATTERS</text>

    <!-- Box 1: No Masking Needed -->
    <g transform="translate(12, 36)">
      <rect width="206" height="74" rx="4" fill="#1E293B" stroke="rgba(52, 211, 153, 0.25)" />
      <text x="12" y="18" fill="#34D399" font-size="8" font-weight="700">NO SOFTWARE MASKING</text>
      <text x="12" y="34" fill="#CBD5E1" font-size="7.2">Traditional microprocessors need:</text>
      <text x="12" y="48" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7">Read → Mask (AND/OR) → Write</text>
      <text x="12" y="62" fill="#E2E8F0" font-size="7.2">The 8051 sets or clears bits in 1 opcode!</text>
    </g>

    <!-- Box 2: Flags & Boolean Logic -->
    <g transform="translate(12, 118)">
      <rect width="206" height="74" rx="4" fill="#1E293B" stroke="rgba(167, 139, 250, 0.25)" />
      <text x="12" y="18" fill="#C4B5FD" font-size="8" font-weight="700">DEDICATED BOOLEAN PROCESSOR</text>
      <text x="12" y="34" fill="#CBD5E1" font-size="7.2">The 8051 treats the Carry flag (CY)</text>
      <text x="12" y="48" fill="#CBD5E1" font-size="7.2">as a 1-bit accumulator. It can AND,</text>
      <text x="12" y="62" fill="#CBD5E1" font-size="7.2">OR, or invert any bit in this range.</text>
    </g>

    <!-- Box 3: Applications -->
    <g transform="translate(12, 200)">
      <rect width="206" height="72" rx="4" fill="#1E293B" stroke="rgba(245, 158, 11, 0.25)" />
      <text x="12" y="18" fill="#FBBF24" font-size="8" font-weight="700">IDEAL APPLICATIONS</text>
      <text x="12" y="34" fill="#94A3B8" font-size="7.2">• Motor running / stopped flags</text>
      <text x="12" y="48" fill="#94A3B8" font-size="7.2">• Sensor trip alerts</text>
      <text x="12" y="62" fill="#94A3B8" font-size="7.2">• Communication timeout state</text>
    </g>
  </g>

  <!-- Bottom banner -->
  <rect x="35" y="372" width="690" height="20" rx="4" fill="rgba(148, 163, 184, 0.05)" />
  <text x="380" y="386" fill="#64748B" font-size="7.5" text-anchor="middle">Bit addressing gives the 8051 true boolean computation capabilities without wasting full bytes of precious RAM</text>
</svg>
