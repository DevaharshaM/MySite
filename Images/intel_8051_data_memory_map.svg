<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid-dm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-dm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-dm)" />
  <rect x="12" y="12" width="736" height="426" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="38" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE 8051 INTERNAL DATA MEMORY MAP</text>
  <text x="380" y="55" fill="#94A3B8" font-size="8.5" text-anchor="middle">8-Bit Address Space (00H → FFH) · 256 Total Addresses Divided Into Distinct Functional Regions</text>

  <!-- ============================================================ -->
  <!-- LEFT COLUMN: LOWER 128 BYTES (00H - 7FH) PHYSICAL RAM       -->
  <!-- ============================================================ -->
  <g transform="translate(45, 75)" filter="url(#shadow-dm)">
    <rect width="320" height="325" rx="6" fill="#131B2A" stroke="#34D399" stroke-width="1.2" />
    <rect width="320" height="26" rx="6" fill="rgba(52, 211, 153, 0.15)" />
    <circle cx="15" cy="13" r="3.5" fill="#34D399" />
    <text x="160" y="17" fill="#6EE7B7" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">INTERNAL RAM · 128 BYTES (00H → 7FH)</text>

    <!-- General Purpose RAM (30H - 7FH) -->
    <g transform="translate(15, 38)">
      <rect width="290" height="92" rx="4" fill="#1E293B" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
      <text x="15" y="24" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700">GENERAL-PURPOSE RAM</text>
      <text x="15" y="42" fill="#6EE7B7" font-family="'IBM Plex Mono', monospace" font-size="8">30H → 7FH (80 Bytes)</text>
      <text x="15" y="60" fill="#CBD5E1" font-size="7.5">Scratchpad memory for runtime variables,</text>
      <text x="15" y="74" fill="#CBD5E1" font-size="7.5">buffers, arithmetic working data, and Stack.</text>
      <text x="275" y="24" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="end">7FH</text>
      <text x="275" y="80" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="end">30H</text>
    </g>

    <!-- Bit-Addressable RAM (20H - 2FH) -->
    <g transform="translate(15, 138)">
      <rect width="290" height="64" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <text x="15" y="22" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700">BIT-ADDRESSABLE RAM</text>
      <text x="15" y="38" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="8">20H → 2FH (16 Bytes = 128 Bits)</text>
      <text x="15" y="52" fill="#CBD5E1" font-size="7.5">Each of the 128 bits is individually addressable.</text>
      <text x="275" y="22" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="end">2FH</text>
      <text x="275" y="54" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="end">20H</text>
    </g>

    <!-- Register Banks (00H - 1FH) -->
    <g transform="translate(15, 210)">
      <rect width="290" height="100" rx="4" fill="#1E293B" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1" />
      <text x="15" y="20" fill="#C4B5FD" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700">FOUR REGISTER BANKS (R0–R7)</text>
      <text x="15" y="35" fill="#A78BFA" font-family="'IBM Plex Mono', monospace" font-size="8">00H → 1FH (32 Bytes Total)</text>

      <g transform="translate(15, 44)">
        <rect x="0" y="0" width="60" height="42" rx="3" fill="rgba(167, 139, 250, 0.1)" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="30" y="16" fill="#DDD6FE" font-size="7.5" font-weight="700" text-anchor="middle">BANK 0</text>
        <text x="30" y="32" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="6.8" text-anchor="middle">00H-07H</text>

        <rect x="68" y="0" width="60" height="42" rx="3" fill="rgba(167, 139, 250, 0.1)" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="98" y="16" fill="#DDD6FE" font-size="7.5" font-weight="700" text-anchor="middle">BANK 1</text>
        <text x="98" y="32" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="6.8" text-anchor="middle">08H-0FH</text>

        <rect x="136" y="0" width="60" height="42" rx="3" fill="rgba(167, 139, 250, 0.1)" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="166" y="16" fill="#DDD6FE" font-size="7.5" font-weight="700" text-anchor="middle">BANK 2</text>
        <text x="166" y="32" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="6.8" text-anchor="middle">10H-17H</text>

        <rect x="204" y="0" width="60" height="42" rx="3" fill="rgba(167, 139, 250, 0.1)" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="234" y="16" fill="#DDD6FE" font-size="7.5" font-weight="700" text-anchor="middle">BANK 3</text>
        <text x="234" y="32" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="6.8" text-anchor="middle">18H-1FH</text>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT COLUMN: UPPER 128 BYTES (80H - FFH) SFR ADDRESS SPACE -->
  <!-- ============================================================ -->
  <g transform="translate(395, 75)" filter="url(#shadow-dm)">
    <rect width="320" height="325" rx="6" fill="#131B2A" stroke="#F59E0B" stroke-width="1.2" />
    <rect width="320" height="26" rx="6" fill="rgba(245, 158, 11, 0.15)" />
    <circle cx="15" cy="13" r="3.5" fill="#F59E0B" />
    <text x="160" y="17" fill="#FBBF24" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">SFR ADDRESS SPACE · 128 BYTES (80H → FFH)</text>

    <!-- Content info inside SFR space -->
    <g transform="translate(15, 38)">
      <rect width="290" height="52" rx="4" fill="#1E293B" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
      <text x="15" y="20" fill="#FDE68A" font-size="8" font-weight="700">NOT ORDINARY DATA STORAGE</text>
      <text x="15" y="36" fill="#CBD5E1" font-size="7.5">Addresses in this range map directly to CPU registers</text>
      <text x="15" y="48" fill="#CBD5E1" font-size="7.5">and peripheral control latches.</text>
    </g>

    <!-- Representative SFR Blocks -->
    <g transform="translate(15, 100)">
      <rect width="290" height="210" rx="4" fill="#0B1120" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />
      
      <!-- Row 1: CPU Registers -->
      <g transform="translate(10, 12)">
        <text x="0" y="10" fill="#94A3B8" font-size="7" font-weight="700">CPU REGISTERS</text>
        <rect x="0" y="16" width="62" height="30" rx="3" fill="#1E293B" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="31" y="30" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">ACC (E0H)</text>
        <text x="31" y="41" fill="#94A3B8" font-size="6.5" text-anchor="middle">Accumulator</text>

        <rect x="68" y="16" width="62" height="30" rx="3" fill="#1E293B" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="99" y="30" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">B (F0H)</text>
        <text x="99" y="41" fill="#94A3B8" font-size="6.5" text-anchor="middle">Math Reg</text>

        <rect x="136" y="16" width="66" height="30" rx="3" fill="#1E293B" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="169" y="30" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">PSW (D0H)</text>
        <text x="169" y="41" fill="#94A3B8" font-size="6.5" text-anchor="middle">Status Flags</text>

        <rect x="208" y="16" width="62" height="30" rx="3" fill="#1E293B" stroke="rgba(245, 158, 11, 0.3)" />
        <text x="239" y="30" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">SP (81H)</text>
        <text x="239" y="41" fill="#94A3B8" font-size="6.5" text-anchor="middle">Stack Pointer</text>
      </g>

      <!-- Row 2: I/O Ports -->
      <g transform="translate(10, 75)">
        <text x="0" y="10" fill="#94A3B8" font-size="7" font-weight="700">PARALLEL I/O PORTS</text>
        <rect x="0" y="16" width="62" height="26" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="31" y="32" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">P0 (80H)</text>

        <rect x="68" y="16" width="62" height="26" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="99" y="32" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">P1 (90H)</text>

        <rect x="136" y="16" width="66" height="26" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="169" y="32" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">P2 (A0H)</text>

        <rect x="208" y="16" width="62" height="26" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="239" y="32" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">P3 (B0H)</text>
      </g>

      <!-- Row 3: Timers & Serial & Control -->
      <g transform="translate(10, 134)">
        <text x="0" y="10" fill="#94A3B8" font-size="7" font-weight="700">TIMERS, SERIAL &amp; CONTROL</text>
        <rect x="0" y="16" width="62" height="26" rx="3" fill="#1E293B" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="31" y="32" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">TCON (88H)</text>

        <rect x="68" y="16" width="62" height="26" rx="3" fill="#1E293B" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="99" y="32" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">TMOD (89H)</text>

        <rect x="136" y="16" width="66" height="26" rx="3" fill="#1E293B" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="169" y="32" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">SCON (98H)</text>

        <rect x="208" y="16" width="62" height="26" rx="3" fill="#1E293B" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="239" y="32" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">IE (A8H)</text>
      </g>

      <!-- Note on gaps -->
      <text x="145" y="196" fill="#64748B" font-size="7" text-anchor="middle">Classic 8051 implements 21 SFRs · Unused address slots are reserved</text>
    </g>
  </g>

  <!-- Bottom banner -->
  <rect x="45" y="410" width="670" height="20" rx="4" fill="rgba(148, 163, 184, 0.05)" />
  <text x="380" y="424" fill="#94A3B8" font-size="7.5" text-anchor="middle">00H–7FH is true memory (flip-flops holding state) · 80H–FFH is the control interface to chip hardware</text>
</svg>
