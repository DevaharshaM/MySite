<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="sda-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="sda-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8" />
    </marker>
    <marker id="sda-arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399" />
    </marker>
  </defs>

  <!-- Background and Frame -->
  <rect width="100%" height="100%" fill="url(#sda-grid)" />
  <rect x="12" y="12" width="736" height="256" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="380" y="34" fill="#E2E8F0" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.08em">SENSE · DECIDE · ACT</text>
  <text x="380" y="49" fill="#94A3B8" font-size="8" text-anchor="middle">How a microcontroller connects physical inputs to physical actions</text>

  <!-- Left Column: SENSE (Physical Inputs) -->
  <g transform="translate(36, 68)">
    <rect width="180" height="180" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
    <rect width="180" height="26" rx="8" fill="rgba(56, 189, 248, 0.12)" />
    <circle cx="16" cy="13" r="3" fill="#38BDF8" />
    <text x="90" y="17" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">1. SENSE (INPUTS)</text>

    <!-- Sensor Items -->
    <rect x="12" y="36" width="156" height="38" rx="5" fill="#0F172A" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <text x="90" y="52" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Physical Conditions</text>
    <text x="90" y="66" fill="#94A3B8" font-size="7.5" text-anchor="middle">Temperature · pressure · light</text>

    <rect x="12" y="82" width="156" height="38" rx="5" fill="#0F172A" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <text x="90" y="98" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">User &amp; State Triggers</text>
    <text x="90" y="112" fill="#94A3B8" font-size="7.5" text-anchor="middle">Buttons · switches · touch</text>

    <rect x="12" y="128" width="156" height="38" rx="5" fill="#0F172A" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <text x="90" y="144" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Motion &amp; Position</text>
    <text x="90" y="158" fill="#94A3B8" font-size="7.5" text-anchor="middle">Encoders · accelerometers</text>
  </g>

  <!-- Flow Arrow Left to Center -->
  <g transform="translate(222, 148)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#sda-arrow-blue)" />
    <text x="26" y="-8" fill="#38BDF8" font-size="7" font-family="'IBM Plex Mono', monospace" font-weight="600" text-anchor="middle">Signals In</text>
  </g>

  <!-- Center Column: DECIDE (Microcontroller) -->
  <g transform="translate(280, 68)">
    <!-- Chip Body -->
    <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="2" />
    <rect width="200" height="26" rx="8" fill="rgba(129, 140, 248, 0.15)" />
    <circle cx="16" cy="13" r="3" fill="#818CF8" />
    <text x="100" y="17" fill="#A5B4FC" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.06em">2. DECIDE (MICROCONTROLLER)</text>

    <!-- Chip Pins on left -->
    <rect x="-6" y="45" width="6" height="6" fill="#818CF8" rx="1" />
    <rect x="-6" y="70" width="6" height="6" fill="#818CF8" rx="1" />
    <rect x="-6" y="95" width="6" height="6" fill="#818CF8" rx="1" />
    <rect x="-6" y="120" width="6" height="6" fill="#818CF8" rx="1" />
    <rect x="-6" y="145" width="6" height="6" fill="#818CF8" rx="1" />

    <!-- Chip Pins on right -->
    <rect x="200" y="45" width="6" height="6" fill="#34D399" rx="1" />
    <rect x="200" y="70" width="6" height="6" fill="#34D399" rx="1" />
    <rect x="200" y="95" width="6" height="6" fill="#34D399" rx="1" />
    <rect x="200" y="120" width="6" height="6" fill="#34D399" rx="1" />
    <rect x="200" y="145" width="6" height="6" fill="#34D399" rx="1" />

    <!-- Inner Core Logic Box -->
    <rect x="14" y="36" width="172" height="130" rx="6" fill="#0F172A" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1" />
    
    <text x="100" y="58" fill="#E2E8F0" font-size="8.5" font-weight="700" text-anchor="middle">The Machine's Mind</text>
    <text x="100" y="74" fill="#94A3B8" font-size="7.5" text-anchor="middle">Reads incoming signals</text>
    <text x="100" y="88" fill="#94A3B8" font-size="7.5" text-anchor="middle">Runs embedded program</text>
    <text x="100" y="102" fill="#94A3B8" font-size="7.5" text-anchor="middle">Applies timing &amp; control rules</text>

    <!-- Sub-chip badge -->
    <rect x="24" y="118" width="152" height="34" rx="4" fill="rgba(129, 140, 248, 0.1)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="0.8" />
    <text x="100" y="132" fill="#C7D2FE" font-size="7.5" font-weight="700" text-anchor="middle">COMPACT EMBEDDED SYSTEM</text>
    <text x="100" y="144" fill="#818CF8" font-family="'IBM Plex Mono', monospace" font-size="6.8" text-anchor="middle">Processor + Memory + I/O</text>
  </g>

  <!-- Flow Arrow Center to Right -->
  <g transform="translate(486, 148)">
    <line x1="0" y1="0" x2="52" y2="0" stroke="#34D399" stroke-width="2" marker-end="url(#sda-arrow-green)" />
    <text x="26" y="-8" fill="#34D399" font-size="7" font-family="'IBM Plex Mono', monospace" font-weight="600" text-anchor="middle">Signals Out</text>
  </g>

  <!-- Right Column: ACT (Physical Outputs) -->
  <g transform="translate(544, 68)">
    <rect width="180" height="180" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
    <rect width="180" height="26" rx="8" fill="rgba(16, 185, 129, 0.12)" />
    <circle cx="16" cy="13" r="3" fill="#10B981" />
    <text x="90" y="17" fill="#34D399" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">3. ACT (OUTPUTS)</text>

    <!-- Actuator Items -->
    <rect x="12" y="36" width="156" height="38" rx="5" fill="#0F172A" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
    <text x="90" y="52" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Motion &amp; Drives</text>
    <text x="90" y="66" fill="#94A3B8" font-size="7.5" text-anchor="middle">Electric motors · servos · steppers</text>

    <rect x="12" y="82" width="156" height="38" rx="5" fill="#0F172A" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
    <text x="90" y="98" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Visual Feedback</text>
    <text x="90" y="112" fill="#94A3B8" font-size="7.5" text-anchor="middle">Displays · status LEDs · indicators</text>

    <rect x="12" y="128" width="156" height="38" rx="5" fill="#0F172A" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
    <text x="90" y="144" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Physical Control</text>
    <text x="90" y="158" fill="#94A3B8" font-size="7.5" text-anchor="middle">Relays · valves · heating elements</text>
  </g>
</svg>
