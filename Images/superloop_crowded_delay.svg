<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">THE TIMING BLOCK WALL IN A BARE METAL LOOP</text>

  <!-- Timeline Axis -->
  <line x1="40" y1="180" x2="580" y2="180" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" />
  <path d="M 575 175 L 580 180 L 575 185" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="2" />
  <text x="580" y="200" fill="#64748B" font-size="8" text-anchor="end">Time &#8594;</text>

  <!-- Clean Quick Tasks (X=40 to 140) -->
  <rect x="40" y="80" width="40" height="80" fill="rgba(59, 130, 246, 0.3)" stroke="#3B82F6" stroke-width="1" />
  <text x="60" y="125" fill="#3B82F6" font-size="7" font-weight="bold" text-anchor="middle" transform="rotate(-90 60 125)">Button (2us)</text>

  <rect x="80" y="80" width="40" height="80" fill="rgba(16, 185, 129, 0.3)" stroke="#10B981" stroke-width="1" />
  <text x="100" y="125" fill="#10B981" font-size="7" font-weight="bold" text-anchor="middle" transform="rotate(-90 100 125)">ADC Read (5us)</text>

  <rect x="120" y="80" width="40" height="80" fill="rgba(245, 158, 11, 0.3)" stroke="#F59E0B" stroke-width="1" />
  <text x="140" y="125" fill="#F59E0B" font-size="7" font-weight="bold" text-anchor="middle" transform="rotate(-90 140 125)">Motor (2us)</text>

  <!-- The Blocking Wall Task (X=160 to 440) -->
  <rect x="160" y="60" width="280" height="100" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="1.5" />
  <text x="300" y="105" fill="#EF4444" font-weight="bold" font-size="10" text-anchor="middle">BLOCKING TASK (10ms Delay)</text>
  <text x="300" y="120" fill="#EF4444" font-size="7" text-anchor="middle">Waiting for UART Tx Buffer or Slow Temp Sensor</text>
  <text x="300" y="135" fill="#64748B" font-size="7" text-anchor="middle">(CPU spins in a while() loop doing nothing)</text>

  <!-- Delayed Tasks (X=450 onwards) -->
  <rect x="450" y="80" width="40" height="80" fill="rgba(59, 130, 246, 0.3)" stroke="#3B82F6" stroke-dasharray="2,2" stroke-width="1" />
  <text x="470" y="125" fill="#EF4444" font-size="7" font-weight="bold" text-anchor="middle" transform="rotate(-90 470 125)">DELAYED</text>
  
  <rect x="490" y="80" width="40" height="80" fill="rgba(16, 185, 129, 0.3)" stroke="#10B981" stroke-dasharray="2,2" stroke-width="1" />
  <text x="510" y="125" fill="#EF4444" font-size="7" font-weight="bold" text-anchor="middle" transform="rotate(-90 510 125)">DELAYED</text>

  <!-- Missed Event Marker -->
  <circle cx="280" cy="195" r="4" fill="#EF4444" />
  <line x1="280" y1="195" x2="280" y2="165" stroke="#EF4444" stroke-dasharray="2,2" stroke-width="1.5" />
  <text x="280" y="212" fill="#EF4444" font-size="7" font-weight="bold" text-anchor="middle">Missed Button Press!</text>
</svg>
