<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle">Anatomy of a DMA Transfer Cycle</text>

  <!-- Step 1: Peripheral Request -->
  <rect x="30" y="90" width="120" height="60" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="90" y="115" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">1. Request</text>
  <text x="90" y="130" fill="#64748B" font-size="8" text-anchor="middle">Peripheral alerts DMA:</text>
  <text x="90" y="140" fill="#F59E0B" font-family="monospace" font-size="8" text-anchor="middle">"Data Byte Ready!"</text>

  <path d="M 150 120 H 175" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#flow-arrow)" />

  <!-- Step 2: Bus Arbitration -->
  <rect x="180" y="90" width="120" height="60" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="240" y="115" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">2. Bus Grant</text>
  <text x="240" y="130" fill="#64748B" font-size="8" text-anchor="middle">DMA takes bus control</text>
  <text x="240" y="140" fill="#3B82F6" font-size="8" text-anchor="middle">CPU halts for 1 cycle</text>

  <path d="M 300 120 H 325" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#flow-arrow)" />

  <!-- Step 3: Direct Transfer -->
  <rect x="330" y="90" width="120" height="60" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
  <text x="390" y="115" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">3. Memory Write</text>
  <text x="390" y="130" fill="#64748B" font-size="8" text-anchor="middle">DMA writes to RAM,</text>
  <text x="390" y="140" fill="#10B981" font-size="8" text-anchor="middle">ptr++, counter--</text>

  <path d="M 450 120 H 475" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#flow-arrow)" />

  <!-- Step 4: Completion & Interrupt -->
  <rect x="480" y="90" width="130" height="60" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <text x="545" y="115" fill="#10B981" font-weight="bold" font-size="9" text-anchor="middle">4. Block Complete</text>
  <text x="545" y="130" fill="#64748B" font-size="8" text-anchor="middle">Counter = 0. DMA alerts</text>
  <text x="545" y="140" fill="#10B981" font-size="8" text-anchor="middle">CPU with one interrupt</text>

  <!-- Explanation -->
  <text x="320" y="185" fill="#64748B" font-size="9" text-anchor="middle">Efficiency gains: CPU is only interrupted once at the end of a block (e.g. 512 bytes), rather than 512 times.</text>
</svg>
