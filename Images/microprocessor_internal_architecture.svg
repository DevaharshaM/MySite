<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="arch-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#arch-grid)" />
  <rect x="10" y="10" width="700" height="310" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">LOOK INSIDE: A COLLECTION OF COOPERATING PARTS</text>

  <!-- Microprocessor Silicon Die Boundary -->
  <rect x="25" y="48" width="670" height="255" rx="10" fill="rgba(30, 41, 59, 0.3)" stroke="#3B82F6" stroke-width="1.8" />
  <text x="40" y="66" fill="#3B82F6" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" letter-spacing="0.08em">INSIDE THE MICROPROCESSOR</text>

  <!-- Row 1: ALU, Control Unit, Registers -->

  <!-- 1. ALU -->
  <rect x="45" y="80" width="200" height="85" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.4" />
  <rect x="45" y="80" width="200" height="24" rx="8" fill="rgba(16, 185, 129, 0.12)" />
  <text x="145" y="96" fill="#10B981" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">ALU</text>
  <text x="145" y="128" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">"Calculates."</text>
  <text x="145" y="150" fill="#94A3B8" font-size="8" text-anchor="middle">Performs the math and logic.</text>

  <!-- 2. Control Unit -->
  <rect x="260" y="80" width="200" height="85" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.4" />
  <rect x="260" y="80" width="200" height="24" rx="8" fill="rgba(245, 158, 11, 0.12)" />
  <text x="360" y="96" fill="#F59E0B" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">CONTROL UNIT</text>
  <text x="360" y="128" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">"Coordinates."</text>
  <text x="360" y="150" fill="#94A3B8" font-size="8" text-anchor="middle">Directs the flow of work.</text>

  <!-- 3. Registers -->
  <rect x="475" y="80" width="200" height="85" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.4" />
  <rect x="475" y="80" width="200" height="24" rx="8" fill="rgba(236, 72, 153, 0.12)" />
  <text x="575" y="96" fill="#EC4899" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">REGISTERS</text>
  <text x="575" y="128" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">"Holds what it needs now."</text>
  <text x="575" y="150" fill="#94A3B8" font-size="8" text-anchor="middle">Immediate working storage.</text>

  <!-- Row 2: Cache, Clock, Interfaces -->

  <!-- 4. Cache -->
  <rect x="45" y="180" width="200" height="85" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.4" />
  <rect x="45" y="180" width="200" height="24" rx="8" fill="rgba(139, 92, 246, 0.12)" />
  <text x="145" y="196" fill="#A78BFA" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">CACHE</text>
  <text x="145" y="228" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">"Keeps data close."</text>
  <text x="145" y="250" fill="#94A3B8" font-size="8" text-anchor="middle">Fast on-chip memory buffer.</text>

  <!-- 5. Clock -->
  <rect x="260" y="180" width="200" height="85" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.4" />
  <rect x="260" y="180" width="200" height="24" rx="8" fill="rgba(6, 182, 212, 0.12)" />
  <text x="360" y="196" fill="#22D3EE" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">CLOCK</text>
  <text x="360" y="228" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">"Sets the rhythm."</text>
  <text x="360" y="250" fill="#94A3B8" font-size="8" text-anchor="middle">Synchronizes state changes.</text>

  <!-- 6. Interfaces -->
  <rect x="475" y="180" width="200" height="85" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.4" />
  <rect x="475" y="180" width="200" height="24" rx="8" fill="rgba(99, 102, 241, 0.12)" />
  <text x="575" y="196" fill="#818CF8" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">INTERFACES</text>
  <text x="575" y="228" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">"Connects outward."</text>
  <text x="575" y="250" fill="#94A3B8" font-size="8" text-anchor="middle">Communicates with the board.</text>

  <!-- Footer Banner: Cooperating Harmony -->
  <rect x="180" y="278" width="360" height="18" rx="4" fill="#0F172A" stroke="rgba(59,130,246,0.3)" stroke-width="1" />
  <text x="360" y="290" fill="#60A5FA" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">Not one mysterious box — a collection of cooperating parts.</text>
</svg>
