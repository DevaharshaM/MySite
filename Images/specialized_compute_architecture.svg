<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">HETEROGENEOUS SYSTEM-ON-CHIP (SoC) ARCHITECTURE</text>

  <!-- Central host: CPU Core -->
  <rect x="250" y="55" width="140" height="45" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="320" y="75" fill="#3B82F6" font-weight="bold" font-size="9" text-anchor="middle">CPU (Host Coordinator)</text>
  <text x="320" y="87" fill="#64748B" font-size="7" text-anchor="middle">Decision • Control • OS • Comms</text>

  <!-- High-Speed System Interconnect (Bus Matrix) -->
  <rect x="60" y="120" width="520" height="15" rx="2" fill="#0F172A" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
  <text x="320" y="130" fill="#64748B" font-family="monospace" font-size="7" text-anchor="middle">HIGH-SPEED SYSTEM INTERCONNECT (AXI/AHB BUS)</text>

  <!-- Connection line from CPU to Bus -->
  <path d="M 320 100 V 120" fill="none" stroke="#3B82F6" stroke-width="1.5" />

  <!-- Branches from Bus to Coprocessors -->
  <!-- 1. GPU (Vector / Math) -->
  <path d="M 120 135 V 155" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="60" y="160" width="110" height="50" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
  <text x="115" y="178" fill="#10B981" font-weight="bold" font-size="8" text-anchor="middle">GPU</text>
  <text x="115" y="190" fill="#64748B" font-size="6.5" text-anchor="middle">Vector math • Rendering</text>
  <text x="115" y="199" fill="#64748B" font-size="6.5" text-anchor="middle">High throughput</text>

  <!-- 2. DSP (Signals) -->
  <path d="M 250 135 V 155" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="195" y="160" width="110" height="50" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
  <text x="250" y="178" fill="#F59E0B" font-weight="bold" font-size="8" text-anchor="middle">DSP</text>
  <text x="250" y="190" fill="#64748B" font-size="6.5" text-anchor="middle">Audio • RF filtering</text>
  <text x="250" y="199" fill="#64748B" font-size="6.5" text-anchor="middle">Deterministic math</text>

  <!-- 3. NPU / AI Accelerator -->
  <path d="M 390 135 V 155" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="335" y="160" width="110" height="50" rx="3" fill="#1E293B" stroke="#EC4899" stroke-width="1.2" />
  <text x="390" y="178" fill="#EC4899" font-weight="bold" font-size="8" text-anchor="middle">NPU (AI Engine)</text>
  <text x="390" y="190" fill="#64748B" font-size="6.5" text-anchor="middle">Matrix multiply</text>
  <text x="390" y="199" fill="#64748B" font-size="6.5" text-anchor="middle">Neural tensor math</text>

  <!-- 4. FPGA / Custom Logic -->
  <path d="M 520 135 V 155" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="465" y="160" width="110" height="50" rx="3" fill="#1E293B" stroke="#A855F7" stroke-width="1.2" />
  <text x="520" y="178" fill="#A855F7" font-weight="bold" font-size="8" text-anchor="middle">Hardware Accelerator</text>
  <text x="520" y="190" fill="#64748B" font-size="6.5" text-anchor="middle">Custom logic • Cryptography</text>
  <text x="520" y="199" fill="#64748B" font-size="6.5" text-anchor="middle">Zero-latency decoding</text>
</svg>
