<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="harv-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="harv-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8" />
    </marker>
    <marker id="harv-arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
    <marker id="harv-arrow-amber-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Background and Frame -->
  <rect width="100%" height="100%" fill="url(#harv-grid)" />
  <rect x="12" y="12" width="716" height="256" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="370" y="34" fill="#E2E8F0" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.08em">HARVARD ARCHITECTURE</text>
  <text x="370" y="49" fill="#94A3B8" font-size="8" text-anchor="middle">Separate memory spaces and independent communication paths</text>

  <!-- Left: Instruction Memory -->
  <g transform="translate(36, 74)">
    <rect width="180" height="150" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
    <rect width="180" height="26" rx="8" fill="rgba(56, 189, 248, 0.12)" />
    <circle cx="16" cy="13" r="3" fill="#38BDF8" />
    <text x="90" y="17" fill="#38BDF8" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="0.06em">INSTRUCTION MEMORY</text>

    <rect x="14" y="40" width="152" height="42" rx="5" fill="#0F172A" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <text x="90" y="58" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Program Storage</text>
    <text x="90" y="72" fill="#94A3B8" font-size="7.5" text-anchor="middle">Contains executable code</text>

    <rect x="14" y="94" width="152" height="42" rx="5" fill="#0F172A" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <text x="90" y="112" fill="#60A5FA" font-size="8" font-weight="600" text-anchor="middle">Read-Only by CPU</text>
    <text x="90" y="126" fill="#94A3B8" font-size="7.5" text-anchor="middle">Guards code from overwrite</text>
  </g>

  <!-- Path 1: Instruction Bus (Left to Center) -->
  <g transform="translate(216, 149)">
    <line x1="0" y1="0" x2="62" y2="0" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#harv-arrow-blue)" />
    <rect x="2" y="-18" width="60" height="15" rx="3" fill="#0F172A" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8" />
    <text x="32" y="-8" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="6.8" font-weight="600" text-anchor="middle">Fetch Path</text>
  </g>

  <!-- Center: Processor -->
  <g transform="translate(280, 68)">
    <rect width="180" height="162" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="2" />
    <rect width="180" height="26" rx="8" fill="rgba(129, 140, 248, 0.15)" />
    <circle cx="16" cy="13" r="3" fill="#818CF8" />
    <text x="90" y="17" fill="#A5B4FC" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.06em">PROCESSOR CORE</text>

    <rect x="14" y="38" width="152" height="46" rx="5" fill="#0F172A" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <text x="90" y="56" fill="#E2E8F0" font-size="8.5" font-weight="700" text-anchor="middle">Control &amp; Decode</text>
    <text x="90" y="72" fill="#94A3B8" font-size="7.5" text-anchor="middle">Decodes fetched instruction</text>

    <rect x="14" y="96" width="152" height="52" rx="5" fill="#0F172A" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <text x="90" y="115" fill="#E2E8F0" font-size="8.5" font-weight="700" text-anchor="middle">Execution Engine</text>
    <text x="90" y="129" fill="#94A3B8" font-size="7.5" text-anchor="middle">Operates simultaneously</text>
    <text x="90" y="141" fill="#818CF8" font-family="'IBM Plex Mono', monospace" font-size="6.8" text-anchor="middle">Two active ports</text>
  </g>

  <!-- Path 2: Data Bus (Center to Right) -->
  <g transform="translate(460, 149)">
    <line x1="0" y1="0" x2="62" y2="0" stroke="#F59E0B" stroke-width="2.5" marker-start="url(#harv-arrow-amber-rev)" marker-end="url(#harv-arrow-amber)" />
    <rect x="2" y="-18" width="60" height="15" rx="3" fill="#0F172A" stroke="rgba(245, 158, 11, 0.4)" stroke-width="0.8" />
    <text x="32" y="-8" fill="#F59E0B" font-family="'IBM Plex Mono', monospace" font-size="6.8" font-weight="600" text-anchor="middle">Data Path</text>
  </g>

  <!-- Right: Data Memory -->
  <g transform="translate(524, 74)">
    <rect width="180" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    <rect width="180" height="26" rx="8" fill="rgba(245, 158, 11, 0.12)" />
    <circle cx="16" cy="13" r="3" fill="#F59E0B" />
    <text x="90" y="17" fill="#FBBF24" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="0.06em">DATA MEMORY</text>

    <rect x="14" y="40" width="152" height="42" rx="5" fill="#0F172A" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />
    <text x="90" y="58" fill="#E2E8F0" font-size="8" font-weight="600" text-anchor="middle">Variable Storage</text>
    <text x="90" y="72" fill="#94A3B8" font-size="7.5" text-anchor="middle">Runtime state &amp; buffers</text>

    <rect x="14" y="94" width="152" height="42" rx="5" fill="#0F172A" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />
    <text x="90" y="112" fill="#FCD34D" font-size="8" font-weight="600" text-anchor="middle">Read &amp; Write</text>
    <text x="90" y="126" fill="#94A3B8" font-size="7.5" text-anchor="middle">Dynamic modification</text>
  </g>
</svg>
