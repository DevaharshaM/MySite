<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="missing-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#missing-grid)" />
  <rect x="10" y="10" width="700" height="260" fill="none" stroke="rgba(148,163,184,0.1)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">EVERYTHING IS READY: SOMETHING IS MISSING</text>

  <!-- Top: MEMORY -->
  <rect x="270" y="48" width="180" height="60" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4" />
  <text x="360" y="68" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">MEMORY</text>
  <text x="360" y="86" fill="#CBD5E1" font-size="8.5" text-anchor="middle">Can hold.</text>
  <text x="360" y="98" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Stores data &amp; code</text>

  <!-- Stalled line: Memory to Center -->
  <line x1="360" y1="108" x2="360" y2="128" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="360" cy="128" r="2.5" fill="#64748B" />

  <!-- Left: INPUT -->
  <rect x="35" y="130" width="170" height="120" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.4" />
  <rect x="35" y="130" width="170" height="24" rx="8" fill="rgba(16, 185, 129, 0.12)" />
  <text x="120" y="146" fill="#10B981" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">INPUT</text>
  <text x="120" y="174" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Can provide.</text>
  <text x="120" y="194" fill="#94A3B8" font-size="8" text-anchor="middle">Signals arrive from outside.</text>
  <text x="120" y="208" fill="#94A3B8" font-size="8" text-anchor="middle">Sensors, touch, packets.</text>
  <text x="120" y="232" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Waiting to be read...</text>

  <!-- Stalled line: Input to Center -->
  <line x1="205" y1="190" x2="250" y2="190" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="250" cy="190" r="3" fill="#64748B" />

  <!-- Center: THE MISSING PIECE -->
  <rect x="260" y="130" width="200" height="120" rx="8" fill="rgba(30, 41, 59, 0.4)" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#amber-glow)" />
  <circle cx="360" cy="158" r="14" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="1.5" />
  <text x="360" y="163" fill="#F59E0B" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">?</text>
  <text x="360" y="188" fill="#FCD34D" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">NOTHING DECIDES</text>
  <text x="360" y="208" fill="#E2E8F0" font-size="8" text-anchor="middle">Nothing evaluates.</text>
  <text x="360" y="222" fill="#E2E8F0" font-size="8" text-anchor="middle">Nothing computes.</text>
  <text x="360" y="238" fill="#F87171" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">Nothing moves.</text>

  <!-- Stalled line: Center to Output -->
  <line x1="460" y1="190" x2="505" y2="190" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="505" cy="190" r="3" fill="#64748B" />

  <!-- Right: OUTPUT -->
  <rect x="515" y="130" width="170" height="120" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.4" />
  <rect x="515" y="130" width="170" height="24" rx="8" fill="rgba(168, 85, 247, 0.12)" />
  <text x="600" y="146" fill="#A855F7" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">OUTPUT</text>
  <text x="600" y="174" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Can respond.</text>
  <text x="600" y="194" fill="#94A3B8" font-size="8" text-anchor="middle">Ready to display or actuate.</text>
  <text x="600" y="208" fill="#94A3B8" font-size="8" text-anchor="middle">Screens, motors, radio.</text>
  <text x="600" y="232" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">No command arrives...</text>
</svg>
