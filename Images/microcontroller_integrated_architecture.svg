<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="mia-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="cpu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#mia-grid)" />
  <rect x="12" y="12" width="736" height="346" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="380" y="34" fill="#E2E8F0" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.08em">MORE THAN A PROCESSOR</text>
  <text x="380" y="49" fill="#94A3B8" font-size="8" text-anchor="middle">Computation, memory, and interaction — brought together in one small system</text>

  <!-- Outer Microcontroller Package (The Single Chip Boundary) -->
  <g transform="translate(60, 68)">
    <!-- IC Pins on Left -->
    <g fill="#94A3B8">
      <rect x="-14" y="25" width="14" height="6" rx="1.5" />
      <rect x="-14" y="55" width="14" height="6" rx="1.5" />
      <rect x="-14" y="85" width="14" height="6" rx="1.5" />
      <rect x="-14" y="115" width="14" height="6" rx="1.5" />
      <rect x="-14" y="145" width="14" height="6" rx="1.5" />
      <rect x="-14" y="175" width="14" height="6" rx="1.5" />
      <rect x="-14" y="205" width="14" height="6" rx="1.5" />
      <rect x="-14" y="235" width="14" height="6" rx="1.5" />
    </g>

    <!-- IC Pins on Right -->
    <g fill="#94A3B8">
      <rect x="640" y="25" width="14" height="6" rx="1.5" />
      <rect x="640" y="55" width="14" height="6" rx="1.5" />
      <rect x="640" y="85" width="14" height="6" rx="1.5" />
      <rect x="640" y="115" width="14" height="6" rx="1.5" />
      <rect x="640" y="145" width="14" height="6" rx="1.5" />
      <rect x="640" y="175" width="14" height="6" rx="1.5" />
      <rect x="640" y="205" width="14" height="6" rx="1.5" />
      <rect x="640" y="235" width="14" height="6" rx="1.5" />
    </g>

    <!-- Chip Package Body -->
    <rect width="640" height="270" rx="10" fill="#151E2E" stroke="#38BDF8" stroke-width="1.8" />
    <rect width="640" height="28" rx="10" fill="rgba(56, 189, 248, 0.12)" />
    <circle cx="16" cy="14" r="3.5" fill="#38BDF8" />
    <text x="320" y="18" fill="#38BDF8" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.08em">SINGLE SILICON DIE · THE MICROCONTROLLER (MCU)</text>

    <!-- Internal Interconnect Bus -->
    <rect x="30" y="148" width="580" height="18" rx="4" fill="rgba(59, 130, 246, 0.18)" stroke="#3B82F6" stroke-dasharray="4 2" stroke-width="1" />
    <text x="320" y="160" fill="#93C5FD" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.06em">INTERNAL ON-CHIP SYSTEM BUS</text>

    <!-- Bus connector taps (vertical lines) -->
    <line x1="110" y1="94" x2="110" y2="148" stroke="#3B82F6" stroke-width="1.2" />
    <line x1="110" y1="166" x2="110" y2="180" stroke="#3B82F6" stroke-width="1.2" />
    <line x1="320" y1="108" x2="320" y2="148" stroke="#60A5FA" stroke-width="1.8" />
    <line x1="510" y1="94" x2="510" y2="148" stroke="#3B82F6" stroke-width="1.2" />
    <line x1="510" y1="166" x2="510" y2="180" stroke="#3B82F6" stroke-width="1.2" />

    <!-- 1. Flash Memory (Top Left) -->
    <g transform="translate(25, 42)">
      <rect width="170" height="52" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
      <text x="85" y="20" fill="#FBBF24" font-size="8.5" font-weight="700" text-anchor="middle">FLASH MEMORY</text>
      <text x="85" y="34" fill="#94A3B8" font-size="7.5" text-anchor="middle">Holds program firmware</text>
      <text x="85" y="44" fill="#64748B" font-size="7" text-anchor="middle">Non-volatile storage</text>
    </g>

    <!-- 2. SRAM / Data Memory (Bottom Left) -->
    <g transform="translate(25, 180)">
      <rect width="170" height="52" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
      <text x="85" y="20" fill="#FBBF24" font-size="8.5" font-weight="700" text-anchor="middle">RAM (SRAM)</text>
      <text x="85" y="34" fill="#94A3B8" font-size="7.5" text-anchor="middle">Holds runtime variables &amp; stack</text>
      <text x="85" y="44" fill="#64748B" font-size="7" text-anchor="middle">Fast working memory</text>
    </g>

    <!-- 3. PROCESSOR CORE / CPU (Center) -->
    <g transform="translate(225, 42)">
      <rect width="190" height="66" rx="7" fill="url(#cpu-grad)" stroke="#60A5FA" stroke-width="2" />
      <circle cx="16" cy="16" r="3" fill="#60A5FA" />
      <text x="95" y="24" fill="#FFFFFF" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.04em">PROCESSOR CORE</text>
      <text x="95" y="42" fill="#BAE6FD" font-size="8" font-weight="600" text-anchor="middle">Executes Instructions</text>
      <text x="95" y="55" fill="#94A3B8" font-size="7.2" text-anchor="middle">Coordinates all integrated blocks</text>
    </g>

    <!-- 4. TIMERS & PWM (Top Right) -->
    <g transform="translate(445, 42)">
      <rect width="170" height="52" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
      <text x="85" y="20" fill="#34D399" font-size="8.5" font-weight="700" text-anchor="middle">TIMERS &amp; PWM</text>
      <text x="85" y="34" fill="#94A3B8" font-size="7.5" text-anchor="middle">Measures time intervals</text>
      <text x="85" y="44" fill="#64748B" font-size="7" text-anchor="middle">Generates control pulses</text>
    </g>

    <!-- 5. ANALOG INTERFACES / ADC (Right Center) -->
    <g transform="translate(445, 180)">
      <rect width="170" height="52" rx="6" fill="#1E293B" stroke="#EC4899" stroke-width="1.2" />
      <text x="85" y="20" fill="#F472B6" font-size="8.5" font-weight="700" text-anchor="middle">ADC (ANALOG / DIGITAL)</text>
      <text x="85" y="34" fill="#94A3B8" font-size="7.5" text-anchor="middle">Converts physical voltages</text>
      <text x="85" y="44" fill="#64748B" font-size="7" text-anchor="middle">Continuous sensor reading</text>
    </g>

    <!-- 6. GPIO & SERIAL INTERFACES (Bottom Center) -->
    <g transform="translate(225, 180)">
      <rect width="190" height="74" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.2" />
      <text x="95" y="20" fill="#C084FC" font-size="8.5" font-weight="700" text-anchor="middle">HARDWARE INTERFACES</text>
      <text x="95" y="36" fill="#E2E8F0" font-size="7.8" font-weight="600" text-anchor="middle">GPIO (General Purpose Pins)</text>
      <text x="95" y="49" fill="#94A3B8" font-size="7.2" text-anchor="middle">Serial: UART · SPI · I2C</text>
      <text x="95" y="62" fill="#64748B" font-size="7" text-anchor="middle">Direct link to external hardware</text>
    </g>
  </g>
</svg>
