<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-8051-blocks" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>

    <!-- CPU Center Gradient -->
    <linearGradient id="cpu-glow-8051" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#grid-8051-blocks)" />
  <rect x="12" y="12" width="736" height="456" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="36" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE 8051 ARCHITECTURE · CONCEPTUAL BUILDING BLOCKS</text>
  <text x="380" y="52" fill="#94A3B8" font-size="8.5" text-anchor="middle">A complete computer integrated onto a single silicon chip in 1980</text>

  <!-- Silicon Die Container -->
  <g transform="translate(45, 68)">
    <!-- Outer Die Boundary -->
    <rect width="670" height="370" rx="10" fill="#131B2A" stroke="#3B82F6" stroke-width="1.6" />
    <rect width="670" height="26" rx="10" fill="rgba(59, 130, 246, 0.12)" />
    <circle cx="16" cy="13" r="3.5" fill="#3B82F6" />
    <text x="335" y="17" fill="#60A5FA" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="0.08em">INTEL 8051 (MCS-51) · ON-CHIP SILICON INTEGRATION</text>

    <!-- Central System Bus -->
    <rect x="35" y="175" width="600" height="28" rx="5" fill="rgba(59, 130, 246, 0.16)" stroke="#3B82F6" stroke-dasharray="5 3" stroke-width="1.2" />
    <text x="335" y="193" fill="#93C5FD" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.1em">INTERNAL 8-BIT SYSTEM BUS</text>

    <!-- Tap lines to top row -->
    <line x1="102" y1="126" x2="102" y2="175" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="2 2" />
    <line x1="240" y1="126" x2="240" y2="175" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="2 2" />
    <line x1="430" y1="126" x2="430" y2="175" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="2 2" />
    <line x1="568" y1="126" x2="568" y2="175" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="2 2" />

    <!-- Tap lines to bottom row -->
    <line x1="102" y1="203" x2="102" y2="242" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="2 2" />
    <line x1="240" y1="203" x2="240" y2="242" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="2 2" />
    <line x1="430" y1="203" x2="430" y2="242" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="2 2" />
    <line x1="568" y1="203" x2="568" y2="242" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="2 2" />

    <!-- ========================================== -->
    <!-- TOP ROW: MEMORIES & TIMERS / OSCILLATOR    -->
    <!-- ========================================== -->

    <!-- Program Memory (4 KB ROM) -->
    <g transform="translate(35, 42)">
      <rect width="135" height="84" rx="7" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
      <rect width="135" height="20" rx="7" fill="rgba(245, 158, 11, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#F59E0B" />
      <text x="67" y="14" fill="#FBBF24" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">PROGRAM MEMORY</text>
      
      <text x="67" y="38" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">4 KB On-Chip ROM</text>
      <text x="67" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Permanent firmware code</text>
      <text x="67" y="66" fill="#64748B" font-size="7" text-anchor="middle">Addressable up to 64 KB</text>
    </g>

    <!-- Data Memory (128 Bytes RAM) -->
    <g transform="translate(182, 42)">
      <rect width="135" height="84" rx="7" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <rect width="135" height="20" rx="7" fill="rgba(16, 185, 129, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#10B981" />
      <text x="67" y="14" fill="#34D399" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">DATA MEMORY</text>
      
      <text x="67" y="38" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">128 Bytes RAM</text>
      <text x="67" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Register banks · stack</text>
      <text x="67" y="66" fill="#64748B" font-size="7" text-anchor="middle">Fast working scratchpad</text>
    </g>

    <!-- Timers / Counters -->
    <g transform="translate(362, 42)">
      <rect width="135" height="84" rx="7" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
      <rect width="135" height="20" rx="7" fill="rgba(236, 72, 153, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#EC4899" />
      <text x="67" y="14" fill="#F472B6" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">TIMERS / COUNTERS</text>
      
      <text x="67" y="38" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Timer 0 &amp; Timer 1</text>
      <text x="67" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">Two 16-bit registers</text>
      <text x="67" y="66" fill="#64748B" font-size="7" text-anchor="middle">Event counting · intervals</text>
    </g>

    <!-- Oscillator & Timing -->
    <g transform="translate(509, 42)">
      <rect width="126" height="84" rx="7" fill="#1E293B" stroke="#FB7185" stroke-width="1.5" />
      <rect width="126" height="20" rx="7" fill="rgba(251, 113, 133, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#FB7185" />
      <text x="63" y="14" fill="#FDA4AF" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">OSCILLATOR / CLOCK</text>
      
      <text x="63" y="38" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">On-Chip Clock</text>
      <text x="63" y="52" fill="#94A3B8" font-size="7" text-anchor="middle">XTAL1 &amp; XTAL2 pins</text>
      <text x="63" y="66" fill="#64748B" font-size="7" text-anchor="middle">Typical 12 MHz crystal</text>
    </g>

    <!-- ========================================== -->
    <!-- CENTER: 8-BIT CPU CORE                     -->
    <!-- ========================================== -->
    <g transform="translate(245, 140)">
      <rect width="180" height="98" rx="9" fill="url(#cpu-glow-8051)" stroke="#60A5FA" stroke-width="2.2" />
      <rect width="180" height="24" rx="9" fill="rgba(96, 165, 250, 0.22)" />
      <circle cx="16" cy="12" r="4" fill="#60A5FA" />
      <text x="90" y="16" fill="#FFFFFF" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.08em">8-BIT CPU CORE</text>

      <text x="90" y="44" fill="#93C5FD" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">ALU &amp; CONTROL UNIT</text>
      <text x="90" y="62" fill="#E2E8F0" font-size="8" text-anchor="middle">8-Bit Data Processing Engine</text>
      <text x="90" y="78" fill="#94A3B8" font-size="7.5" text-anchor="middle">Program Counter · DPTR · ACC</text>
    </g>

    <!-- ========================================== -->
    <!-- BOTTOM ROW: I/O PORTS, SERIAL & INTERRUPTS -->
    <!-- ========================================== -->

    <!-- Four 8-Bit I/O Ports (P0, P1, P2, P3) -->
    <g transform="translate(35, 242)">
      <rect width="282" height="106" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <rect width="282" height="20" rx="8" fill="rgba(56, 189, 248, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#38BDF8" />
      <text x="141" y="14" fill="#38BDF8" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">FOUR 8-BIT PARALLEL I/O PORTS · 32 PINS</text>

      <!-- Port 0 Mini -->
      <g transform="translate(10, 28)">
        <rect width="60" height="32" rx="4" fill="#0F172A" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <text x="30" y="14" fill="#38BDF8" font-size="7.5" font-weight="700" text-anchor="middle">Port 0</text>
        <text x="30" y="25" fill="#94A3B8" font-size="6.5" text-anchor="middle">Addr / Data</text>
      </g>

      <!-- Port 1 Mini -->
      <g transform="translate(76, 28)">
        <rect width="60" height="32" rx="4" fill="#0F172A" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <text x="30" y="14" fill="#38BDF8" font-size="7.5" font-weight="700" text-anchor="middle">Port 1</text>
        <text x="30" y="25" fill="#94A3B8" font-size="6.5" text-anchor="middle">Pure I/O</text>
      </g>

      <!-- Port 2 Mini -->
      <g transform="translate(142, 28)">
        <rect width="60" height="32" rx="4" fill="#0F172A" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <text x="30" y="14" fill="#38BDF8" font-size="7.5" font-weight="700" text-anchor="middle">Port 2</text>
        <text x="30" y="25" fill="#94A3B8" font-size="6.5" text-anchor="middle">High Addr</text>
      </g>

      <!-- Port 3 Mini -->
      <g transform="translate(208, 28)">
        <rect width="64" height="32" rx="4" fill="#0F172A" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <text x="32" y="14" fill="#38BDF8" font-size="7.5" font-weight="700" text-anchor="middle">Port 3</text>
        <text x="32" y="25" fill="#94A3B8" font-size="6.5" text-anchor="middle">Special I/O</text>
      </g>

      <text x="141" y="78" fill="#CBD5E1" font-size="7.5" text-anchor="middle">Direct digital interface to physical hardware</text>
      <text x="141" y="92" fill="#64748B" font-size="7" text-anchor="middle">Buttons · LEDs · switches · displays · external buses</text>
    </g>

    <!-- Serial Port (UART) -->
    <g transform="translate(332, 242)">
      <rect width="150" height="106" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5" />
      <rect width="150" height="20" rx="8" fill="rgba(251, 191, 36, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#FBBF24" />
      <text x="75" y="14" fill="#FDE68A" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">SERIAL INTERFACE</text>

      <text x="75" y="40" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Full-Duplex UART</text>
      <text x="75" y="56" fill="#94A3B8" font-size="7" text-anchor="middle">RxD (Pin 10) &amp; TxD (Pin 11)</text>
      <text x="75" y="72" fill="#94A3B8" font-size="7" text-anchor="middle">Transmit &amp; receive at once</text>
      <text x="75" y="88" fill="#64748B" font-size="7" text-anchor="middle">Converse with other devices</text>
    </g>

    <!-- Interrupt System -->
    <g transform="translate(497, 242)">
      <rect width="138" height="106" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" />
      <rect width="138" height="20" rx="8" fill="rgba(167, 139, 250, 0.15)" />
      <circle cx="12" cy="10" r="3" fill="#A78BFA" />
      <text x="69" y="14" fill="#C4B5FD" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.04em">INTERRUPT SYSTEM</text>

      <text x="69" y="40" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">5 Interrupt Sources</text>
      <text x="69" y="56" fill="#94A3B8" font-size="7" text-anchor="middle">2 External (INT0, INT1)</text>
      <text x="69" y="72" fill="#94A3B8" font-size="7" text-anchor="middle">2 Timers (TF0, TF1) · 1 Serial</text>
      <text x="69" y="88" fill="#64748B" font-size="7" text-anchor="middle">2 Priority Levels</text>
    </g>

  </g>

  <!-- Footnote -->
  <text x="380" y="466" fill="#64748B" font-size="7.5" text-anchor="middle">The 8051 architectural formula: CPU + ROM + RAM + 4 I/O Ports + 2 Timers + UART + Interrupts inside one IC</text>
</svg>
