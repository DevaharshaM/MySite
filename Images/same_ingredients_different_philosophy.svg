<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="100%" height="100%" style="background:#171426; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="sidp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(196, 181, 253, 0.03)" stroke-width="1"/>
    </pattern>
    <marker id="sidp-arrow-gold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FBBF24" />
    </marker>
    <marker id="sidp-arrow-violet" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA" />
    </marker>
  </defs>

  <!-- Background and Outer Frame -->
  <rect width="100%" height="100%" fill="url(#sidp-grid)" />
  <rect x="10" y="10" width="700" height="220" fill="none" stroke="rgba(196, 181, 253, 0.12)" stroke-width="1" rx="8" />

  <text x="360" y="30" fill="#F8FAFC" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.1em">SAME INGREDIENTS · DIFFERENT PHILOSOPHIES</text>
  <text x="360" y="44" fill="#C4B5FD" font-size="8" text-anchor="middle">Identical architectural building blocks configured for two opposing purposes</text>

  <!-- LEFT: Shared Elements Box -->
  <g transform="translate(30, 60)">
    <rect width="170" height="150" rx="8" fill="#1F1B33" stroke="rgba(196, 181, 253, 0.25)" stroke-width="1" />
    <rect width="170" height="22" rx="8" fill="rgba(196, 181, 253, 0.1)" />
    <circle cx="14" cy="11" r="3" fill="#FBBF24" />
    <text x="90" y="15" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">SHARED PIECES</text>

    <g transform="translate(15, 34)">
      <circle cx="5" cy="8" r="2" fill="#FBBF24" />
      <text x="14" y="11" fill="#F8FAFC" font-size="7.5" font-weight="600">Processing Core (ALU)</text>

      <circle cx="5" cy="26" r="2" fill="#FBBF24" />
      <text x="14" y="29" fill="#F8FAFC" font-size="7.5" font-weight="600">Program &amp; Data Memory</text>

      <circle cx="5" cy="44" r="2" fill="#FBBF24" />
      <text x="14" y="47" fill="#F8FAFC" font-size="7.5" font-weight="600">Interconnect Buses</text>

      <circle cx="5" cy="62" r="2" fill="#FBBF24" />
      <text x="14" y="65" fill="#F8FAFC" font-size="7.5" font-weight="600">Instruction Decoders</text>

      <circle cx="5" cy="80" r="2" fill="#FBBF24" />
      <text x="14" y="83" fill="#F8FAFC" font-size="7.5" font-weight="600">I/O &amp; Peripheral Logic</text>

      <circle cx="5" cy="98" r="2" fill="#FBBF24" />
      <text x="14" y="101" fill="#F8FAFC" font-size="7.5" font-weight="600">Clock &amp; State Control</text>
    </g>
  </g>

  <!-- Branching Connector Paths -->
  <!-- Upper Path to Microprocessor -->
  <path d="M 200 115 C 250 115, 260 90, 310 90" fill="none" stroke="#A78BFA" stroke-width="1.8" marker-end="url(#sidp-arrow-violet)" />
  <!-- Lower Path to Microcontroller -->
  <path d="M 200 155 C 250 155, 260 180, 310 180" fill="none" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#sidp-arrow-gold)" />

  <!-- TOP BRANCH: MICROPROCESSOR PHILOSOPHY -->
  <g transform="translate(315, 58)">
    <rect width="375" height="66" rx="8" fill="#1F1B33" stroke="#A78BFA" stroke-width="1.2" />
    
    <!-- Header Tag -->
    <rect x="12" y="8" width="135" height="18" rx="4" fill="rgba(167, 139, 250, 0.12)" stroke="#A78BFA" stroke-width="0.8" />
    <text x="79" y="20" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">MICROPROCESSOR</text>
    <text x="155" y="21" fill="#DDD6FE" font-size="8" font-weight="700">Computational Scale &amp; Flexibility</text>

    <text x="15" y="42" fill="#F8FAFC" font-size="7.5">Built to calculate at massive scale, run operating systems, and handle unknown workloads.</text>
    <text x="15" y="55" fill="#A78BFA" font-family="'IBM Plex Mono', monospace" font-size="6.8">Primary Goal: High Throughput · Dynamic Multi-tasking · Expandable Memory</text>
  </g>

  <!-- BOTTOM BRANCH: MICROCONTROLLER PHILOSOPHY -->
  <g transform="translate(315, 144)">
    <rect width="375" height="66" rx="8" fill="#1F1B33" stroke="#FBBF24" stroke-width="1.2" />
    
    <!-- Header Tag -->
    <rect x="12" y="8" width="145" height="18" rx="4" fill="rgba(251, 191, 36, 0.12)" stroke="#FBBF24" stroke-width="0.8" />
    <text x="84" y="20" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">MICROCONTROLLER</text>
    <text x="165" y="21" fill="#FDE68A" font-size="8" font-weight="700">Physical Agency &amp; Determinism</text>

    <text x="15" y="42" fill="#F8FAFC" font-size="7.5">Built to live inside a machine, sense its environment, and react with guaranteed timing.</text>
    <text x="15" y="55" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="6.8">Primary Goal: Direct Pin Control · Low Latency · Energy Efficiency · Single-chip</text>
  </g>
</svg>
