<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#10B981" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="32" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">WATCHDOG TIMER SUPERVISION LIFECYCLE</text>

  <!-- Y-Axis (Watchdog Counter) -->
  <line x1="50" y1="50" x2="50" y2="200" stroke="rgba(148,163,184,0.3)" stroke-width="1.5" />
  <text x="40" y="60" fill="#64748B" font-size="7" font-family="monospace">100%</text>
  <text x="40" y="200" fill="#64748B" font-size="7" font-family="monospace">0%</text>
  <text x="25" y="130" fill="#64748B" font-size="8" transform="rotate(-90 25 130)" text-anchor="middle">Counter Value</text>

  <!-- Sawtooth wave showing normal kicks -->
  <!-- Kick 1 at X=150, Kick 2 at X=270, Crash starting at X=270, timeout at X=470 -->
  <path d="M 50 60
           L 150 170
           V 60
           L 270 170
           V 60
           L 470 200"
        fill="none" stroke="#3B82F6" stroke-width="2.5" />

  <!-- Kicking / Refreshing indicators -->
  <path d="M 150 190 V 70" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-up)" />
  <text x="150" y="205" fill="#10B981" font-size="7" font-weight="bold" text-anchor="middle">Software Kick</text>

  <path d="M 270 190 V 70" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-up)" />
  <text x="270" y="205" fill="#10B981" font-size="7" font-weight="bold" text-anchor="middle">Software Kick</text>

  <!-- Crash Point -->
  <circle cx="340" cy="111" r="5" fill="#EF4444" />
  <text x="340" y="98" fill="#EF4444" font-size="8" font-weight="bold" text-anchor="middle">Software Crash / Freeze</text>
  <path d="M 345 105 L 395 125" fill="none" stroke="#EF4444" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Timeout Point -->
  <circle cx="470" cy="200" r="5" fill="#EF4444" />
  <text x="470" y="185" fill="#EF4444" font-size="8" font-weight="bold" text-anchor="middle">Timeout (0%)</text>
  
  <!-- Reset Triggered line -->
  <line x1="470" y1="200" x2="520" y2="200" stroke="#EF4444" stroke-width="2.5" />
  <line x1="520" y1="200" x2="520" y2="60" stroke="#10B981" stroke-width="2.5" />
  <line x1="520" y1="60" x2="590" y2="60" stroke="#10B981" stroke-width="2.5" />

  <text x="555" y="52" fill="#10B981" font-size="7" font-weight="bold" text-anchor="middle">System Reboots</text>
  <text x="495" y="220" fill="#EF4444" font-size="7" font-weight="bold" text-anchor="middle">Watchdog Reset Asserted</text>
</svg>
