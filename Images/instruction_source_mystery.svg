<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="src-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="src-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <filter id="q-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#src-grid)" />
  <rect x="10" y="10" width="700" height="230" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <text x="360" y="32" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE UNRESOLVED ORIGIN: WHERE ARE INSTRUCTIONS STORED?</text>

  <!-- Left: The Unresolved Storage Space -->
  <rect x="45" y="55" width="260" height="150" rx="8" fill="rgba(30, 41, 59, 0.4)" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#q-glow)" />
  <circle cx="175" cy="90" r="16" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="1.5" />
  <text x="175" y="96" fill="#F59E0B" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">?</text>
  <text x="175" y="126" fill="#FCD34D" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">WHERE WAS IT STORED?</text>
  <text x="175" y="146" fill="#E2E8F0" font-size="8" text-anchor="middle">Before the processor fetched it,</text>
  <text x="175" y="160" fill="#E2E8F0" font-size="8" text-anchor="middle">the instruction had to exist somewhere.</text>
  <text x="175" y="184" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">External memory space?</text>

  <!-- Fetch Channel (Left to Right) -->
  <path d="M 315 130 L 400 130" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#src-arrow-blue)" />
  <rect x="330" y="104" width="60" height="18" rx="3" fill="#0F172A" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  <text x="360" y="116" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">FETCH</text>

  <!-- Right: Microprocessor Core -->
  <rect x="415" y="55" width="260" height="150" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.8" />
  <rect x="415" y="55" width="260" height="26" rx="8" fill="rgba(59, 130, 246, 0.15)" />
  <circle cx="433" cy="68" r="3" fill="#3B82F6" />
  <text x="545" y="72" fill="#3B82F6" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.06em">MICROPROCESSOR</text>

  <rect x="435" y="95" width="220" height="30" rx="4" fill="#0F172A" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
  <text x="545" y="114" fill="#60A5FA" font-size="8.5" font-weight="600" text-anchor="middle">Active Pipelined Core</text>

  <text x="545" y="145" fill="#CBD5E1" font-size="8" text-anchor="middle">Continuously fetches and executes.</text>
  <text x="545" y="160" fill="#CBD5E1" font-size="8" text-anchor="middle">Relies on an external source for code.</text>
  <text x="545" y="184" fill="#64748B" font-family="'IBM Plex Mono', monospace" font-size="7.5" text-anchor="middle">How does it access instructions?</text>
</svg>
