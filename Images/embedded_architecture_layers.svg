<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="260" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <text x="320" y="28" fill="#E2E8F0" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">EMBEDDED ARCHITECTURE STACK</text>

  <!-- Layer 5: Application / Behaviour -->
  <rect x="30" y="45" width="580" height="32" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
  <text x="50" y="65" fill="#FFF" font-weight="bold" font-size="9" text-anchor="start">LEVEL 5: Application &amp; Emergent Behaviour</text>
  <text x="590" y="65" fill="#F59E0B" font-size="8" text-anchor="end">Control Loops, Decision Logic, PID Engine</text>

  <!-- Layer 4: System Coordination -->
  <rect x="30" y="87" width="580" height="32" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
  <text x="50" y="107" fill="#FFF" font-weight="bold" font-size="9" text-anchor="start">LEVEL 4: System Coordination</text>
  <text x="590" y="107" fill="#10B981" font-size="8" text-anchor="end">Interrupt Controllers, DMA Transfers, Timers</text>

  <!-- Layer 3: Driver / Interface -->
  <rect x="30" y="129" width="580" height="32" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
  <text x="50" y="149" fill="#FFF" font-weight="bold" font-size="9" text-anchor="start">LEVEL 3: Device Driver &amp; Interface Layer</text>
  <text x="590" y="149" fill="#3B82F6" font-size="8" text-anchor="end">UART, SPI, I2C, CAN, ADC/DAC API</text>

  <!-- Layer 2: Silicon Hardware -->
  <rect x="30" y="171" width="580" height="32" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
  <text x="50" y="191" fill="#FFF" font-weight="bold" font-size="9" text-anchor="start">LEVEL 2: Silicon Hardware Architecture</text>
  <text x="590" y="191" fill="#64748B" font-size="8" text-anchor="end">CPU Registers, Internal Buses, SRAM Blocks</text>

  <!-- Layer 1: Physical Matter -->
  <rect x="30" y="213" width="580" height="32" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" stroke-dasharray="3,3" />
  <text x="50" y="233" fill="#FFF" font-weight="bold" font-size="9" text-anchor="start">LEVEL 1: Physical Matter Layer</text>
  <text x="590" y="233" fill="#64748B" font-size="8" text-anchor="end">Silicon Crystal, Transistors, Electric Charge</text>
</svg>
