<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid-sfr" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-sfr" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-sfr)" />
  <rect x="12" y="12" width="736" height="416" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="38" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE 8051 SPECIAL FUNCTION REGISTERS (SFR) MAP</text>
  <text x="380" y="55" fill="#94A3B8" font-size="8.5" text-anchor="middle">Upper Data Address Space (80H → FFH) · Direct Hardware Control &amp; Status Registers</text>

  <!-- ============================================================ -->
  <!-- LEFT: SFR ADDRESS GRID (x=35, width=440)                      -->
  <!-- ============================================================ -->
  <g transform="translate(35, 75)" filter="url(#shadow-sfr)">
    <rect width="440" height="315" rx="6" fill="#131B2A" stroke="#F59E0B" stroke-width="1.2" />
    <rect width="440" height="26" rx="6" fill="rgba(245, 158, 11, 0.15)" />
    <circle cx="15" cy="13" r="3.5" fill="#F59E0B" />
    <text x="220" y="17" fill="#FBBF24" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">REPRESENTATIVE SFR ADDRESS LOCATIONS (80H → FFH)</text>

    <!-- Table of SFRs -->
    <g transform="translate(15, 36)">
      <!-- Row 1: F0H & E0H -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(245, 158, 11, 0.4)" />
        <text x="10" y="19" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">F0H · B</text>
        <text x="75" y="19" fill="#94A3B8" font-size="7.5">B Register (Math/Div)</text>
        <text x="185" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>

        <rect x="215" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(245, 158, 11, 0.4)" />
        <text x="225" y="19" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">E0H · ACC</text>
        <text x="290" y="19" fill="#94A3B8" font-size="7.5">Accumulator</text>
        <text x="400" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>
      </g>

      <!-- Row 2: D0H & B8H -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(245, 158, 11, 0.4)" />
        <text x="10" y="19" fill="#FDE68A" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">D0H · PSW</text>
        <text x="75" y="19" fill="#94A3B8" font-size="7.5">Program Status Word</text>
        <text x="185" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>

        <rect x="215" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="225" y="19" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">B8H · IP</text>
        <text x="290" y="19" fill="#94A3B8" font-size="7.5">Interrupt Priority</text>
        <text x="400" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>
      </g>

      <!-- Row 3: B0H & A8H -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" />
        <text x="10" y="19" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">B0H · P3</text>
        <text x="75" y="19" fill="#94A3B8" font-size="7.5">Port 3 (I/O &amp; Signals)</text>
        <text x="185" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>

        <rect x="215" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="225" y="19" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">A8H · IE</text>
        <text x="290" y="19" fill="#94A3B8" font-size="7.5">Interrupt Enable</text>
        <text x="400" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>
      </g>

      <!-- Row 4: A0H & 99H / 98H -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" />
        <text x="10" y="19" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">A0H · P2</text>
        <text x="75" y="19" fill="#94A3B8" font-size="7.5">Port 2 (I/O &amp; High Addr)</text>
        <text x="185" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>

        <rect x="215" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="225" y="19" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">98H · SCON</text>
        <text x="300" y="19" fill="#94A3B8" font-size="7.5">Serial Control</text>
        <text x="400" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>
      </g>

      <!-- Row 5: 90H & 89H / 88H -->
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" />
        <text x="10" y="19" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">90H · P1</text>
        <text x="75" y="19" fill="#94A3B8" font-size="7.5">Port 1 (General I/O)</text>
        <text x="185" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>

        <rect x="215" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="225" y="19" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">88H · TCON</text>
        <text x="300" y="19" fill="#94A3B8" font-size="7.5">Timer Control</text>
        <text x="400" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>
      </g>

      <!-- Row 6: 89H (TMOD), 87H (PCON), 83H/82H (DPH/DPL), 81H (SP), 80H (P0) -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" />
        <text x="10" y="19" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">80H · P0</text>
        <text x="75" y="19" fill="#94A3B8" font-size="7.5">Port 0 (I/O &amp; Data/Addr)</text>
        <text x="185" y="19" fill="#34D399" font-size="6.5" font-weight="600" text-anchor="end">BIT-ADDR</text>

        <rect x="215" y="0" width="195" height="30" rx="3" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" />
        <text x="225" y="19" fill="#DDD6FE" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700">81H · SP</text>
        <text x="290" y="19" fill="#94A3B8" font-size="7.5">Stack Pointer (07H at Reset)</text>
      </g>

      <!-- Row 7: Additional representative SFRs -->
      <g transform="translate(0, 216)">
        <rect x="0" y="0" width="132" height="26" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.15)" />
        <text x="10" y="17" fill="#CBD5E1" font-family="'IBM Plex Mono', monospace" font-size="7.5">82H: DPL · 83H: DPH</text>

        <rect x="140" y="0" width="132" height="26" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.15)" />
        <text x="150" y="17" fill="#CBD5E1" font-family="'IBM Plex Mono', monospace" font-size="7.5">89H: TMOD · 87H: PCON</text>

        <rect x="280" y="0" width="130" height="26" rx="3" fill="#0B1120" stroke="rgba(148, 163, 184, 0.15)" />
        <text x="290" y="17" fill="#CBD5E1" font-family="'IBM Plex Mono', monospace" font-size="7.5">99H: SBUF (Buffer)</text>
      </g>

      <!-- Bottom Note on Address Rule -->
      <g transform="translate(0, 248)">
        <text x="205" y="16" fill="#34D399" font-size="7" font-weight="600" text-anchor="middle">BIT-ADDRESSABLE RULE: SFR addresses ending in 0H or 8H (e.g. 80H, 88H, 90H...) are bit-addressable</text>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT: NOT ORDINARY RAM CALLOUT (x=495, width=230)            -->
  <!-- ============================================================ -->
  <g transform="translate(495, 75)" filter="url(#shadow-sfr)">
    <rect width="230" height="315" rx="6" fill="#131B2A" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
    <rect width="230" height="26" rx="6" fill="rgba(245, 158, 11, 0.15)" />
    <circle cx="15" cy="13" r="3.5" fill="#F59E0B" />
    <text x="115" y="17" fill="#FBBF24" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.05em">NOT ORDINARY RAM</text>

    <!-- Card 1: Hardware Reaction -->
    <g transform="translate(12, 36)">
      <rect width="206" height="84" rx="4" fill="#1E293B" stroke="rgba(245, 158, 11, 0.25)" />
      <text x="12" y="18" fill="#FDE68A" font-size="8" font-weight="700">HARDWARE RESPONDS</text>
      <text x="12" y="34" fill="#CBD5E1" font-size="7.2">Writing to an SFR doesn't just</text>
      <text x="12" y="46" fill="#CBD5E1" font-size="7.2">store bits into silicon.</text>
      <text x="12" y="60" fill="#94A3B8" font-size="7">It engages peripheral logic, changes</text>
      <text x="12" y="72" fill="#94A3B8" font-size="7">pin voltages, or starts timers.</text>
    </g>

    <!-- Card 2: Code Example -->
    <g transform="translate(12, 128)">
      <rect width="206" height="86" rx="4" fill="#0B1120" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="12" y="18" fill="#38BDF8" font-size="7.5" font-weight="700">EXAMPLE: MOV P1, #0FFH</text>
      <text x="12" y="34" fill="#CBD5E1" font-size="7.2">Does not merely store FFH in RAM.</text>
      <text x="12" y="48" fill="#7DD3FC" font-family="'IBM Plex Mono', monospace" font-size="6.8">Address 90H (Port 1 SFR)</text>
      <text x="12" y="62" fill="#CBD5E1" font-size="7">Directly asserts high voltage states</text>
      <text x="12" y="74" fill="#CBD5E1" font-size="7">on all 8 external physical pins!</text>
    </g>

    <!-- Card 3: Empty Address Gaps -->
    <g transform="translate(12, 222)">
      <rect width="206" height="78" rx="4" fill="#1E293B" stroke="rgba(148, 163, 184, 0.2)" />
      <text x="12" y="18" fill="#CBD5E1" font-size="7.5" font-weight="700">RESERVED GAPS</text>
      <text x="12" y="32" fill="#94A3B8" font-size="7">Out of 128 addresses (80H–FFH),</text>
      <text x="12" y="44" fill="#94A3B8" font-size="7">only 21 are used in the classic 8051.</text>
      <text x="12" y="58" fill="#E2E8F0" font-size="7">Reading unused addresses produces</text>
      <text x="12" y="70" fill="#E2E8F0" font-size="7">indeterminate/random data.</text>
    </g>
  </g>

  <!-- Bottom banner -->
  <rect x="35" y="402" width="690" height="20" rx="4" fill="rgba(148, 163, 184, 0.05)" />
  <text x="380" y="416" fill="#64748B" font-size="7.5" text-anchor="middle">SFRs are the steering wheel of the 8051: every peripheral and CPU behavior is commanded through these addresses</text>
</svg>
