<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="cls-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="cls-grad-env" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="cls-grad-mcu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Markers -->
    <marker id="cls-arrow-sky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="cls-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399" />
    </marker>
    <marker id="cls-arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FBBF24" />
    </marker>
    <marker id="cls-arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818CF8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#cls-grid)" />
  <rect x="12" y="12" width="736" height="356" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="380" y="36" fill="#E2E8F0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.08em">THE CLOSED-LOOP SYSTEM</text>
  <text x="380" y="52" fill="#94A3B8" font-size="8.5" text-anchor="middle">How a microcontroller observes, decides, and acts continuously in the physical world</text>

  <!-- TOP CONTAINER: PHYSICAL ENVIRONMENT -->
  <g transform="translate(180, 72)">
    <rect width="400" height="46" rx="8" fill="url(#cls-grad-env)" stroke="#38BDF8" stroke-width="1.2" />
    <text x="200" y="20" fill="#38BDF8" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.1em">PHYSICAL ENVIRONMENT</text>
    <text x="200" y="35" fill="#E2E8F0" font-size="8.5" text-anchor="middle">Physical conditions change · e.g., Ambient temperature rises</text>
  </g>

  <!-- STEP 1: SENSE (Left) -->
  <g transform="translate(48, 148)">
    <rect width="180" height="96" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <rect width="180" height="24" rx="8" fill="rgba(56, 189, 248, 0.12)" />
    <circle cx="16" cy="12" r="3.5" fill="#38BDF8" />
    <text x="90" y="16" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">1. SENSE</text>
    
    <text x="90" y="44" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Sensor detects change</text>
    <text x="90" y="58" fill="#94A3B8" font-size="7.5" text-anchor="middle">Thermistor · ADC conversion</text>
    <text x="90" y="72" fill="#64748B" font-size="7.5" text-anchor="middle">Physical voltage → Digital value</text>
  </g>

  <!-- STEP 2: MICROCONTROLLER (Center: Process + Decide) -->
  <g transform="translate(268, 140)">
    <!-- Outer IC Outline -->
    <rect width="224" height="120" rx="10" fill="url(#cls-grad-mcu)" stroke="#818CF8" stroke-width="1.8" />
    <rect width="224" height="24" rx="10" fill="rgba(129, 140, 248, 0.16)" />
    <circle cx="16" cy="12" r="3.5" fill="#818CF8" />
    <text x="112" y="16" fill="#C7D2FE" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.06em">MICROCONTROLLER</text>

    <!-- IC Pins (Left & Right) -->
    <rect x="-6" y="38" width="6" height="5" fill="#818CF8" rx="1" />
    <rect x="-6" y="56" width="6" height="5" fill="#818CF8" rx="1" />
    <rect x="-6" y="74" width="6" height="5" fill="#818CF8" rx="1" />
    <rect x="-6" y="92" width="6" height="5" fill="#818CF8" rx="1" />

    <rect x="224" y="38" width="6" height="5" fill="#34D399" rx="1" />
    <rect x="224" y="56" width="6" height="5" fill="#34D399" rx="1" />
    <rect x="224" y="74" width="6" height="5" fill="#34D399" rx="1" />
    <rect x="224" y="92" width="6" height="5" fill="#34D399" rx="1" />

    <!-- 2a. PROCESS -->
    <rect x="16" y="34" width="192" height="34" rx="5" fill="#0F172A" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <text x="112" y="48" fill="#A5B4FC" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">2. PROCESS</text>
    <text x="112" y="60" fill="#94A3B8" font-size="7.5" text-anchor="middle">CPU reads sensor value &amp; evaluates limits</text>

    <!-- 2b. DECIDE -->
    <rect x="16" y="74" width="192" height="34" rx="5" fill="#0F172A" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <text x="112" y="88" fill="#A5B4FC" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.04em">3. DECIDE</text>
    <text x="112" y="100" fill="#94A3B8" font-size="7.5" text-anchor="middle">Algorithm determines action · e.g., Turn on fan</text>
  </g>

  <!-- STEP 3: ACT (Right) -->
  <g transform="translate(532, 148)">
    <rect width="180" height="96" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.5" />
    <rect width="180" height="24" rx="8" fill="rgba(52, 211, 153, 0.12)" />
    <circle cx="16" cy="12" r="3.5" fill="#34D399" />
    <text x="90" y="16" fill="#34D399" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.06em">4. ACT</text>

    <text x="90" y="44" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle">Actuator driven</text>
    <text x="90" y="58" fill="#94A3B8" font-size="7.5" text-anchor="middle">GPIO / Timer PWM signal</text>
    <text x="90" y="72" fill="#64748B" font-size="7.5" text-anchor="middle">Cooling fan spins · Valve opens</text>
  </g>

  <!-- BOTTOM STATUS / RE-SENSING BANNER -->
  <g transform="translate(180, 304)">
    <rect width="400" height="42" rx="8" fill="#151E2E" stroke="#FBBF24" stroke-width="1.2" />
    <text x="200" y="18" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.08em">5. SENSE AGAIN (THE CLOSED LOOP)</text>
    <text x="200" y="32" fill="#E2E8F0" font-size="8" text-anchor="middle">The action alters the environment → Controller senses the new state</text>
  </g>

  <!-- FLOW CONNECTORS & ARROWS -->

  <!-- Flow 1: Environment -> SENSE (Top-left curve) -->
  <path d="M 230 118 C 180 118 138 128 138 144" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#cls-arrow-sky)" />

  <!-- Flow 2: SENSE -> Microcontroller (Left to center) -->
  <line x1="228" y1="196" x2="264" y2="196" stroke="#38BDF8" stroke-width="2" marker-end="url(#cls-arrow-sky)" />

  <!-- Flow 3: Microcontroller -> ACT (Center to right) -->
  <line x1="492" y1="196" x2="528" y2="196" stroke="#34D399" stroke-width="2" marker-end="url(#cls-arrow-emerald)" />

  <!-- Flow 4: ACT -> Environment alteration (Right down to bottom) -->
  <path d="M 622 244 C 622 284 560 304 490 304" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#cls-arrow-emerald)" />

  <!-- Flow 5: Loop continuation back to Environment & Sensing (Bottom left curve up) -->
  <path d="M 270 304 C 200 304 80 290 80 248" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#cls-arrow-amber)" />

  <!-- Dynamic Cycle Badge in Center Below MCU -->
  <g transform="translate(320, 268)">
    <rect width="120" height="22" rx="11" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(251, 191, 36, 0.5)" stroke-width="1" />
    <text x="60" y="14" fill="#FBBF24" font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="0.05em">CONTINUOUS LOOP</text>
  </g>

</svg>
