<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="100%" style="background:#0F172A; font-family:'DM Sans', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148,163,184,0.04)" stroke-width="1"/>
    </pattern>
    <marker id="jump-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF6868" />
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="10" y="10" width="620" height="220" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1" />

  <!-- Lanes Labels -->
  <text x="30" y="55" fill="#10B981" font-family="monospace" font-size="9" font-weight="bold">HIGH PRIORITY (ISR B)</text>
  <text x="30" y="115" fill="#F59E0B" font-family="monospace" font-size="9" font-weight="bold">LOW PRIORITY (ISR A)</text>
  <text x="30" y="175" fill="#3B82F6" font-family="monospace" font-size="9" font-weight="bold">BACKGROUND (MAIN)</text>

  <!-- Lane dividers -->
  <line x1="30" y1="80" x2="610" y2="80" stroke="rgba(148,163,184,0.08)" stroke-width="1" />
  <line x1="30" y1="140" x2="610" y2="140" stroke="rgba(148,163,184,0.08)" stroke-width="1" />

  <!-- Active Execution Blocks -->
  <!-- 1. Main thread runs -->
  <rect x="180" y="160" width="80" height="30" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="220" y="178" fill="#3B82F6" font-size="9" text-anchor="middle">Main Thread</text>

  <!-- 2. Jump to Low Priority (at x = 260) -->
  <path d="M 260 175 V 135" fill="none" stroke="#EF6868" stroke-width="2" marker-end="url(#jump-arrow)" />
  <text x="250" y="152" fill="#EF6868" font-size="7" text-anchor="end">IRQ A occurs</text>

  <!-- 3. Low Priority ISR runs (x = 260 to 360) -->
  <rect x="270" y="100" width="80" height="30" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
  <text x="310" y="118" fill="#F59E0B" font-size="9" text-anchor="middle">Low ISR A</text>

  <!-- 4. Preempted by High Priority (at x = 350) -->
  <path d="M 350 115 V 75" fill="none" stroke="#EF6868" stroke-width="2" marker-end="url(#jump-arrow)" />
  <text x="340" y="92" fill="#EF6868" font-size="7" text-anchor="end">IRQ B occurs (preempt)</text>

  <!-- 5. High Priority ISR runs (x = 360 to 460) -->
  <rect x="360" y="40" width="100" height="30" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <text x="410" y="58" fill="#10B981" font-weight="bold" font-size="9" text-anchor="middle">High ISR B</text>

  <!-- 6. Return from High Priority (at x = 460) -->
  <path d="M 460 70 V 105" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#return-arrow)" />
  <text x="470" y="90" fill="#A78BFA" font-size="7" text-anchor="start">ISR B completes</text>

  <!-- 7. Low Priority ISR resumes (x = 470 to 520) -->
  <rect x="470" y="100" width="50" height="30" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
  <text x="495" y="118" fill="#F59E0B" font-size="9" text-anchor="middle">Resume A</text>

  <!-- 8. Return from Low Priority (at x = 520) -->
  <path d="M 520 130 V 165" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#return-arrow)" />
  <text x="530" y="150" fill="#A78BFA" font-size="7" text-anchor="start">ISR A completes</text>

  <!-- 9. Main thread resumes -->
  <rect x="530" y="160" width="70" height="30" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="565" y="178" fill="#3B82F6" font-size="9" text-anchor="middle">Resume Main</text>

  <!-- Background indicator -->
  <path d="M 40 175 H 180" fill="none" stroke="#3B82F6" stroke-width="2" />
  <path d="M 260 175 H 530" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M 270 115 H 470" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="1.5" stroke-dasharray="3,3" />

  <text x="320" y="215" fill="#64748B" font-size="9" text-anchor="middle">Nested Execution: High-priority interrupts preempt low-priority interrupts in hardware.</text>
</svg>
